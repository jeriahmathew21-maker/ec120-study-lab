 exam"}, {"id": "c168", "topic": 7, "type": "mc", "challenge": true, "prompt": "“The tax reduces sales by 10 units in this model” is…", "options": ["A guarantee every person loses", "Normative because taxes are political", "A statement that the tax is fair", "Positive analysis"], "answer": 3, "explanation": "This is a testable prediction about outcomes, not a value judgment about whether to adopt the tax.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c169", "topic": 7, "type": "mc", "challenge": true, "prompt": "An efficient outcome need not be equitable because…", "options": ["Maximizing total surplus does not determine who receives it", "Any unequal outcome must have zero total surplus", "Efficiency always requires identical incomes", "Equity and efficiency are synonyms"], "answer": 0, "explanation": "Efficiency concerns aggregate gains; equity concerns distribution and fairness. Individual winners and losers can differ.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c170", "topic": 7, "type": "mc", "challenge": true, "prompt": "A seller knows a used phone has a hidden defect that buyers cannot verify. Valuable trades may fail because of…", "options": ["Productive efficiency by definition", "Asymmetric information", "A normal income effect alone", "A positive network effect necessarily"], "answer": 1, "explanation": "Unequal information about quality can obstruct mutually beneficial trades. This is a market-failure mechanism.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c171", "topic": 7, "type": "mc", "challenge": true, "prompt": "A factory’s pollution harms neighbours and the harm is excluded from private decisions. In the basic model, market output may be…", "options": ["Too low because all externalities increase demand", "Required to fall to zero for efficiency", "Efficient by definition", "Too high relative to the social optimum"], "answer": 3, "explanation": "Negative external effects add unaccounted social costs. Efficient production balances social costs and benefits, not necessarily eliminating all output.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c172", "topic": 7, "type": "mc", "challenge": true, "prompt": "A homeowner’s garden benefits neighbours who do not pay. Ignoring those benefits can cause…", "options": ["No private benefit to the owner", "Automatic efficient provision", "Too much gardening in every case", "Too little gardening relative to the efficient amount"], "answer": 3, "explanation": "Private choices omit some benefits received by others, so positive externalities can lead to underprovision.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c173", "topic": 7, "type": "mc", "challenge": true, "prompt": "A firm with market power restricts otherwise beneficial trades. The key efficiency concern is…", "options": ["Some units with buyer value above resource cost are not traded", "Consumer spending alone must equal total surplus", "Every dollar of profit is automatically DWL", "All firm revenue disappears"], "answer": 0, "explanation": "Lost beneficial trades destroy surplus. Profit and other transfers are not themselves proof of destroyed total surplus.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c174", "topic": 7, "type": "mc", "challenge": true, "prompt": "A binding price ceiling rations output to random buyers. Compared with allocating the same units to highest-value buyers, total surplus can be…", "options": ["Higher because lower willingness to pay always means greater benefit", "Zero whenever price is below equilibrium", "Lower because allocation as well as quantity can be inefficient", "Identical by definition regardless of who buys"], "answer": 2, "explanation": "Standard quantity triangles may assume efficient allocation. Misallocation adds losses when high-value buyers are excluded.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c175", "topic": 7, "type": "mc", "challenge": true, "prompt": "A correction to market failure should be evaluated by…", "options": ["Whether it increases output in every market", "Whether it makes any price lower", "Its effects on total social benefits and costs, including policy distortions", "Whether government revenue is maximized regardless of harm"], "answer": 2, "explanation": "Government can improve outcomes or create additional distortions. A policy’s label alone does not establish efficiency.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c176", "topic": 8, "type": "mc", "challenge": true, "prompt": "A can make 12 reports or 6 videos per day; B can make 8 reports or 8 videos. A’s opportunity cost of one report is…", "options": ["1 video", "6 videos", "2 videos", "0.5 video"], "answer": 3, "explanation": "For output maxima, OC(report)=forgone videos/max reports=6/12=0.5. B’s is8/8=1.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c177", "topic": 8, "type": "mc", "challenge": true, "prompt": "Using A:12 reports or6 videos, B:8 reports or8 videos, comparative advantage is…", "options": ["B in both", "A in both", "A in reports, B in videos", "B in reports, A in videos"], "answer": 2, "explanation": "A report costs0.5 video versusB’s1. A video costs2 reports versusB’s1. Compare ratios, not just absolute outputs.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c178", "topic": 8, "type": "mc", "challenge": true, "prompt": "A needs 2 hours per chair and 4 per table. B needs 3 hours per chair and 9 per table. Who has comparative advantage in chairs?", "options": ["Neither because A is faster at both", "Both equally", "A", "B"], "answer": 3, "explanation": "A chair costs2/4=0.5 table; B chair costs3/9=1/3 table. B sacrifices fewer tables despite taking longer.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c179", "topic": 8, "type": "mc", "challenge": true, "prompt": "Using A:2h/chair,4h/table and B:3h/chair,9h/table, A’s opportunity cost of a table is…", "options": ["2 chairs", "0.5 chair", "3 chairs", "4 chairs"], "answer": 0, "explanation": "A table consumes4h, enough for2 chairs. Time-per-unit ratios differ from output-maxima ratios.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c180", "topic": 8, "type": "mc", "challenge": true, "prompt": "One worker makes 24 muffins OR 6 cakes per hour. The opportunity cost of 3 cakes is…", "options": ["18 muffins", "8 muffins", "12 muffins", "4 muffins"], "answer": 2, "explanation": "Each cake costs24/6=4 muffins. Three cakes sacrifice12 muffins.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c181", "topic": 8, "type": "mc", "challenge": true, "prompt": "A makes 10 X or5 Y; B makes 6 X or6 Y per day. A has…", "options": ["No comparative advantage because B makes more Y", "Comparative advantage in Y only", "Absolute advantage in X and comparative advantage in X", "Absolute advantage in both goods"], "answer": 2, "explanation": "A produces moreX, and its OC(X)=0.5Y versusB’s1Y. B has advantage inY.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c182", "topic": 8, "type": "mc", "challenge": true, "prompt": "A produces 20 X or10 Y; B produces10 X or5 Y. The two producers…", "options": ["Have opposite comparative advantages", "Must gain from specialization because A is faster", "Have zero opportunity costs", "Have identical opportunity costs despite different absolute productivity"], "answer": 3, "explanation": "Both sacrifice0.5Y perX (or2X perY). A is twice as productive in both; no differing trade-off creates specialization gains in this simple model.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c183", "topic": 8, "type": "mc", "challenge": true, "prompt": "A’s cost of 1 cake is2 muffins; B’s is5 muffins. A exports cakes. Which exchange rate can make BOTH strictly better off?", "options": ["1 cake for1 muffin", "1 cake for2 muffins", "1 cake for6 muffins", "1 cake for3 muffins"], "answer": 3, "explanation": "A needs more than2 muffins to gain; B needs to pay fewer than5. Three lies strictly between. At2,A is only indifferent.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c184", "topic": 8, "type": "mc", "challenge": true, "prompt": "A’s cost of one report is2 charts; B’s is4 charts. Trade at 1 report for5 charts would…", "options": ["Be mutually beneficial because any trade rate works", "Benefit both strictly", "Benefit A as report seller but not B as report buyer", "Benefit B but not A"], "answer": 2, "explanation": "A gains by receiving more than2, but B could make a report itself for4 and will not gain from paying5.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c185", "topic": 8, "type": "mc", "challenge": true, "prompt": "A needs20 minutes per poster and30 per delivery. B needs15 per poster and60 per delivery. Each has6 hours. Efficient specialization by comparative advantage gives…", "options": ["A makes24 posters; B makes12 deliveries", "B makes24 posters; A makes12 deliveries", "B makes18 posters; A makes6 deliveries", "A makes18 posters; B makes6 deliveries"], "answer": 1, "explanation": "A poster costs2/3 delivery; B poster costs1/4 delivery, soB specializes in posters. A specializes in deliveries:360/30=12.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c186", "topic": 8, "type": "mc", "challenge": true, "prompt": "For A:20min/poster,30min/delivery and B:15min/poster,60min/delivery, each initially spends3h on each task. Total initial output is…", "options": ["12 posters and21 deliveries", "21 posters and9 deliveries", "18 posters and6 deliveries", "24 posters and12 deliveries"], "answer": 1, "explanation": "A makes180/20=9 posters and180/30=6 deliveries. B makes12 posters and3 deliveries: totals21 and9.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c187", "topic": 8, "type": "mc", "challenge": true, "prompt": "Using those initial totals21 posters/9 deliveries and specialization totals24 posters/12 deliveries, gains are…", "options": ["21 posters and9 deliveries", "3 posters and3 deliveries", "24 posters and12 deliveries", "3 posters and12 deliveries"], "answer": 1, "explanation": "Subtract initial production from specialized production separately for each good. Do not report the new totals as the gains.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c188", "topic": 8, "type": "mc", "challenge": true, "prompt": "A has8h and can make4 X/hour or2 Y/hour. B has8h and can make2 X/hour or4 Y/hour. With each initially splitting time equally, full specialization adds…", "options": ["32 X and32 Y", "16 X and16 Y", "No output", "8 X and8 Y"], "answer": 3, "explanation": "InitiallyX=16+8=24,Y=8+16=24. Specialization gives32 of each, an8-unit gain in each.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c189", "topic": 8, "type": "mc", "challenge": true, "prompt": "A’s cost of 1 X falls from3 Y to1 Y after an X-specific improvement. B’s remains2 Y. Comparative advantage in X…", "options": ["Stays with B because technology never changes trade-offs", "Switches from B to A", "Stays with A in both periods", "Disappears because both have absolute advantage"], "answer": 1, "explanation": "InitiallyB has lowerOC2<3; afterwardA has lowerOC1<2. Comparative advantage can change.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c190", "topic": 8, "type": "mc", "challenge": true, "prompt": "If A has comparative advantage in X in a two-good, two-person model with different opportunity costs, B generally has…", "options": ["Zero cost of Y", "Absolute advantage in both necessarily", "Comparative advantage in X too", "Comparative advantage in Y"], "answer": 3, "explanation": "Opportunity-cost rankings are reciprocal in the two-good model. Lower relative cost inX forA implies lower relative cost inY forB.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c191", "topic": 8, "type": "mc", "challenge": true, "prompt": "A worker is faster at both tasks. Why might assigning one task to a slower colleague still increase combined output?", "options": ["There are no opportunity costs when people cooperate", "Absolute advantage alone determines every allocation", "The faster worker may have a larger relative advantage in the other task", "Slower workers always have lower money wages"], "answer": 2, "explanation": "Specialization follows comparative advantage: who gives up less of the alternative output, not who is fastest in isolation.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c192", "topic": 8, "type": "mc", "challenge": true, "prompt": "A doctor can do an administration task in20min, an assistant in30min. Should the doctor necessarily do it?", "options": ["No; compare what each gives up during that time", "Yes; absolute speed is the only relevant criterion", "Yes; opportunity costs are equal because the task is identical", "No; doctors can never do administration efficiently"], "answer": 0, "explanation": "The doctor may sacrifice highly valuable clinical work. Different next-best uses can outweigh the doctor’s absolute speed advantage.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c193", "topic": 8, "type": "mc", "challenge": true, "prompt": "A prediction-market contract pays $1 if an event happens and $0 otherwise. Its defining feature is…", "options": ["A payoff independent of outcomes", "An absence of risk", "A guaranteed accurate forecast", "Payoff contingent on an uncertain event"], "answer": 3, "explanation": "Prediction markets aggregate beliefs/information through event-linked contracts. Prices and forecasts are not guaranteed correct.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c194", "topic": 8, "type": "mc", "challenge": true, "prompt": "A company lets departments buy and sell computing capacity internally. The main allocation mechanism is…", "options": ["An internal market using prices to compare competing uses", "A consumer price ceiling", "A guarantee that each department gets equal capacity", "The elimination of resource scarcity"], "answer": 0, "explanation": "Internal markets can communicate opportunity costs among organizational units. They do not make resources unlimited.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c195", "topic": 8, "type": "mc", "challenge": true, "prompt": "Why can a central allocator struggle to choose the best use of every resource?", "options": ["Opportunity costs are always zero", "Relevant knowledge is dispersed across many people and situations", "Every person already knows all relevant facts", "Market prices contain no information in any setting"], "answer": 1, "explanation": "The knowledge problem concerns dispersed, local or missing information. Prices can help communicate it without guaranteeing perfection.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c196", "topic": 8, "type": "mc", "challenge": true, "prompt": "A rise in the price of a scarce input can help coordinate decisions by…", "options": ["Signalling scarcity and encouraging economizing and alternative supply", "Eliminating the input’s opportunity cost", "Guaranteeing all buyers can buy the same amount", "Proving the resulting distribution is fair"], "answer": 0, "explanation": "Prices convey information and incentives. Coordination does not automatically establish equity or eliminate market failures.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c197", "topic": 8, "type": "mc", "challenge": true, "prompt": "Specialization raises combined production. Does it guarantee each person gains regardless of exchange terms?", "options": ["Yes; any exchange ratio guarantees gains", "No; distribution and terms of exchange determine individual gains", "No; combined production cannot rise", "Yes; each person must consume all their own output"], "answer": 1, "explanation": "A larger total creates potential gains. Both benefit when they can trade on suitable terms and related assumptions hold.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c198", "topic": 8, "type": "mc", "challenge": true, "prompt": "One unit of X costs A4 Y and B2 Y. Who should specialize in Y under the basic comparative-advantage rule?", "options": ["Neither can produce Y", "Both must specialize in X", "B", "A"], "answer": 3, "explanation": "OC(Y) is reciprocal: A gives up1/4X, B gives up1/2X. A has the lower cost ofY; B has advantage inX.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c199", "topic": 8, "type": "mc", "challenge": true, "prompt": "A produces 30 X or10 Y; B produces18 X or9 Y. Which is correct?", "options": ["A has absolute advantage in both, but B has comparative advantage in Y", "B has absolute advantage in Y", "A has comparative advantage in both", "Their opportunity costs are identical"], "answer": 0, "explanation": "A’s OC(Y)=3X, B’s=2X. B is relatively better atY despite lower absolute productivity in both.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "c200", "topic": 8, "type": "mc", "challenge": true, "prompt": "A’s opportunity cost of 1 X is0.5 Y; B’s is1.5 Y. At an exchange rate of1 X for1 Y, each unit traded generates…", "options": ["A loss of0.5 Y for A", "A gain of0.5 Y for A as X seller and a saving of0.5 Y for B as X buyer", "No gains because exchange values must equal both costs", "A gain of1.5 Y for both"], "answer": 1, "explanation": "A sells an item costing0.5Y for1Y, gaining0.5Y. B buys for1Y instead of making it for1.5Y, saving0.5Y.", "source": "Original advanced practice · 2026 Chapter 8 concepts; lecture models, not an official exam"}, {"id": "p2025q1", "topic": 1, "type": "mc", "past2025": true, "originalNumber": 1, "prompt": "In a world characterized by scarcity", "options": ["opportunity cost is zero.", "people must make choices among alternatives.", "individuals need not work to obtain goods.", "we are not limited by time."], "answer": 1, "explanation": "Scarcity forces choices among alternatives, including uses of time.", "source": "Supplied EC120 Fall 2025 midterm · original Question 1 · highlighted source choice, independently checked"}, {"id": "p2025q2", "topic": 1, "type": "mc", "past2025": true, "originalNumber": 2, "prompt": "Sookie advertises her bicycle for sale online for $1,000 but is willing to accept $700. The best offer she receives is $500. Why does she not sell her bicycle?", "options": ["Her marginal cost is more than the best offer she receives.", "The opportunity cost is too high.", "Her consumer surplus is $200, which is not close enough to her reservation price.", "She would be paying $200 for someone to take the bicycle."], "answer": 0, "explanation": "The supplied paper highlights A. Keeping the bicycle is worth $700 to Sookie, above the $500 offer, so selling is not worthwhile. Wording note: B is also a plausible opportunity-cost description; this score follows the highlighted source choice, not a verified instructor key.", "source": "Supplied EC120 Fall 2025 midterm · original Question 2 · highlighted source choice, independently checked · wording assumption noted"}, {"id": "p2025q4", "topic": 6, "type": "mc", "past2025": true, "originalNumber": 4, "prompt": "The table shows the quantity demanded and quantity supplied of kombucha at various prices. If the government imposes a price ceiling of $3 per bottle of kombucha, the quantity of kombucha supplied will be _____ bottles.", "options": ["7", "8.", "9", "10"], "answer": 1, "explanation": "The $3 ceiling is above the $2.75 equilibrium and is nonbinding. The market remains at $2.75 with 8 bottles supplied. Do not force price to the ceiling.", "source": "Supplied EC120 Fall 2025 midterm · original Question 4 · highlighted source choice, independently checked", "figure": "<div class=\"pasttable\"><strong>Table: The Market for Kombucha</strong><table><thead><tr><th>Price ($/unit)</th><th>Quantity Demanded</th><th>Quantity Supplied</th></tr></thead><tbody><tr><td>2.50</td><td>10</td><td>7</td></tr><tr><td>2.75</td><td>8</td><td>8</td></tr><tr><td>3.00</td><td>6</td><td>9</td></tr><tr><td>3.25</td><td>4</td><td>10</td></tr><tr><td>3.50</td><td>2</td><td>11</td></tr></tbody></table></div>"}, {"id": "p2025q5", "topic": 3, "type": "mc", "past2025": true, "originalNumber": 5, "prompt": "Blake has successfully launched a massage therapy business, but he now receives more requests for bookings than his availability. He must determine how many new therapists to hire. Blake currently provides 15 total weekly massages. Hiring the first therapist would bring the total to 40 massages per week. Adding a second therapist will result in 60 total massages per week. The third and fourth therapists will result in 75 and 80 total weekly massages. A client pays $120 for a massage, and Blake pays therapists $1,000 per week. How many therapists should Blake add to his team?", "options": ["one", "two", "three", "four"], "answer": 2, "explanation": "The added therapists contribute 25,20,15,5 massages. At $120 each, their marginal revenues are $3000,$2400,$1800,$600 per week. Hire the first three; the fourth generates less than its $1000 wage.", "source": "Supplied EC120 Fall 2025 midterm · original Question 5 · highlighted source choice, independently checked"}, {"id": "p2025q6", "topic": 6, "type": "mc", "past2025": true, "originalNumber": 6, "prompt": "The graph shows the market for haircuts at barbershops in Ottawa. Suppose that a binding price ceiling of $25 is removed. The number of items sold in this market will:", "options": ["decrease from 25 to 30.", "decrease from 75 to 50.", "increase from 40 to 50.", "increase from 50 to 75."], "answer": 2, "explanation": "At the $25 ceiling, only 40 haircuts are supplied and sold. Removing it restores equilibrium at $30 and 50 haircuts: 40 to 50.", "source": "Supplied EC120 Fall 2025 midterm · original Question 6 · highlighted source choice, independently checked", "figure": "<img class=\"pastfigure\" alt=\"Original 2025 midterm diagram\" src=\"data:image/webp;base64,UklGRiA8AABXRUJQVlA4IBQ8AAAwwwCdASqXAVUBPhkMhEGhBIJXTQQAYSzt34z/OR0zLfR8zD5G+t/lV/YvfHpv8//m35b/Iz8HsE/sfxz8m/t39K/aL/R///7Leib83f3P3AP4L/Cv6J/Xv2i/on////P1Vf2b2TeYD+I/yD/hf1z9//m09CfoAfyT+3+iT7BvoAfrj/5fZr/2H/T/0/wTfsb/0/8V8Af8j/oP3sfv//4fwA9AD0AP3/9 NFrksrP0I2uslyTz9wQme8eqey6YWvYQJSRWlkCcxO+h45z8AiARC/iT4feF9SCcXcZTt5OkhjmIFBsB4UaXDR/Rr8RDcHP/hdg/NTccC9DrpeSwc4KmqZv16QP8m2ryEf5QyDB/sHNUMOib+Dif1X4len9NZLl6nhby6YtXNMRSuyDE4wjWMwiVGRS4bBeKNMXjCCbSC7ttCz6Ou7auhBZhS1AEIAEPgYgzhtAH1zxl8t5weFuHhk2717Sl1yD7vUgaPq5ritmy22NEQIrauMOsAAA==\">"}, {"id": "p2025q7", "topic": 1, "type": "mc", "past2025": true, "originalNumber": 7, "prompt": "Which of these might be considered in a cost-benefit analysis used to determine whether a person should cycle to work or ride the subway? (i) The air pollution the cyclist must breathe. (ii) The cost of subway tickets. (iii) The time it takes to cycle to work versus riding the subway to work. (iv) The cost per gallon of gasoline.", "options": ["(i), (iii), and (iv)", "(i), (ii), (iii), and (iv)", "(i), (ii), and (iv)", "(i), (ii), and (iii)"], "answer": 3, "explanation": "Pollution exposure, ticket cost and travel time differ between the two alternatives. Gasoline for an unused car is not a direct cost of either choice under the question’s intended comparison.", "source": "Supplied EC120 Fall 2025 midterm · original Question 7 · highlighted source choice, independently checked"}, {"id": "p2025q8", "topic": 8, "type": "mc", "past2025": true, "originalNumber": 8, "prompt": "Denmark and the United States have roughly the same amount of capital available per worker. The United States, however, has over 50 times the population of Denmark, which all but guarantees that the United States can produce more of everything than Denmark. Why would the United States trade with Denmark when it can produce whatever Denmark can in greater amounts?", "options": ["Although the United States probably has an absolute advantage in any single good, Denmark would still enjoy a comparative advantage in some goods.", "Although the United States probably has a comparative advantage in any single good, Denmark would still enjoy an absolute advantage in some goods.", "In the United States, resources are scarce, and the United States will be unable to satisfy all its domestic needs with domestic output only. Denmark has a smaller population, so it will overproduce many items, which it can export.", "Denmark may have an absolute advantage in capital-intensive, as opposed to labor-intensive, goods."], "answer": 0, "explanation": "Absolute productive capacity does not rule out gains from differing opportunity costs. Denmark can have comparative advantage in some goods.", "source": "Supplied EC120 Fall 2025 midterm · original Question 8 · highlighted source choice, independently checked"}, {"id": "p2025q10", "topic": 2, "type": "mc", "past2025": true, "originalNumber": 10, "prompt": "Which of these lists only factors that would cause a decrease in the demand for a good?", "options": ["a decrease in popularity of a good; a rise in income (if the good is an inferior good); a fall in the price of a substitute good", "a decrease in the number of consumers in the market; a rise in the price of a substitute good; a fall in the price of a complementary good", "an increase in congestion effects; a decrease in the number of consumers in the market; increase in popularity of a product", "an increase in network effects; a rise in income (if the good is a normal good); a rise in the price of a substitute good"], "answer": 0, "explanation": "Lower popularity, higher income for an inferior good, and a cheaper substitute all reduce demand at each own price.", "source": "Supplied EC120 Fall 2025 midterm · original Question 10 · highlighted source choice, independently checked"}, {"id": "p2025q11", "topic": 8, "type": "mc", "past2025": true, "originalNumber": 11, "prompt": "If they bake only muffins, in a single day Gregory can bake 10 muffins, and Gabriella can bake 5 muffins. If they bake only cookies, in a single day Gregory can bake 10 cookies, and Gabriella can bake 4 cookies. We know that _____ has an absolute advantage and a comparative advantage in baking _____.", "options": ["Gregory; muffins", "Gregory; cookies", "Gabriella; muffins", "Gabriella; cookies"], "answer": 1, "explanation": "Gregory produces more cookies (10 versus 4) and sacrifices 1 muffin per cookie, versus Gabriella’s 5/4 muffins. Gregory has both advantages in cookies.", "source": "Supplied EC120 Fall 2025 midterm · original Question 11 · highlighted source choice, independently checked"}, {"id": "p2025q12", "topic": 1, "type": "mc", "past2025": true, "originalNumber": 12, "prompt": "Ralph is offered a free ticket to a hockey game—a ticket he cannot resell. His opportunity cost of going to the hockey game is:", "options": ["zero—the ticket was free.", "the price listed on the ticket.", "whatever Ralph would have done had he not gone to the game.", "the price listed on the ticket and whatever Ralph would have done had he not gone to the game."], "answer": 2, "explanation": "The nonresellable free ticket has no forgone resale value, but attending still sacrifices the next-best use of Ralph’s time.", "source": "Supplied EC120 Fall 2025 midterm · original Question 12 · highlighted source choice, independently checked"}, {"id": "p2025q15", "topic": 7, "type": "mc", "past2025": true, "originalNumber": 15, "prompt": "Which of these markets is LEAST likely to produce the efficient quantity?", "options": ["the market for Apple stocks", "the market for carrots", "the market for flu vaccines", "the market for car batteries"], "answer": 2, "explanation": "The highlighted answer is flu vaccines: benefits to other people can cause the private market to underprovide vaccination. This is the paper’s intended example; other listed markets may also have failures in real settings.", "source": "Supplied EC120 Fall 2025 midterm · original Question 15 · highlighted source choice, independently checked · wording assumption noted"}, {"id": "p2025q17", "topic": 1, "type": "mc", "past2025": true, "originalNumber": 17, "prompt": "Patrick starts using a new baking technique, and he can now do twice as much of everything. In a single day, Patrick can now bake 10 cheesecakes or 8 lasagnas, rather than the 5 cheesecakes and 4 lasagnas he could previously bake. Patrick's production possibility frontier has _____, and his opportunity cost of making lasagnas _____.", "options": ["shifted right; is unchanged", "shifted right; has decreased", "not changed; has increased", "not changed; has decreased"], "answer": 0, "explanation": "The frontier expands, but the trade-off is unchanged: 5/4=10/8 cheesecakes per lasagna.", "source": "Supplied EC120 Fall 2025 midterm · original Question 17 · highlighted source choice, independently checked"}, {"id": "p2025q18", "topic": 7, "type": "mc", "past2025": true, "originalNumber": 18, "prompt": "An industry that generates external benefits produces a quantity of output that is:", "options": ["socially optimal.", "less than the socially optimal quantity.", "greater than the socially optimal quantity.", "socially optimal if a subsidy is given to buyers."], "answer": 1, "explanation": "Unpriced benefits to other people mean private decisions omit some social benefits, so output is below the socially efficient level. This basic positive-externality concept appears in the 2026 Chapter 7 material; detailed Chapter 10 policy models are excluded.", "source": "Supplied EC120 Fall 2025 midterm · original Question 18 · highlighted source choice, independently checked"}, {"id": "p2025q19", "topic": 6, "type": "mc", "past2025": true, "originalNumber": 19, "prompt": "(Figure: The Market for Skateboards) The figure shows the market for skateboards. If the government imposes a $60 tax on skateboards (collected from producers), consumers will pay $_____ of the tax, and producers will pay $_____.", "options": ["30; 30", "40; 20", "20; 40", "10; 50"], "answer": 1, "explanation": "Before tax the curves meet at $120. A $60 wedge produces buyer price $160 and seller receipt $100. Buyers bear $40 and sellers $20.", "source": "Supplied EC120 Fall 2025 midterm · origi  change, the quantity demanded for chicken breast falls by 40%. The absolute value of the price elasticity of demand for chicken breast is _____, and the price elasticity of demand is _____.", "options": ["0.24; elastic", "0.24; inelastic", "4.2; elastic", "4.2; inelastic"], "answer": 2, "explanation": "Midpoint price change=(3.63−3.30)/3.465=9.5238%. Using the given 40% quantity reduction, elasticity magnitude=40/9.5238=4.2, elastic.", "source": "Supplied EC120 Fall 2025 midterm · original Question 20 · highlighted source choice, independently checked"}, {"id": "p2025q22", "topic": 5, "type": "mc", "past2025": true, "originalNumber": 22, "prompt": "If demand is _____, a higher price yields _____ total revenue.", "options": ["inelastic; lower", "inelastic; no change in", "elastic; higher", "elastic; lower"], "answer": 3, "explanation": "With elastic demand, a higher price reduces quantity proportionally more, lowering total revenue.", "source": "Supplied EC120 Fall 2025 midterm · original Question 22 · highlighted source choice, independently checked"}, {"id": "p2025q23", "topic": 3, "type": "mc", "past2025": true, "originalNumber": 23, "prompt": "Which event would shift the supply curve for Ben and Jerry's ice cream to the left?", "options": ["an increase in consumer incomes", "a decrease in the price of Dreyer's ice cream", "a decrease in the price of Ben and Jerry's ice cream", "an increase in the price of cream, an ingredient in ice cream"], "answer": 3, "explanation": "Higher cream prices raise marginal production costs, shifting ice-cream supply left. Own ice-cream price instead changes quantity supplied along S.", "source": "Supplied EC120 Fall 2025 midterm · original Question 23 · highlighted source choice, independently checked"}, {"id": "p2025q24", "topic": 8, "type": "mc", "past2025": true, "originalNumber": 24, "prompt": "If Japan must give up the production of 100 computers to produce 25 additional cellular telephones, the opportunity cost of producing four cellular telephones is _____ computers.", "options": ["4", "16", "25", "79"], "answer": 1, "explanation": "Each telephone costs 100/25=4 computers. Four telephones cost 16 computers.", "source": "Supplied EC120 Fall 2025 midterm · original Question 24 · highlighted source choice, independently checked"}, {"id": "p2025q25", "topic": 2, "type": "mc", "past2025": true, "originalNumber": 25, "prompt": "If ratatouille and Hungarian goulash are substitutes, a decrease in the price of Hungarian goulash will cause the demand for:", "options": ["ratatouille to increase.", "Hungarian goulash to increase.", "ratatouille to decrease.", "Hungarian goulash to increase and the demand for ratatouille to decrease."], "answer": 2, "explanation": "Cheaper goulash draws buyers away from ratatouille, shifting ratatouille demand left. Own-price changes do not themselves increase the demand curve for goulash.", "source": "Supplied EC120 Fall 2025 midterm · original Question 25 · highlighted source choice, independently checked"}, {"id": "p2025q26", "topic": 5, "type": "mc", "past2025": true, "originalNumber": 26, "prompt": "Janelle recently received a promotion at her job, increasing her income from $940 per week to $1,060 per week. As a result, she decides to purchase 9% more sushi per week. Computed using the midpoint method, the income elasticity of Janelle's demand for sushi is:", "options": ["0.75.", "1.33.", "0.90.", "1.00."], "answer": 0, "explanation": "Midpoint income change=120/1000=12%. Divide the given 9% quantity increase by 12%: 0.75.", "source": "Supplied EC120 Fall 2025 midterm · original Question 26 · highlighted source choice, independently checked"}, {"id": "p2025q27", "topic": 2, "type": "mc", "past2025": true, "originalNumber": 27, "prompt": "The market price of cruise ship vacations has increased recently. Some economists suggest that the price increased because of an increase in the number of retirees. In other words, they believe that:", "options": ["quantity demanded increased.", "quantity demanded decreased.", "demand increased.", "demand decreased."], "answer": 2, "explanation": "More retirees increase the number of potential buyers, shifting demand right. A higher cruise price is the resulting equilibrium response.", "source": "Supplied EC120 Fall 2025 midterm · original Question 27 · highlighted source choice, independently checked"}, {"id": "p2025q30", "topic": 3, "type": "mc", "past2025": true, "originalNumber": 30, "prompt": "Charles is a manager at a coffee shop, and he has to decide how many workers to hire. One worker can make 20 drinks that sell for $4 on average in one hour. A second worker can make another 16 drinks in one hour. The marginal benefit of each additional worker decreases by four drinks with each additional hire. Given that workers are paid $15 per hour and have eight-hour shifts, how many employees should Charles hire for each hour?", "options": ["four", "five", "six", "seven"], "answer": 1, "explanation": "Marginal drinks are 20,16,12,8,4,0. Their hourly revenues at $4 are $80,$64,$48,$32,$16,$0. The fifth exceeds the $15 wage; the sixth does not. Eight-hour shifts multiply both benefits and costs equally.", "source": "Supplied EC120 Fall 2025 midterm · original Question 30 · highlighted source choice, independently checked"}, {"id": "p2025q31", "topic": 2, "type": "mc", "past2025": true, "originalNumber": 31, "prompt": "Which graph illustrates the effect on the demand for community college education if the economy falls into a recession?", "options": ["Graph A", "Graph B", "Graph C", "Graph D"], "answer": 3, "explanation": "The supplied paper highlights Graph D (demand shifts right). This assumes community-college education is an inferior good and recession lowers income. The original question does not state that assumption; without it the direction is not uniquely determined. The score follows the marked source choice.", "source": "Supplied EC120 Fall 2025 midterm · original Question 31 · h swer is indeterminate)"], "answer": 1, "explanation": "Supply is less elastic than demand, so sellers bear more tax: the fall in their net price exceeds the rise in buyers’ total price.", "source": "Supplied EC120 Fall 2025 midterm · original Question 33 · highlighted source choice, independently checked"}, {"id": "p2025q35", "topic": 6, "type": "mc", "past2025": true, "originalNumber": 35, "prompt": "Suppose the government subsidizes gasoline either by paying gas suppliers directly, causing the price of gasoline to fall, or giving consumers vouchers, making gasoline more affordable. The accompanying graph shows the effect of the subsidy. You can infer that _____ receive the subsidy in the amount of $_____ per litre, leading to a rise in the quantity of gasoline purchased by _____ litres.", "options": ["buyers; 2; 4,000", "sellers; 2; 4,000", "buyers; 1; 2,000", "sellers; 1; 2,000"], "answer": 0, "explanation": "The graph shifts demand upward by $2, representing a buyer subsidy. Quantity rises from 12 thousand to 16 thousand litres, an increase of 4000. Buyers’ net price and sellers’ receipts differ by $2; the two-price outcome is equivalent if legally paid to sellers.", "source": "Supplied EC120 Fall 2025 midterm · original Question 35 · highlighted source choice, independently checked", "figure": "<img class=\"pastfigure\" alt=\"Original 2025 midterm diagram\" src=\"data:image/webp;base64,UklGRkZEAABXRUJQVlA4IDpEAACwvQCdASoyATYBPhkKhEGhBKb5NwQAYSxt34PBIvgv9zZEOI0ib+EvkHes43+MX9Z/YbqtNqu9P4x+4B+AHwrEm9PvUf5v+R/+B////p+/3+Y/rvtV/IH+I9wD+DfwP+F/kh/f////7fD15gP4N/GP99/bP31+V//Afsl7iP07/2f9u/wHyAfo9/y/zv+F32K/6T/mfYA/ZH1Wf7v/rf819/////Q39cf+d/d/v////6A/yf+g/5r8r/3////4AegB6i/8A/ej3r+Ff4Re674v+r/7H/A/sn+0PsD+H/UP2f8cf23/yXx4/5Hju6W/4H5Je438W+2H3v/A/rj/dP+p/nfm/wX+Sn+p9tPyC/iP8n/wf4yf3T/o/5z5IfWP1n7/nMP7B+yPsC+pvzz+/f4/9h/7X/6/9d8Q3qf/g/t/qf+Kf1H/f/4z93voA/i/8y/r/5Cf2f/vfHX/G/1XjCfQv8X/3P+J+2H0Afyj+e/3P/Ff6v/Pf3X/4fZ5+z/9D/F/6X/2f6b2WfmP+B/7P+V/cX/J//X8BP5R/SP8X/hv2d/v3/ : 4, "type": "mc", "past2025": true, "originalNumber": 40, "prompt": "In the market for chimichangas, a normal good, you observe that the equilibrium price and quantity have decreased. This can be caused by:", "options": ["a decrease in the price of hamburger meat.", "a decrease in the salaries of chimichanga shop workers.", "more chimichanga shops opening up.", "a decrease in the incomes of people who love to eat chimichangas."], "answer": 3, "explanation": "For a normal good, lower income shifts demand left, reducing equilibrium price and quantity. The other options expand supply, lowering price but raising quantity.", "source": "Supplied EC120 Fall 2025 midterm · original Question 40 · highlighted source choice, independently checked"}];</script><script>const TOPICS=['','Choices & opportunity cost','Demand & consumer choice','Supply & producer choice','Market equilibrium','Elasticity','Taxes & market rules','Efficiency & market failure','Comparative advantage'];
const NOTES=[null,
['Start with the next-best alternative.',['Scarcity forces choices. Economic cost includes direct costs and the value of what you give up. Do not add every rejected alternative.','Ignore sunk costs: only costs and benefits that differ between your current choices matter.','Take another step if marginal benefit ≥ marginal cost. In discrete problems, stop before the next unit costs more than it benefits you.','A PPF shows feasible production: on = efficient, inside = inefficient, outside = unattainable today. With pizza on x and burgers on y, the absolute slope is burgers forgone per pizza.','Interdependence means other people, markets, expectations and your other decisions affect your best choice. A framing effect changes choices by changing the description of the same outcome.']],
['Demand is willingness to pay at the margin.',['Buy units with MB ≥ price. Diminishing marginal benefit explains the usual downward slope.','Market demand adds individual quantities at the SAME price: add horizontally, not vertically.','Own price changes → movement along D. Income, tastes, related prices, expectations, users and buyer numbers → shifts.','Normal good: income ↑ → D right. Inferior good: income ↑ → D left.','Substitute price ↑ → D right. Complement price ↑ → D left. More users can increase value (network) or reduce it (congestion).']],
['Supply is the cost of one more unit.',['For a competitive price-taking seller, produce units with MC ≤ price. Rising MC produces the usual upward supply slope.','Extra ingredients and labour are variable costs. A committed fixed cost does not change the cost of one more unit.','Own price changes → movement along S. Changes in marginal cost or seller numbers → shifts.','Input prices ↑ → S left; better technology → S right; more sellers → market S right.','A more valuable substitute in production raises opportunity cost and shifts S left. A more valuable joint product can shift S right. Expected higher future prices can reduce current supply when sales can be deferred.']],
['Always identify the cause before drawing arrows.',['Equilibrium: Qd = Qs. A shortage creates upward price pressure; a surplus creates downward pressure when prices can adjust.','At a fixed price, actual voluntary trades are limited by min(Qd, Qs), absent government purchases.','D right → P ↑, Q ↑. D left → P ↓, Q ↓. S right → P ↓, Q ↑. S left → P ↑, Q ↓.','When two curves shift, analyze them separately. Same-direction predictions are definite; opposing predictions need relative shift sizes.','Demand rising does not itself shift supply: the resulting price rise creates a movement along supply. Prices communicate information and provide incentives.']],
['Elasticity is percentage responsiveness.',['Midpoint change: (new − old) / [(new + old)/2]. Elasticity = %ΔQ / %ΔP. For price elasticity of demand use the absolute value.','Demand: E > 1 elastic; E < 1 inelastic; E = 1 unit elastic. A constant slope does not mean constant elasticity.','Price ↑: total revenue falls with elastic demand, rises with inelastic demand, stays unchanged with unit elasticity over the interval. Revenue is P×Q, not profit.','Keep signs for income and cross-price elasticity. Income E < 0: inferior; 0 < E < 1: normal necessity; E > 1: normal luxury. Cross-price E > 0: substitutes; E < 0: complements.','Demand is often more elastic with substitutes, narrow product definitions, easier search and more time. Supply is often more elastic with available inputs and time to expand capacity.']],
['With a tax or subsidy, keep two prices.',['Tax: Pb − Ps = tax per unit. Tax revenue = tax × quantity AFTER tax. Buyer tax shifts D down; seller tax shifts S up.','Statutory burden is who remits; economic burden is who loses through changed prices. The relatively less elastic side bears more tax.','Subsidy: Ps − Pb = subsidy. Buyers pay less net, sellers receive more, quantity rises; the less elastic side captures more benefit.','Binding ceiling: maximum below equilibrium → shortage. Binding floor: minimum above equilibrium → surplus. A nonbinding rule leaves equilibrium unchanged.','A binding quota sets quantity below equilibrium. Read demand at that quantity for buyer price. To hit a target with a tax, subtract the supply price from the demand price at the target.']],
['Efficiency maximizes total surplus.',['Consumer surplus: below demand and above price. Producer surplus: above supply and below price. For triangles use ½×base×height.','Efficient production uses lowest-cost producers; efficient allocation serves highest willingness-to-pay buyers; efficient quantity has MB = MC.','Efficiency is different from equity. Willingness to pay is affected by income, and higher total surplus does not mean everyone gains.','Market power, externalities, information problems and irrationality can cause market failure. Negative externalities can lead to too much output; positive externalities to too little.','Deadweight loss is destroyed surplus, not a transfer. Underproduction misses MB > MC trades; overproduction adds MC > MB units. For a linear tax wedge without other failures: DWL = ½×tax×quantity reduction. Government can correct failures or create distortions.']],
['Compare opportunity costs, not speed alone.',['Absolute advantage: more output from the same inputs, or fewer inputs per unit. Comparative advantage: lower opportunity cost.','When given time per unit: OC of A = time for A / time for B, measured in units of B.','When given outputs per hour: OC of A = maximum B / maximum A, measured in units of B.','Specialize according to comparative advantage. Someone who is absolutely better at both tasks can still gain from specialization with another person.','Calculate production before and after using actual time allocations. Opportunity costs can change as technology, skills or resources change.']]];
NOTES[5][1].push('Perfectly inelastic: vertical curve, E=0. Perfectly elastic: horizontal curve, limiting E is infinite.');
NOTES[7][1].push('Positive analysis describes or predicts what happens; normative analysis makes a value judgment about what should happen.');
NOTES[8][1].push('Supplemental Chapter 8 vocabulary: internal markets allocate resources within an organization; the knowledge problem is missing or dispersed decision-relevant information; prediction-market payoffs depend on uncertain events.');

function start(mode,topic){if(active&&!confirm('Replace your unfinished session? Previously graded practice answers remain saved.'))return;let ids;if(mode==='pastmock')ids=BANK.filter(q=>q.past2025).sort((a,b)=>a.originalNumber-b.originalNumber).map(q=>q.id);else if(mode==='challenge')ids=shuffle(BANK.filter(q=>q.challenge)).map(q=>q.id);else if(mode==='exam')ids=shuffle(TOPICS.slice(1,9).flatMap((_,i)=>shuffle(BANK.filter(q=>q.topic===i+1&&q.type==='mc'&&!q.challenge&&!q.past2025)).slice(0,5))).map(q=>q.id);else if(mode==='diagnostic')ids=TOPICS.slice(1,9).flatMap((_,i)=>shuffle(BANK.filter(q=>q.topic===i+1&&q.type==='mc'&&!q.challenge&&!q.past2025)).slice(0,2)).map(q=>q.id);else if(mode==='weak')ids=BANK.filter(q=>latest(q.id)&&!latest(q.id).correct).map(q=>q.id);else ids=shuffle(BANK.filter(q=>mode==='topic'?q.topic===topic&&!q.challenge&&!q.past2025:mode==='graphs'?q.type==='graph':q.topic<=8&&!q.challenge&&!q.past2025)).map(q=>q.id);if(!ids.length){alert('No missed questions yet. Start with the diagnostic.');return}active={mode,ids,index:0,responses:{},started:Date.now(),deadline:['exam','pastmock'].includes(mode)?Date.now()+3600000:null,topic};save();showQuestion()}
function resume(){showQuestion()}function current(){return BANK.find(q=>q.id===active.ids[active.index])}function response(){let q=current();return active.responses[q.id]??(active.responses[q.id]={choice:null,text:'',confidence:'unsure',elapsed:0})}let entered=Date.now();function capture(){if(!active||!document.querySelector('.question'))return;let r=response();r.elapsed+=(Date.now()-entered)/1000;entered=Date.now();let txt=document.getElementById('reason');if(txt)r.text=txt.value;let c=document.getElementById('confidence');if(c)r.confidence=c.value;save()}function choose(v){capture();response().choice=v;save();showQuestion(false)}

function showQuestion(scroll=true){clearInterval(ticker);if(!active)return home();if(active.deadline&&Date.now()>=active.deadline)return finish(true);let q=current(),r=response(),exam=['exam','pastmock'].includes(active.mode);entered=Date.now();app.innerHTML=`<div class="quiz"><div class="toolbar"><button onclick="capture();home()">← Save & dashboard</button><span class="pill">${active.mode==='pastmock'?'2025 midterm':active.mode==='challenge'?'Midterm challenge':esc(active.mode)} · ${active.index+1} / ${active.ids.length}</span><b id="timer"></b></div><div class="progress"><div style="width:${100*(active.index+1)/active.ids.length}%"></div></div><article class="question"><div class="eyebrow">${q.past2025?'2025 midterm · Original Question '+q.originalNumber:'Chapter '+q.topic+' · '+TOPICS[q.topic]} · ${q.type==='mc'?(q.challenge?'Midterm challenge · Multiple choice':'Multiple choice'):q.type==='short'?'Super-short answer':'Graph drill'}</div><h2>${q.prompt}</h2>${q.figure?`<div class="graphwrap">${q.figure}</div>`:""}${q.type==='mc'?`<div class="options">${q.options.map((o,i)=>`<button class="option ${r.choice===i?'selected':''}" ${r.graded?'disabled':''} onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>`:q.type==='graph'?`<div class="graphwrap">${graph(r.choice||'')}</div><p class="muted">Choose a change to preview it. Dashed = shifted curve; A → B = movement. Sketches are schematic, not numerical.</p><div class="graphoptions">${Object.entries(GLABELS).map(([k,v])=>`<button class="${r.choice===k?'selected':''}" ${r.graded?'disabled':''} onclick="choose('${k}')">${v}</button>`).join('')}</div>`:''}${!exam?`<label for="reason">${q.type==='short'?'Your answer · aim for 1–3 sentences':'Why this answer? · optional, but useful'}</label><textarea id="reason" ${r.graded||r.revealed?'disabled':''} oninput="response().text=this.value;save()" placeholder="Put the economic rule into your own words…">${esc(r.text)}</textarea><label for="confidence">How sure are you?</label><select id="confidence" onchange="response().confidence=this.value;save()" ${r.graded?'disabled':''}>${['unsure','somewhat sure','confident'].map(v=>`<option ${r.confidence===v?'selected':''}>${v}</option>`).join('')}</select>`:''}${r.graded||r.revealed?feedback(q,r):''}${!exam&&!r.graded&&!r.revealed?`<div class="actions"><button class="primary" onclick="checkAnswer()">${q.type==='short'?'Reveal model answer':'Check answer'} →</button></div>`:''}${!exam?`<div class="source">Source: ${esc(q.source)} · L = lecture; pages refer to PDF pages.</div>`:''}</article><div class="actions"><button ${active.index===0?'disabled':''} onclick="navigate(-1)">← Previous</button>${active.index<active.ids.length-1?'<button onclick="navigate(1)">Next →</button>':''}<button class="${exam?'primary':'quiet'}" onclick="finish()">${exam?'Submit exam':'Finish session'}</button></div>${exam?`<div class="jumplist">${active.ids.map((id,i)=>`<button class="${active.responses[id]?.choice!=null?'done':''}" onclick="capture();active.index=${i};save();showQuestion()">${active.mode==='pastmock'?BANK.find(q=>q.id===id).originalNumber:i+1}</button>`).join('')}</div><p class="muted">Green numbers have an answer. You can return and change choices before submitting.</p>`:''}</div>`;if(scroll)window.scrollTo(0,0);if(exam){tick();ticker=setInterval(tick,1000)}}
function tick(){if(!active?.deadline)return;let left=Math.max(0,Math.ceil((active.deadline-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' remaining';if(!left)finish(true)}function feedback(q,r){return `<div class="feedback ${r.graded&&!r.correct?'wrong':''}"><h3>${q.type==='short'?'Model answer · self-assessed':r.correct?'Correct — here’s why':'Let’s unpack this'}</h3>${q.type==='mc'?`<strong>Answer ${'ABCD'[q.answer]}: ${q.options[q.answer]}</strong>`:q.type==='graph'?`<strong>${GLABELS[q.answer]}</strong><div class="graphwrap">${graph(q.answer)}</div>`:''}<p>${q.explanation}</p>${q.type==='short'&&!r.graded?'<p class="muted">Compare your answer with the key ideas. This is self-assessment, not automated marking.</p><div class="actions"><button onclick="gradeShort(true)">I included the key ideas</button><button onclick="gradeShort(false)">I need more practice</button></div>':''}</div>`}
function record(q,r,self=false){state.attempts.push({id:q.id,topic:q.topic,type:q.type,correct:r.correct,self,choice:r.choice,text:r.text,confidence:r.confidence,seconds:Math.round(r.elapsed),at:new Date().toISOString(),mode:active.mode})}function checkAnswer(){capture();let q=current(),r=response();if(q.type==='short'){if(!r.text.trim()){alert('Try a short answer first. Even an uncertain attempt helps.');return}r.revealed=true}else{if(r.choice==null){alert('Choose an answer first.');return}r.correct=r.choice===q.answer;r.graded=true;record(q,r)}save();showQuestion(false)}function gradeShort(ok){capture();let q=current(),r=response();if(r.graded)return;r.correct=ok;r.graded=true;record(q,r,true);save();showQuestion(false)}function navigate(step){capture();active.index+=step;save();showQuestion()}

function audit(){sethtml(`<button onclick="home()">← Dashboard</button><h1>Study the right rules.</h1><div class="notice"><strong>Scope first:</strong> Your 2026 Lecture 9 and Lectures 7–8 identify Chapters 1–8. The older exam includes material outside your current scope; those questions have been removed. Some supplied sheets even include Chapters 11–20. They are useful references, not proof of this year's coverage. No practice bank can guarantee the actual questions or a 100% score.</div><article class="card studycard"><h2>Corrections to shortcuts in the sheets</h2><ul><li>Elastic demand has |E| &gt; 1; inelastic demand has |E| &lt; 1. One handwritten sheet reverses these labels.</li><li>A price taker cannot materially influence the market price. One sheet says the opposite.</li><li>Own price changes quantity demanded/supplied along a curve. They do not, by themselves, shift demand/supply.</li><li>Normal goods: income rises → demand rises. Inferior goods: income rises → demand falls.</li><li>Substitutes replace each other; complements are used together. Keep consumption relationships separate from production relationships.</li><li>The less elastic side bears more tax or captures more subsidy. Buyers do not automatically bear most tax, and subsidy benefits do not automatically go mostly to sellers.</li><li>A ceiling/floor creates a shortage/surplus only when binding. A maximum price above equilibrium does not force price upward.</li><li>Sunk costs are irrecoverable. Do not ignore current opportunity costs; a resellable asset has an opportunity cost even if already paid for.</li><li>Marginal benefit is extra benefit, not extra cost. Consumer surplus is not automatically zero on the last purchased discrete unit.</li><li>Tax welfare includes government revenue: total surplus after tax = CS + PS + revenue. Do not subtract DWL a second time from that total.</li><li>Inferring a shift from P and Q moving together assumes a single shift and other things fixed.</li></ul></a ];
let labIndex=0,labD=0,labS=0,labPoint=0,labChecked=false,labStarted=0;
function labHome(){clearInterval(ticker);const a=state.graphAttempts||[];sethtml(`<button onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:24px">Chapters 2–4 · hands-on practice</div><h1>Move the graph yourself.</h1><p>Drag a whole curve for a shift. Drag the point for an own-price movement. A shift changes the curve’s position, not its slope.</p><div class="notice">${a.length} checked attempts · ${pct(a)} accuracy. Graph-lab results are saved separately and included in Export progress.</div><div class="topicgrid">${LAB.map((q,i)=>`<button class="topicrow" onclick="labOpen(${i})"><span class="pill">${i+1}</span><strong>${esc(q[0])}</strong><span>Open →</span></button>`).join('')}</div>`)}
function labOpen(i){labIndex=i;labD=labS=labPoint=0;labChecked=false;labStarted=Date.now();clearInterval(ticker);let q=LAB[i];sethtml(`<div class="quiz"><div class="toolbar"><button onclick="labHome()">← Graph-only area</button><span class="pill">Graph ${i+1} / ${LAB.length}</span></div><h2>${esc(q[0])}</h2><p>Drag the coloured curves horizontally.${q[5]?' Drag the black point along '+q[5]+' for the price change.':''} Positions snap to left / unchanged / right; the size of the shift is illustrative.</p><svg id="labCanvas" viewBox="0 0 600 400" role="img" aria-label="Editable supply and demand graph" style="width:100%;max-height:440px;touch-action:none;background:#fff;border-radius:16px"></svg><div id="labReadout" aria-live="polite" class="notice"></div><p class="muted">Dashed lines and hollow dot = before. Solid lines and filled dot = your drawing. You can also use these sliders with touch or arrow keys.</p><div class="labControls"><label>Demand position <input aria-label="Demand position" type="range" min="-2" max="2" step="2" value="0" id="labD" oninput="labSet('D',+this.value)"></label><label>Supply position <input aria-label="Supply position" type="range" min="-2" max="2" step="2" value="0" id="labS" oninput="labSet('S',+this.value)"></label>${q[5]?'<label>Point quantity <input aria-label="Point quantity" type="range" min="-2" max="2" step="2" value="0" id="labP" oninput="labSet(\'P\',+this.value)"></label>':''}</div><div class="actions"><button class="primary" id="labCheck" onclick="labCheck()">Check my graph</button><button onclick="labOpen(labIndex)">Reset / retry</button><button onclick="labOpen((labIndex+1)%LAB.length)">Next graph →</button></div><div id="labFeedback" aria-live="polite"></div></div>`);labDraw();labBind()}
function labSet(k,v){if(labChecked)return;v=Math.max(-2,Math.min(2,Math.round(v/2)*2));if(k==='D')labD=v;else if(k==='S')labS=v;else labPoint=v;labDraw()}
function labResult(d,s){return {quantity:5+(d+s)/2,price:7+(d-s)/2}}
function labDraw(){let svg=document.getElementById('labCanvas');if(!svg)return;let q=LAB[labIndex],x=n=>65+n*43,y=n=>340-n*24;const path=(d,s)=>`M${x(0)} ${y(d)}L${x(10)} ${y(d+s*10)}`;let clip='clip-path="url(#labClip)"';let html=`<defs><clipPath id="labClip"><rect x="65" y="28" width="430" height="312"/></clipPath></defs><path d="M65 28V340H520" fill="none" stroke="#47564e"/><text x="15" y="22">Price ($)</text><text x="410" y="384">Quantity</text><g ${clip} fill="none"><path d="${path(12,-1)}" stroke="#376c9c" stroke-dasharray="6 6"/><path d="${path(2,1)}" stroke="#bd7747" stroke-dasharray="6 6"/><path d="${path(12+labD,-1)}" stroke="#376c9c" stroke-width="4"/><path d="${path(2-labS,1)}" stroke="#bd7747" stroke-width="4"/><path data-drag="D" d="${path(12+labD,-1)}" stroke="transparent" stroke-width="24" style="cursor:ew-resize"/><path data-drag="S" d="${path(2-labS,1)}" stroke="transparent" stroke-width="24" style="cursor:ew-resize"/></g><text x="505" y="${y(2+labD)+4}" fill="#376c9c">D</text><text x="505" y="${y(12-labS)+4}" fill="#bd7747">S</text>`;
let e=labResult(labD,labS);if(q[5]){e.quantity=5+labPoint;e.price=q[5]==='D'?12+labD-e.quantity:2-labS+e.quantity;}html+=`<path d="M65 ${y(e.price)}H${x(e.quantity)}V340" stroke="#9aa69f" stroke-dasharray="4 4" fill="none"/><circle cx="${x(5)}" cy="${y(7)}" r="7" fill="white" stroke="#263d30" stroke-width="2"/><text x="${x(5)+12}" y="${y(7)+22}">Before</text><circle ${q[5]?'data-drag="P"':''} cx="${x(e.quantity)}" cy="${y(e.price)}" r="${q[5]?12:6}" fill="#263d30" style="cursor:${q[5]?'grab':'default'}"/><text x="${x(e.quantity)+16}" y="${y(e.price)-12}">${q[5]?'Your point':'Your equilibrium'}</text><text x="30" y="${y(e.price)+4}">${e.price}</text><text x="${x(e.quantity)-4}" y="360">${e.quantity}</text>`;svg.innerHTML=html;document.getElementById('labReadout').textContent=`Before: P = $7, Q = 5. Your ${q[5]?'point (not necessarily equilibrium)':'equilibrium'}: P = $${e.price}, Q = ${e.quantity}.`;for(let [id,v] of [['labD',labD],['labS',labS],['labP',labPoint]]){let el=document.getElementById(id);if(el){el.value=v;el.disabled=labChecked}}}
function labBind(){const svg=document.getElementById('labCanvas');let drag=null;const pos=e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};svg.onpointerdown=e=>{let k=e.target.dataset.drag;if(!k||labChecked)return;e.preventDefault();drag={k,x:pos(e).x,initial:k==='D'?labD:k==='S'?labS:labPoint};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let p=pos(e);labSet(drag.k,drag.initial+(p.x-drag.x)/43)};svg.onpointerup=svg.onpointercancel=()=>{drag=null}}
function labCheck(){if(labChecked)return;let q=LAB[labIndex],ok=labD===q[1]&&labS===q[2]&&labPoint===q[3];labChecked=true;(state.graphAttempts??=[]).push({id:'lab'+(labIndex+1),prompt:q[0],demand:labD,supply:labS,point:labPoint,correct:ok,expected:{demand:q[1],supply:q[2],point:q[3]},explanation:q[4],seconds:Math.round((Date.now()-labStarted)/1000),at:new Date().toISOString()});save();labDraw();document.getElementById('labCheck').disabled=true;document.getElementById('labFeedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><h3>${ok?'Correct — you moved the right part.':'Compare the cause with your drawing.'}</h3><p>${q[4]}</p><p>Demand: ${q[1]>0?'right':q[1]<0?'left':'unchanged'}. Supply: ${q[2]>0?'right':q[2]<0?'left':'unchanged'}.${q[5]?' Point: '+(q[3]>0?'toward more quantity':'toward less quantity')+'.':''}</p>${ok?'':'<button onclick="labReveal()">Show correct drawing</button>'}</div>`}
function labReveal(){let q=LAB[labIndex];labD=q[1];labS=q[2];labPoint=q[3];labDraw()}

function challengeIntro(){clearInterval(ticker);const pool=BANK.filter(q=>q.challenge),aa=state.attempts.filter(a=>pool.some(q=>q.id===a.id)),seen=new Set(aa.map(a=>a.id));sethtml(`<div class="quiz"><button onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:28px">Chapters 1–8 only · 200 new questions</div><h1>The midterm challenge.</h1><p>25 questions per chapter, mixed into one 200-question sequence. This set adds multi-step numerical problems, graph reading, subtle distinctions and applied policy questions.</p><div class="notice"><strong>${seen.size} / 200 attempted · ${pct(aa)} accuracy across challenge attempts</strong><br>Untimed. Use your calculator and study sheet. Write a reason and mark your confidence before checking. Answers unlock one at a time. This is practice, so it is not a timed exam score.</div><p>Use <strong>Save & dashboard</strong> at any point; your answers and place are saved in this browser. Resume the same sequence after a break. Export progress for a backup or to review together.</p><div class="actions">${active?.mode==='challenge'?'<button class="primary" onclick="resume()">Resume my 200-question run →</button>':'<button class="primary" onclick="start(&quot;challenge&quot;)">Start all 200 questions →</button>'}<button onclick="exportData()">Export progress</button></div><p class="muted">Original practice questions aligned to the supplied course concepts. Repeating this bank can raise recall; test understanding by explaining your method. No Chapters 9–10.</p></div>`)}

function exact2025Intro(){clearInterval(ticker);sethtml(`<div class="quiz"><button onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:28px">Original Fall 2025 paper · current curriculum only</div><h1>2025 midterm rehearsal</h1><div class="notice"><strong>29 original questions · 60 minutes · one mark each</strong><br>Original wording, option order, tables, diagrams and question numbers are preserved. The 11 omitted questions concern international trade or detailed Chapter 10 models. Basic externalities from Chapter 7 remain.</div><ul><li>Use your calculator and 8.5 × 11 study sheet.</li><li>Answers and explanations remain hidden until you submit.</li><li>You can change answers and jump between questions.</li><li>The timer continues if you leave this screen, reload or close the page. At expiry the attempt is submitted automatically; if the page is closed, submission is completed when you reopen it.</li><li>Unanswered questions count as incorrect. Your final score is out of 29, with a percentage and review.</li></ul><p class="muted">This is a filtered rehearsal of the supplied paper. Its highlighted answer choices are used for a practice score and checked against the models; they are not verified as an official instructor key. Source wording is retained, with ambiguous assumptions discussed only in the post-exam review.</p><div class="actions">${active?.mode==='pastmock'?'<button class="primary" onclick="resume()">Resume 2025 midterm →</button>':'<button class="primary" onclick="start(&quot;pastmock&quot;)">Begin 60-minute midterm →</button>'}</div></div>`)}
setInterval(()=>{if(active?.mode==='pastmock'&&active.deadline&&Date.now()>=active.deadline)finish(true)},1000);
if(active?.mode==='pastmock'&&active.deadline&&Date.now()>=active.deadline)finish(true);
</script></body></html>
