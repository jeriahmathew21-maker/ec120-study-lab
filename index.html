function finish(expired=false){if(!active)return;capture();let exam=['exam','pastmock'].includes(active.mode);let missing=active.ids.filter(id=>exam?active.responses[id]?.choice==null:!active.responses[id]?.graded).length;if(!expired&&missing&&!confirm(`${missing} unanswered/ungraded questions remain. Finish anyway?`))return;clearInterval(ticker);if(exam){for(let id of active.ids){let q=BANK.find(q=>q.id===id),r=active.responses[id]||{choice:null,text:'',confidence:'unsure',elapsed:0};r.correct=r.choice===q.answer;r.graded=true;active.responses[id]=r;record(q,r)}}let session={...active,finished:Date.now(),expired};state.sessions.push(session);active=null;save();summary(session)}
function summary(s){let completed=s.ids.map(id=>s.responses[id]).filter(r=>r?.graded);let correct=completed.filter(r=>r.correct).length;sethtml(`<div class="quiz"><button onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:30px">${esc(s.mode)} complete${s.expired?' · time expired':''}</div><h1>${correct} / ${completed.length} correct</h1><p class="muted">${completed.length} of ${s.ids.length} questions graded. ${['exam','pastmock'].includes(s.mode)?'Unanswered items count as incorrect.':'Short answers are self-assessed and kept separate from dashboard accuracy.'} Elapsed session time: ${Math.round((s.finished-s.started)/60000)} min (includes breaks).</p><div class="actions"><button class="primary" onclick="start('weak')">Practise missed questions →</button><button onclick="exportData()">Export results for our chat</button></div><h2>Your review</h2>${s.ids.map(id=>{let q=BANK.find(q=>q.id===id),r=s.responses[id];return `<div class="reviewitem"><span class="pill">${!r?.graded?'Not graded':r.correct?'Correct':'Revisit'} · Chapter ${q.topic}</span><h3>${q.prompt}</h3><p class="muted">Your answer: ${esc(q.type==='mc'?(r?.choice!=null?q.options[r.choice]:'Unanswered'):q.type==='graph'?(GLABELS[r?.choice]||'Unanswered'):(r?.text||'Unanswered'))}</p>${['exam','pastmock'].includes(s.mode)||r?.graded||r?.revealed?`<p><strong>${q.type==='mc'?'Correct: '+q.options[q.answer]+'. ':''}</strong>${q.explanation}</p><span class="source">${q.source}</span>`:'<p class="muted">Try this question in practice to unlock its explanation.</p>'}</div>`}).join('')}</div>`)}
function report(){let a=autoAttempts();sethtml(`<button onclick="home()">← Dashboard</button><h1>Your learning record</h1><p class="muted">Accuracy counts all automatically graded attempts, including repeats. It is a practice signal, not a prediction of your exam mark.</p><div class="topicgrid">${TOPICS.slice(1).map((t,i)=>{let x=a.filter(r=>r.topic===i+1),unique=new Set(x.map(r=>r.id)).size,over=x.filter(r=>!r.correct&&r.confidence==='confident').length;return `<div class="card"><span class="eyebrow">Chapter ${i+1}</span><h3>${t}</h3><p>${pct(x)} accuracy · ${unique} distinct auto-graded questions<br>${over} confident errors · ${x.length} attempts</p><button onclick="start('topic',${i+1})">Practice</button></div>`}).join('')}</div><h2>Recent sessions</h2>${state.sessions.filter(s=>s.ids.every(id=>BANK.some(q=>q.id===id))).slice(-8).reverse().map(s=>`<button style="margin:5px" onclick="summary(state.sessions.find(s=>s.started===${s.started}))">${esc(s.mode)} · ${new Date(s.finished).toLocaleDateString()}</button>`).join('')||'<p>No finished sessions yet.</p>'}<p>Self-assessed short answers: ${state.attempts.filter(a=>a.self).length} attempts.</p><button onclick="exportData()">Export complete progress</button>`)}
function exportData(){if(active)capture();let data={schema:'ec120-study-v1',exportedAt:new Date().toISOString(),...state,questionReference:BANK.map(q=>({id:q.id,topic:TOPICS[q.topic],prompt:q.prompt,options:q.options,answer:q.answer,explanation:q.explanation,source:q.source}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='EC120-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.schema!=='ec120-study-v1'||!Array.isArray(x.attempts)||!Array.isArray(x.sessions)||x.sessions.some(s=>!Array.isArray(s.ids)))throw Error('Invalid backup');if(!confirm('Replace this browser’s progress with the selected backup?'))return;state={attempts:x.attempts,sessions:x.sessions,graphAttempts:Array.isArray(x.graphAttempts)?x.graphAttempts:[],active:null};active=null;save();home()}catch{alert('This file is not a valid EC120 progress backup.')}}
if(active?.ids?.some(id=>!BANK.some(q=>q.id===id))){active=null;save()}
home();

function audit(){sethtml(`<button onclick="home()">← Dashboard</button><h1>Study the right rules.</h1><div class="notice"><strong>Scope first:</strong> Your 2026 Lecture 9 and Lectures 7–8 identify Chapters 1–8. The older exam includes material outside your current scope; those questions have been removed. Some supplied sheets even include Chapters 11–20. They are useful references, not proof of this year's coverage. No practice bank can guarantee the actual questions or a 100% score.</div><article class="card studycard"><h2>Corrections to shortcuts in the sheets</h2><ul><li>Elastic demand has |E| &gt; 1; inelastic demand has |E| &lt; 1. One handwritten sheet reverses these labels.</li><li>A price taker cannot materially influence the market price. One sheet says the opposite.</li><li>Own price changes quantity demanded/supplied along a curve. They do not, by themselves, shift demand/supply.</li><li>Normal goods: income rises → demand rises. Inferior goods: income rises → demand falls.</li><li>Substitutes replace each other; complements are used together. Keep consumption relationships separate from production relationships.</li><li>The less elastic side bears more tax or captures more subsidy. Buyers do not automatically bear most tax, and subsidy benefits do not automatically go mostly to sellers.</li><li>A ceiling/floor creates a shortage/surplus only when binding. A maximum price above equilibrium does not force price upward.</li><li>Sunk costs are irrecoverable. Do not ignore current opportunity costs; a resellable asset has an opportunity cost even if already paid for.</li><li>Marginal benefit is extra benefit, not extra cost. Consumer surplus is not automatically zero on the last purchased discrete unit.</li><li>Tax welfare includes government revenue: total surplus after tax = CS + PS + revenue. Do not subtract DWL a second time from that total.</li><li>Inferring a shift from P and Q moving together assumes a single shift and other things fixed.</li></ul></article><article class="card studycard"><h2>Source review</h2><p>All 15 new files were inventoried. Text-readable sheets were checked, and image-only sheets were rendered for review. Econ.pdf is a 3,072-page 2017 Ragan test bank, not the assigned 2026 textbook; it was screened for identity and overlapping concepts, not treated as this course's syllabus. Duplicate and later-course sheets were identified. The app publishes original practice content, not your source PDFs.</p><p>Primary scope: 2026 lectures 0–9. Secondary practice pattern: Fall 2025 midterm. Supporting reminders: the uploaded cheat sheets, with errors corrected using the lecture models.</p></article>`)}
const LAB=[
['Tea becomes more expensive. Tea and coffee are substitutes. Show the change in the COFFEE market.',2,0,0,'Demand shifts right: coffee is more attractive at every coffee price. With supply unchanged, equilibrium price AND quantity rise. Higher coffee prices moderate the initial surge; they do not erase it.'],
['An endorsement makes sneakers more popular. Production conditions stay unchanged.',2,0,0,'Popularity increases demand. Move D right; leave S fixed. Sellers move along supply to a higher price and quantity.'],
['Restaurant meals are a normal good. Consumer incomes fall. Production costs stay unchanged.',-2,0,0,'Lower income reduces demand for a normal good. D shifts left; both equilibrium price and quantity fall.'],
['A new machine makes bread cheaper to produce. Consumer demand stays unchanged.',0,2,0,'Lower marginal costs shift S right. Equilibrium price falls while quantity rises.'],
['A frost destroys part of the orange crop. Demand stays unchanged.',0,-2,0,'Less is supplied at every price: S shifts left. Price rises and quantity falls.'],
['A factory can make shirts OR jackets. Jacket prices rise. Draw the SHIRT market.',0,-2,0,'Resources switch toward jackets. Shirts become more costly in terms of forgone jacket production, so shirt supply shifts left.'],
['Beef and leather are jointly produced. Leather becomes more valuable, encouraging cattle production. Draw the BEEF market.',0,2,0,'More joint production increases beef supply. These products are made together; they do not compete for the same production capacity in this example.'],
['More firms enter the coffee market. Demand stays unchanged.',0,2,0,'More sellers increase market supply. S shifts right: price falls and quantity rises.'],
['Consumers expect a storable product to cost more next month. Current production conditions stay unchanged.',2,0,0,'Buyers bring purchases forward. Current demand shifts right, raising equilibrium price and quantity.'],
['Coffee’s OWN price falls. Hold all demand determinants fixed. Move the point along DEMAND; keep both curves fixed.',0,0,2,'Lower price means down/right along D: quantity demanded increases. Own price does not shift demand. This point describes a buyer response, not a new market equilibrium.','D'],
['Coffee’s OWN price rises. Hold all demand determinants fixed. Move the point along DEMAND; keep both curves fixed.',0,0,-2,'Higher price means up/left along D: quantity demanded decreases. Demand itself is unchanged. This is not a new equilibrium.','D'],
['The product’s OWN price rises. Hold all supply determinants fixed. Move the point along SUPPLY; keep both curves fixed.',0,0,2,'Higher price means up/right along S: quantity supplied increases. Supply itself does not shift. This is not a new equilibrium.','S'],
['The product’s OWN price falls. Hold all supply determinants fixed. Move the point along SUPPLY; keep both curves fixed.',0,0,-2,'Lower price means down/left along S: quantity supplied decreases. No supply shift occurs. This is not a new equilibrium.','S'],
['Demand for bus rides falls because train fares fall. Bus and train rides are substitutes; bus supply stays unchanged.',-2,0,0,'Cheaper train rides draw customers away from buses. Bus demand shifts left. Both equilibrium bus price and quantity fall.']
];
let labIndex=0,labD=0,labS=0,labPoint=0,labChecked=false,labStarted=0;
function labHome(){clearInterval(ticker);const a=state.graphAttempts||[];sethtml(`<button onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:24px">Chapters 2–4 · hands-on practice</div><h1>Move the graph yourself.</h1><p>Drag a whole curve for a shift. Drag the point for an own-price movement. A shift changes the curve’s position, not its slope.</p><div class="notice">${a.length} checked attempts · ${pct(a)} accuracy. Graph-lab results are saved separately and included in Export progress.</div><div class="topicgrid">${LAB.map((q,i)=>`<button class="topicrow" onclick="labOpen(${i})"><span class="pill">${i+1}</span><strong>${esc(q[0])}</strong><span>Open →</span></button>`).join('')}</div>`)}
function labOpen(i){labIndex=i;labD=labS=labPoint=0;labChecked=false;labStarted=Date.now();clearInterval(ticker);let q=LAB[i];sethtml(`<div class="quiz"><div class="toolbar"><button onclick="labHome()">← Graph-only area</button><span class="pill">Graph ${i+1} / ${LAB.length}</span></div><h2>${esc(q[0])}</h2><p>Drag the coloured curves horizontally.${q[5]?' Drag the black point along '+q[5]+' for the price change.':''} Positions snap to left / unchanged / right; the size of the shift is illustrative.</p><svg id="labCanvas" viewBox="0 0 600 400" role="img" aria-label="Editable supply and demand graph" style="width:100%;max-height:440px;touch-action:none;background:#fff;border-radius:16px"></svg><div id="labReadout" aria-live="polite" class="notice"></div><p class="muted">Dashed lines and hollow dot = before. Solid lines and filled dot = your drawing. You can also use these sliders with touch or arrow keys.</p><div class="labControls"><label>Demand position <input aria-label="Demand position" type="range" min="-2" max="2" step="2" value="0" id="labD" oninput="labSet('D',+this.value)"></label><label>Supply position <input aria-label="Supply position" type="range" min="-2" max="2" step="2" value="0" id="labS" oninput="labSet('S',+this.value)"></label>${q[5]?'<label>Point quantity <input aria-label="Point quantity" type="range" min="-2" max="2" step="2" value="0" id="labP" oninput="labSet(\'P\',+this.value)"></label>':''}</div><div class="actions"><button class="primary" id="labCheck" onclick="labCheck()">Check my graph</button><button onclick="labOpen(labIndex)">Reset / retry</button><button onclick="labOpen((labIndex+1)%LAB.length)">Next graph →</button></div><div id="labFeedback" aria-live="polite"></div></div>`);labDraw();labBind()}
function labSet(k,v){if(labChecked)return;v=Math.max(-2,Math.min(2,Math.round(v/2)*2));if(k==='D')labD=v;else if(k==='S')labS=v;else labPoint=v;labDraw()}
function labResult(d,s){return {quantity:5+(d+s)/2,price:7+(d-s)/2}}
function labDraw(){let svg=document.getElementById('labCanvas');if(!svg)return;let q=LAB[labIndex],x=n=>65+n*43,y=n=>340-n*24;const path=(d,s)=>`M${x(0)} ${y(d)}L${x(10)} ${y(d+s*10)}`;let clip='clip-path="url(#labClip)"';let html=`<defs><clipPath id="labClip"><rect x="65" y="28" width="430" height="312"/></clipPath></defs><path d="M65 28V340H520" fill="none" stroke="#47564e"/><text x="15" y="22">Price ($)</text><text x="410" y="384">Quantity</text><g ${clip} fill="none"><path d="${path(12,-1)}" stroke="#376c9c" stroke-dasharray="6 6"/><path d="${path(2,1)}" stroke="#bd7747" stroke-dasharray="6 6"/><path d="${path(12+labD,-1)}" stroke="#376c9c" stroke-width="4"/><path d="${path(2-labS,1)}" stroke="#bd7747" stroke-width="4"/><path data-drag="D" d="${path(12+labD,-1)}" stroke="transparent" stroke-width="24" style="cursor:ew-resize"/><path data-drag="S" d="${path(2-labS,1)}" stroke="transparent" stroke-width="24" style="cursor:ew-resize"/></g><text x="505" y="${y(2+labD)+4}" fill="#376c9c">D</text><text x="505" y="${y(12-labS)+4}" fill="#bd7747">S</text>`;
let e=labResult(labD,labS);if(q[5]){e.quantity=5+labPoint;e.price=q[5]==='D'?12+labD-e.quantity:2-labS+e.quantity;}html+=`<path d="M65 ${y(e.price)}H${x(e.quantity)}V340" stroke="#9aa69f" stroke-dasharray="4 4" fill="none"/><circle cx="${x(5)}" cy="${y(7)}" r="7" fill="white" stroke="#263d30" stroke-width="2"/><text x="${x(5)+12}" y="${y(7)+22}">Before</text><circle ${q[5]?'data-drag="P"':''} cx="${x(e.quantity)}" cy="${y(e.price)}" r="${q[5]?12:6}" fill="#263d30" style="cursor:${q[5]?'grab':'default'}"/><text x="${x(e.quantity)+16}" y="${y(e.price)-12}">${q[5]?'Your point':'Your equilibrium'}</text><text x="30" y="${y(e.price)+4}">${e.price}</text><text x="${x(e.quantity)-4}" y="360">${e.quantity}</text>`;svg.innerHTML=html;document.getElementById('labReadout').textContent=`Before: P = $7, Q = 5. Your ${q[5]?'point (not necessarily equilibrium)':'equilibrium'}: P = $${e.price}, Q = ${e.quantity}.`;for(let [id,v] of [['labD',labD],['labS',labS],['labP',labPoint]]){let el=document.getElementById(id);if(el){el.value=v;el.disabled=labChecked}}}
function labBind(){const svg=document.getElementById('labCanvas');let drag=null;const pos=e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};svg.onpointerdown=e=>{let k=e.target.dataset.drag;if(!k||labChecked)return;e.preventDefault();drag={k,x:pos(e).x,initial:k==='D'?labD:k==='S'?labS:labPoint};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;let p=pos(e);labSet(drag.k,drag.initial+(p.x-drag.x)/43)};svg.onpointerup=svg.onpointercancel=()=>{drag=null}}
function labCheck(){if(labChecked)return;let q=LAB[labIndex],ok=labD===q[1]&&labS===q[2]&&labPoint===q[3];labChecked=true;(state.graphAttempts??=[]).push({id:'lab'+(labIndex+1),prompt:q[0],demand:labD,supply:labS,point:labPoint,correct:ok,expected:{demand:q[1],supply:q[2],point:q[3]},explanation:q[4],seconds:Math.round((Date.now()-labStarted)/1000),at:new Date().toISOString()});save();labDraw();document.getElementById('labCheck').disabled=true;document.getElementById('labFeedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><h3>${ok?'Correct — you moved the right part.':'Compare the cause with your drawing.'}</h3><p>${q[4]}</p><p>Demand: ${q[1]>0?'right':q[1]<0?'left':'unchanged'}. Supply: ${q[2]>0?'right':q[2]<0?'left':'unchanged'}.${q[5]?' Point: '+(q[3]>0?'toward more quantity':'toward less quantity')+'.':''}</p>${ok?'':'<button onclick="labReveal()">Show correct drawing</button>'}</div>`}
function labReveal(){let q=LAB[labIndex];labD=q[1];labS=q[2];labPoint=q[3];labDraw()}
</script></body></html>
