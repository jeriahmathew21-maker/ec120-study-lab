ctice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c40", "topic": 2, "type": "mc", "challenge": true, "prompt": "A store cuts its own price and sells more. With all other demand determinants fixed, the correct statement is…", "options": ["Supply necessarily shifts left", "Demand increases because quantity rises", "Quantity demanded increases; demand does not shift", "Marginal benefit at every quantity rises"], "answer": 2, "explanation": "Demand is the whole schedule. An own-price change selects a different point on that schedule.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c41", "topic": 2, "type": "mc", "challenge": true, "prompt": "Which event shifts bicycle demand rather than causing movement along it?", "options": ["A fall in the bicycle’s own price", "A rise in the bicycle’s own price", "A rise in the price of a substitute scooter", "A bicycle seller moving to another point on the same supply curve"], "answer": 2, "explanation": "Related-product prices change demand at every own price; own price changes quantity demanded.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c42", "topic": 2, "type": "mc", "challenge": true, "prompt": "Two consumers have identical demand curves Q=10−P, floored at zero. A third identical consumer enters. At P=$6, market quantity changes from…", "options": ["12 to 8", "8 to 18", "8 to 12", "4 to 8"], "answer": 2, "explanation": "Each demands 4. Two buyers demand 8; three demand 12. More buyers shift market demand right.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c43", "topic": 2, "type": "mc", "challenge": true, "prompt": "Demand for product A rises when B’s price rises. Holding other factors fixed, A and B are…", "options": ["Necessarily jointly produced", "Necessarily inferior goods", "Complements in consumption", "Substitutes in consumption"], "answer": 3, "explanation": "A positive response to the other good’s price indicates substitution. Production and income relationships are different classifications.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c44", "topic": 2, "type": "mc", "challenge": true, "prompt": "Demand for A falls when B’s price rises. A and B are…", "options": ["Complements in consumption", "Necessarily the same product", "Necessarily normal goods", "Substitutes in consumption"], "answer": 0, "explanation": "A higher price of a complement reduces use of the pair and demand for A at each A price.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c45", "topic": 2, "type": "mc", "challenge": true, "prompt": "A buyer purchases 4 units at $5 each, with marginal benefits $12,$10,$8,$6. If the fifth unit’s MB is $3, buying it would…", "options": ["Leave net benefit unchanged because four units were worthwhile", "Increase net benefit by $3", "Reduce net benefit by $2", "Increase net benefit by $5"], "answer": 2, "explanation": "The fifth adds $3 benefit but $5 cost. Earlier units’ surplus does not justify an unprofitable marginal unit.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c46", "topic": 2, "type": "mc", "challenge": true, "prompt": "Which is consistent with diminishing marginal benefit?", "options": ["The fourth slice is worth less than the third, though both may be valuable", "Each additional slice always gives negative benefit", "Total benefit must fall after the first slice", "The price must fall after every purchase"], "answer": 0, "explanation": "Marginal benefit falls with consumption; total benefit can keep rising while MB remains positive.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c47", "topic": 2, "type": "mc", "challenge": true, "prompt": "Own price falls while income also falls for a normal good. What is certain about quantity demanded compared with before BOTH changes?", "options": ["Its net change is ambiguous without magnitudes", "Demand must remain unchanged", "It must rise", "It must fall"], "answer": 0, "explanation": "Lower own price raises Qd along a curve; lower income shifts D left. These effects on quantity oppose each other.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c48", "topic": 2, "type": "mc", "challenge": true, "prompt": "A rise in income reduces demand for instant noodles but increases demand for restaurant meals. This implies…", "options": ["Restaurant meals must have perfectly elastic demand", "Both goods are inferior", "Noodles are complements of income", "Noodles are inferior and restaurant meals normal over this range"], "answer": 3, "explanation": "Income classifications depend on the sign of the demand response, not a product’s name or price elasticity.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c49", "topic": 2, "type": "mc", "challenge": true, "prompt": "Marginal willingness to pay for the sixth unit is $9. The market price is $7. The surplus from that unit alone is…", "options": ["$7", "$16", "$2", "$9"], "answer": 2, "explanation": "Unit surplus is MB−price=9−7=2. Do not confuse the extra unit’s surplus with total surplus across all purchases.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c50", "topic": 2, "type": "mc", "challenge": true, "prompt": "A demand curve shifts right. Which statement is NOT required?", "options": ["At a given quantity, willingness to pay is higher in the usual parallel-shift case", "Buyers want more at a given price", "A non-price demand determinant changed", "The good’s own price has fallen"], "answer": 3, "explanation": "Demand can shift while own price initially stays unchanged. A lower own price alone produces movement, not a shift.", "source": "Original advanced practice · 2026 Chapter 2 concepts; lecture models, not an official exam"}, {"id": "c51", "topic": 3, "type": "mc", "challenge": true, "prompt": "Marginal costs of successive units are $3,$5,$8,$11,$15. At price $10, profit-maximizing output is…", "options": ["2 units", "5 units", "4 units", "3 units"], "answer": 3, "explanation": "The third unit costs 8<10; the fourth costs 11>10. Earlier units’ gains do not justify the fourth.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c52", "topic": 3, "type": "mc", "challenge": true, "prompt": "Output at 0,1,2,3,4 workers is 0,20,36,48,56. Output sells for $3; each worker costs $30. Hire…", "options": ["3 workers", "1 worker", "2 workers", "4 workers"], "answer": 0, "explanation": "Marginal outputs are 20,16,12,8; marginal revenues 60,48,36,24. The fourth worker earns less than the $30 wage.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c53", "topic": 3, "type": "mc", "challenge": true, "prompt": "Total variable costs for 0–4 units are 0,4,10,19,32. Price is $10. Choose…", "options": ["2 units", "3 units", "4 units", "0 units"], "answer": 1, "explanation": "Marginal costs are 4,6,9,13. Three maximizes revenue minus variable cost; fixed committed costs would not change this margin.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c54", "topic": 3, "type": "mc", "challenge": true, "prompt": "A seller’s MC is P=4+2Q. At market price $18, supplied quantity is…", "options": ["11", "14", "9", "7"], "answer": 3, "explanation": "Set 4+2Q=18, giving Q=7. Supply reflects marginal cost in the stated competitive model.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c55", "topic": 3, "type": "mc", "challenge": true, "prompt": "Two firms supply QA=max(0,P−4) and QB=max(0,2P−12). At P=$5, market supply is…", "options": ["−1", "1", "3", "5"], "answer": 1, "explanation": "A supplies 1; B supplies zero. Negative algebraic quantities are replaced by zero before summing.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c56", "topic": 3, "type": "mc", "challenge": true, "prompt": "Two identical firms each supply Q=P−3 for P≥3. At P=$8, market supply is…", "options": ["16", "13", "10", "5"], "answer": 2, "explanation": "Each supplies 5. Horizontal addition at the same price gives 10.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c57", "topic": 3, "type": "mc", "challenge": true, "prompt": "A seller produces three units at $12 each with MC $4,$7,$10. Producer surplus is…", "options": ["$21", "$15", "$36", "$5"], "answer": 1, "explanation": "PS=(12−4)+(12−7)+(12−10)=8+5+2=15, before subtracting fixed costs.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c58", "topic": 3, "type": "mc", "challenge": true, "prompt": "Supply is Q=3P−6. Own price rises from $4 to $6. Quantity supplied…", "options": ["Stays unchanged because costs did not change", "Shifts right by 6", "Falls from 12 to 6", "Rises from 6 to 12 along the same curve"], "answer": 3, "explanation": "Price changes the chosen quantity on a supply schedule. A shift requires a cost or other supply determinant to change.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c59", "topic": 3, "type": "mc", "challenge": true, "prompt": "A bakery’s flour cost rises. At each loaf price, baking becomes less profitable at the margin. Supply…", "options": ["Shifts left/up", "Is unchanged because flour is not output", "Shifts right/down", "Moves up/right along unchanged supply"], "answer": 0, "explanation": "Higher input prices raise marginal cost and reduce quantity offered at each own price.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c60", "topic": 3, "type": "mc", "challenge": true, "prompt": "An unavoidable annual licence fee rises, but marginal production costs are unchanged. For firms already committed to operate today, this change alone…", "options": ["Raises marginal cost by the entire fee on every unit", "Shifts demand left", "Always doubles output", "Does not directly shift today’s marginal-cost supply schedule"], "answer": 3, "explanation": "A fixed committed fee affects profit but not the cost of an extra unit. Entry/exit may change in the longer run.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c61", "topic": 3, "type": "mc", "challenge": true, "prompt": "A per-unit packaging cost falls by $2. In a simple competitive model, the inverse supply curve…", "options": ["Rotates only because fixed cost changed", "Must stay unchanged", "Shifts down by $2", "Shifts up by $2"], "answer": 2, "explanation": "Each unit costs $2 less, so the minimum price needed at each quantity falls by $2.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c62", "topic": 3, "type": "mc", "challenge": true, "prompt": "A café owns a building it could rent out for $200/day. Running the café prevents rental. The $200 is…", "options": ["An opportunity cost of operating", "Consumer surplus", "Irrelevant because no cash changes hands", "Always a sunk cost because the building is owned"], "answer": 0, "explanation": "Owned resources have forgone alternative uses. Avoid confusing historical purchase cost with current rental opportunity cost.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c63", "topic": 3, "type": "mc", "challenge": true, "prompt": "A farm can grow wheat OR soybeans using the same land. Soybean prices fall. Wheat supply tends to…", "options": ["Shift left", "Move down along wheat supply", "Become demand", "Shift right"], "answer": 3, "explanation": "Soybeans become a less attractive alternative. More land can go to wheat at each wheat price.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c64", "topic": 3, "type": "mc", "challenge": true, "prompt": "Beef and leather are jointly produced. Leather prices fall, reducing incentives for joint production. Beef supply tends to…", "options": ["Shift right", "Move along beef demand only", "Shift left", "Remain fixed by definition"], "answer": 2, "explanation": "Lower value of the joint product discourages joint production, reducing beef supply at each beef price.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c65", "topic": 3, "type": "mc", "challenge": true, "prompt": "Sellers of a storable good expect higher prices next week. Holding today’s price fixed, they may…", "options": ["Reduce current supply to postpone sales", "Increase current supply necessarily", "Move along unchanged supply because tomorrow’s price changed", "Shift current demand right by definition"], "answer": 0, "explanation": "Expected future returns can alter willingness to sell today. Today’s own price need not change for supply to shift.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c66", "topic": 3, "type": "mc", "challenge": true, "prompt": "Which directly causes movement along a firm’s supply curve, all else fixed?", "options": ["A productivity improvement", "A change in a substitute-in-production price", "A rise in input wages", "A rise in its output’s own market price"], "answer": 3, "explanation": "Own price changes quantity supplied; costs, technology and related-production prices shift the schedule.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c67", "topic": 3, "type": "mc", "challenge": true, "prompt": "A price-taking seller is one that…", "options": ["Can raise market price without losing any buyers", "Must produce the same quantity as every rival", "Has zero marginal cost", "Treats market price as given when choosing output"], "answer": 3, "explanation": "Price taking does not mean identical costs or output. Individual sellers cannot materially control the competitive market price.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c68", "topic": 3, "type": "mc", "challenge": true, "prompt": "A firm’s average cost is $14, price is $12, and the next unit’s marginal cost is $9. Ignoring other constraints, producing that additional unit…", "options": ["Is worthwhile only if all sunk costs are recovered", "Adds $12 to profit", "Must reduce profit because average cost exceeds price", "Adds $3 toward profit or fixed-cost coverage"], "answer": 3, "explanation": "The additional revenue is $12 and additional cost $9. This marginal decision differs from whether to operate in the longer run.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c69", "topic": 3, "type": "mc", "challenge": true, "prompt": "Why can marginal costs rise as a firm expands output over a short period?", "options": ["The law of demand makes sellers dislike prices", "Capacity constraints can make extra production increasingly costly", "Total fixed cost must rise with every unit", "All workers must become less skilled"], "answer": 1, "explanation": "Rising marginal cost can reflect limited capacity and increasingly costly inputs; it is not simply an increase in committed fixed costs.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c70", "topic": 3, "type": "mc", "challenge": true, "prompt": "A product becomes fashionable, but input prices and technology do not change. Does that popularity directly shift supply?", "options": ["No; quantity supplied can never respond", "No; it shifts demand and may cause movement along supply", "Yes; supply must shift left whenever price rises", "Yes; supply must shift right whenever more units sell"], "answer": 1, "explanation": "Trace cause separately from equilibrium response. Higher demand can increase price and Qs along a fixed supply curve.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c71", "topic": 3, "type": "mc", "challenge": true, "prompt": "A seller has revenue $500, variable costs $300 and committed fixed costs $250. Producer surplus and profit are…", "options": ["−$50 and $200", "$200 and −$50", "$200 and $200", "$500 and −$50"], "answer": 1, "explanation": "PS=TR−variable cost=200. Profit also subtracts fixed cost: 200−250=−50.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c72", "topic": 3, "type": "mc", "challenge": true, "prompt": "Three possible extra units sell for $15 each and cost $7,$12,$18 to produce. Net gain from the optimal extra output is…", "options": ["$8", "$45", "$11", "$26"], "answer": 2, "explanation": "Produce two: gains 8+3=11. The third loses 3; revenue alone is not the net gain.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c73", "topic": 3, "type": "mc", "challenge": true, "prompt": "A firm sells an extra service for $60. It uses materials worth $10 and an hour that could earn $35 elsewhere. The economic gain is…", "options": ["$25", "$60", "$50", "$15"], "answer": 3, "explanation": "Subtract both direct materials and forgone alternative earnings: 60−10−35=15.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c74", "topic": 3, "type": "mc", "challenge": true, "prompt": "Market supply shifts right when…", "options": ["Consumers’ tastes change, with all seller conditions fixed", "The product’s own price alone rises", "The number of buyers alone falls", "New sellers enter with positive output at current prices"], "answer": 3, "explanation": "Adding sellers increases total quantity offered at each price. Own price alone produces movement.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c75", "topic": 3, "type": "mc", "challenge": true, "prompt": "At P=$9, a seller supplies 4 units. After a cost reduction it supplies 6 at the SAME price. This is evidence of…", "options": ["Only an increase in quantity supplied along unchanged supply", "An increase in supply", "An increase in demand necessarily", "A shortage by definition"], "answer": 1, "explanation": "Comparing quantities at the same price isolates a change in the supply schedule.", "source": "Original advanced practice · 2026 Chapter 3 concepts; lecture models, not an official exam"}, {"id": "c76", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand is Qd=60−2P and supply is Qs=3P−10. Equilibrium is…", "options": ["P=$12, Q=26", "P=$10, Q=40", "P=$16, Q=28", "P=$14, Q=32"], "answer": 3, "explanation": "Set 60−2P=3P−10: 70=5P, so P=14 and Q=32.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c77", "topic": 4, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. Demand is P=30−Q and supply is P=6+Q. Demand then rises to P=38−Q. New equilibrium is…", "options": ["P=$14, Q=24", "P=$18, Q=12", "P=$26, Q=12", "P=$22, Q=16"], "answer": 3, "explanation": "38−Q=6+Q gives Q=16,P=22. Initially Q=12,P=18; demand growth raises both.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Initial market; demand then shifts. Demand P=30−1Q, supply P=6+1Q.\"><title>Initial market; demand then shifts</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">8.1</text><text x=\"50\" y=\"233.63\" text-anchor=\"end\">9.7</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"171.26\" text-anchor=\"end\">19.4</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">24.3</text><text x=\"50\" y=\"108.24\" text-anchor=\"end\">29.2</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">32.4</text><text x=\"50\" y=\"45.87\" text-anchor=\"end\">38.9</text><path d=\"M62.0 99.1L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 253.42L402.0 45.09\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"67.09\">S</text></svg>"}, {"id": "c78", "topic": 4, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. Demand is P=40−2Q. Supply changes from P=4+Q to P=10+Q. New equilibrium is…", "options": ["P=$18, Q=11", "P=$20, Q=10", "P=$16, Q=12", "P=$22, Q=9"], "answer": 1, "explanation": "40−2Q=10+Q gives Q=10,P=20. Higher cost reduces Q and raises P.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Initial market; production costs then rise. Demand P=40−2Q, supply P=4+1Q.\"><title>Initial market; production costs then rise</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">5.4</text><text x=\"50\" y=\"233.5\" text-anchor=\"end\">10.8</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">10.8</text><text x=\"50\" y=\"171.0\" text-anchor=\"end\">21.6</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"108.5\" text-anchor=\"end\">32.4</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">21.6</text><text x=\"50\" y=\"46.0\" text-anchor=\"end\">43.2</text><path d=\"M62.0 60.52L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 268.85L402.0 143.85\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"165.85\">S</text></svg>"}, {"id": "c79", "topic": 4, "type": "mc", "challenge": true, "prompt": "At P=$8, Qd=90 and Qs=60. With no government purchases, units traded and unmet desired purchases are…", "options": ["60 and 30", "75 and 15", "90 and 30", "60 and 90"], "answer": 0, "explanation": "Voluntary trades are limited by supply, the smaller quantity. Shortage=90−60=30.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c80", "topic": 4, "type": "mc", "challenge": true, "prompt": "At P=$15, sellers offer 80 and buyers want 50. Unsold offered units equal…", "options": ["130", "50", "30", "80"], "answer": 2, "explanation": "Excess supply is Qs−Qd=80−50=30. Actual sales are 50 in this simple setting.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c81", "topic": 4, "type": "mc", "challenge": true, "prompt": "If an unregulated market has excess demand, price adjustment normally…", "options": ["Raises P and shifts D right", "Automatically shifts supply right", "Raises P, reducing Qd and increasing Qs along existing curves", "Lowers P and reduces Qs"], "answer": 2, "explanation": "The price mechanism narrows a shortage through movements on the two existing schedules.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c82", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand shifts left and supply shifts right. What is certain?", "options": ["Quantity falls; price is ambiguous", "Price falls; quantity is ambiguous", "Price rises; quantity is ambiguous", "Both price and quantity rise"], "answer": 1, "explanation": "Both shifts lower P. Demand reduction lowers Q; supply expansion raises Q. Magnitudes determine net Q.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c83", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand shifts right and supply shifts left. What is certain?", "options": ["Quantity falls; price is ambiguous", "Price falls; quantity is ambiguous", "Price rises; quantity is ambiguous", "Quantity rises; price is ambiguous"], "answer": 2, "explanation": "Both shifts raise P, but have opposite quantity effects.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c84", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand and supply both shift right. What is certain?", "options": ["Both outcomes are ambiguous", "Price falls; quantity falls", "Quantity rises; price is ambiguous", "Price rises; quantity is ambiguous"], "answer": 2, "explanation": "Both shifts increase Q. Demand raises P while supply lowers P; their relative strengths matter.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c85", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand and supply both shift left. What is certain?", "options": ["Quantity rises; price rises", "Price must rise and quantity must fall", "Price falls; quantity is ambiguous", "Quantity falls; price is ambiguous"], "answer": 3, "explanation": "Both reduce Q. Demand lowers P and supply raises P, leaving net price unresolved.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c86", "topic": 4, "type": "mc", "challenge": true, "prompt": "A normal good experiences falling income and rising input costs. What is certain?", "options": ["Quantity rises; price is ambiguous", "Price falls; quantity rises", "Price rises; quantity rises", "Quantity falls; price is ambiguous"], "answer": 3, "explanation": "Income fall shifts D left; costs shift S left. Both lower Q but oppose each other on P.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c87", "topic": 4, "type": "mc", "challenge": true, "prompt": "Electric scooters become cheaper to produce while a substitute becomes more expensive. In the scooter market…", "options": ["Both P and Q must fall", "Quantity is ambiguous; price rises", "Quantity rises; price is ambiguous", "Price rises; quantity falls"], "answer": 2, "explanation": "Supply right and demand right both raise Q; their effects on P oppose.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c88", "topic": 4, "type": "mc", "challenge": true, "prompt": "Observed equilibrium P and Q both rise. Assuming exactly ONE curve shifted and ordinary slopes, infer…", "options": ["Demand shifted left", "Supply shifted left", "Demand shifted right", "Supply shifted right"], "answer": 2, "explanation": "A single D-right shift raises both. Without the one-shift assumption, the observation would not uniquely identify changes.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c89", "topic": 4, "type": "mc", "challenge": true, "prompt": "Observed equilibrium P rises and Q falls. Assuming exactly ONE curve shifted, infer…", "options": ["Supply shifted right", "Supply shifted left", "Demand shifted left", "Demand shifted right"], "answer": 1, "explanation": "A supply contraction raises P and reduces Q. This pattern is not the usual response to a demand increase.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c90", "topic": 4, "type": "mc", "challenge": true, "prompt": "After a demand increase, coffee price rises and sellers offer more. Why is that not itself a supply shift?", "options": ["Every price rise makes supply perfectly inelastic", "Sellers respond to a changed own price along the existing supply schedule", "Supply never changes under any conditions", "Demand increases always reduce marginal cost"], "answer": 1, "explanation": "A supply shift requires a changed seller determinant such as cost, technology or number of firms.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c91", "topic": 4, "type": "mc", "challenge": true, "prompt": "A popular event raises hotel demand. Compared with the initial equilibrium, higher prices discourage some buyers. Final quantity nevertheless rises because…", "options": ["The market moves along a NEW demand curve and an unchanged upward supply curve", "Supply must shift right automatically", "Every new interested buyer must purchase", "The law of demand stops applying"], "answer": 0, "explanation": "Demand shift and movement effects coexist. Quantity can fall from the initial surge at the old price while remaining above the original equilibrium.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c92", "topic": 4, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. Demand is P=24−Q and supply is P=4+Q. Demand rises by $4 vertically while supply falls by $4 vertically. Relative to before…", "options": ["P rises by 4 and Q stays 10", "Both P and Q stay unchanged", "Q falls by 4 and P stays $14", "Q rises by 4 and P stays $14"], "answer": 3, "explanation": "New curves: P=28−Q and P=Q. Q=14,P=14; initial Q=10,P=14. Equal opposite price pressures cancel.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Initial market; two changes follow. Demand P=24−1Q, supply P=4+1Q.\"><title>Initial market; two changes follow</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.26\" y=\"313\" text-anchor=\"middle\">6.5</text><text x=\"50\" y=\"233.17\" text-anchor=\"end\">7.6</text><text x=\"232.52\" y=\"313\" text-anchor=\"middle\">13</text><text x=\"50\" y=\"171.17\" text-anchor=\"end\">15.1</text><text x=\"316.48\" y=\"313\" text-anchor=\"middle\">19.4</text><text x=\"50\" y=\"108.33\" text-anchor=\"end\">22.7</text><text x=\"401.74\" y=\"313\" text-anchor=\"middle\">25.9</text><text x=\"50\" y=\"46.33\" text-anchor=\"end\">30.2</text><path d=\"M62.0 93.59L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 258.93L402.0 44.65\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"66.65\">S</text></svg>"}, {"id": "c93", "topic": 4, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. Demand is P=24−Q and supply is P=4+Q. Both inverse curves shift UP by $4. Relative to before…", "options": ["P rises by $4 and Q stays 10", "Q rises by 4 and P stays $14", "P rises by $8 and Q falls by 4", "P falls by $4 and Q stays 10"], "answer": 0, "explanation": "New D=28−Q,S=8+Q. Q=10,P=18. Demand right and supply left have equal opposing quantity effects here.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Initial market; both inverse curves shift upward. Demand P=24−1Q, supply P=4+1Q.\"><title>Initial market; both inverse curves shift upward</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.26\" y=\"313\" text-anchor=\"middle\">6.5</text><text x=\"50\" y=\"233.17\" text-anchor=\"end\">7.6</text><text x=\"232.52\" y=\"313\" text-anchor=\"middle\">13</text><text x=\"50\" y=\"171.17\" text-anchor=\"end\">15.1</text><text x=\"316.48\" y=\"313\" text-anchor=\"middle\">19.4</text><text x=\"50\" y=\"108.33\" text-anchor=\"end\">22.7</text><text x=\"401.74\" y=\"313\" text-anchor=\"middle\">25.9</text><text x=\"50\" y=\"46.33\" text-anchor=\"end\">30.2</text><path d=\"M62.0 93.59L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 258.93L402.0 44.65\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"66.65\">S</text></svg>"}, {"id": "c94", "topic": 4, "type": "mc", "challenge": true, "prompt": "A surplus exists at the current price. Falling prices eliminate it through…", "options": ["A right shift of D and a left shift of S necessarily", "Lower quantity demanded and higher quantity supplied", "A rise in the number of unsold units", "Higher quantity demanded and lower quantity supplied"], "answer": 3, "explanation": "Price changes induce movements along curves. Do not relabel these movements as shifts.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c95", "topic": 4, "type": "mc", "challenge": true, "prompt": "At P=2, Qd=18 and Qs=6; at P=4, both are 12; at P=6, Qd=6 and Qs=18. At equilibrium, excess supply is…", "options": ["12", "6", "24", "0"], "answer": 3, "explanation": "At P=4, Qs−Qd=12−12=0. This means no excess supply, not zero consumer or producer surplus.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c96", "topic": 4, "type": "mc", "challenge": true, "prompt": "Market demand increases while supply is a vertical line at Q=20. New equilibrium has…", "options": ["Higher price and higher quantity", "Lower price and unchanged quantity", "Higher price and unchanged quantity", "Unchanged price and higher quantity"], "answer": 2, "explanation": "Perfectly inelastic supply cannot expand output. The ordinary P↑Q↑ result assumes upward-sloping, nonvertical supply.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c97", "topic": 4, "type": "mc", "challenge": true, "prompt": "Supply expands while demand is vertical at Q=30. New equilibrium has…", "options": ["Higher price and unchanged quantity", "Lower price and higher quantity", "Lower price and unchanged quantity", "Unchanged price and lower quantity"], "answer": 2, "explanation": "Perfectly inelastic demand fixes Q. Supply expansion changes P, not Q, at the intersection.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c98", "topic": 4, "type": "mc", "challenge": true, "prompt": "A lower price of a complement raises demand for a good. Its supply is unchanged and upward-sloping. Equilibrium…", "options": ["Price and quantity rise", "Price rises and quantity falls", "Demand remains fixed because own price rises later", "Price falls and quantity rises"], "answer": 0, "explanation": "Complement-price changes shift D right. The resulting own-price increase causes movement along the new D, not reversal of the initial shift.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c99", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand is Qd=100−4P and supply is Qs=2P−8. At P=$15, the market has…", "options": ["A surplus of 22", "A shortage of 40", "A surplus of 18", "A shortage of 18"], "answer": 3, "explanation": "Qd=100−60=40; Qs=30−8=22. Excess demand is 18, putting upward pressure on price.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c100", "topic": 4, "type": "mc", "challenge": true, "prompt": "Demand is Qd=80−2P and supply is Qs=2P. A $4 decline in P from its equilibrium level initially creates…", "options": ["Excess supply of 8", "Excess demand of 16", "Excess supply of 16", "Excess demand of 8"], "answer": 1, "explanation": "Equilibrium P=20,Q=40. At P=16,Qd=48,Qs=32: shortage=16. Both sides respond to the price change.", "source": "Original advanced practice · 2026 Chapter 4 concepts; lecture models, not an official exam"}, {"id": "c101", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price rises from $8 to $12 and Q falls from 120 to 80. Midpoint demand elasticity magnitude is…", "options": ["0.5", "0.4", "2.5", "1"], "answer": 3, "explanation": "|ΔQ|/average Q=40/100=40%; ΔP/average P=4/10=40%; ratio=1.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c102", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price falls from $15 to $12 and Q rises from 40 to 60. Midpoint elasticity magnitude is…", "options": ["2.5", "0.9", "1.8", "0.56"], "answer": 2, "explanation": "Quantity change=20/50=40%; price change=3/13.5=22.22%; ratio=1.8.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c103", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price rises from $20 to $24 and Q falls from 100 to 90. Midpoint elasticity magnitude is closest to…", "options": ["0.58", "0.10", "1.73", "1.10"], "answer": 0, "explanation": "(10/95)/(4/22)=0.5789. Quantity percentages go in the numerator.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c104", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price rises 8% while quantity demanded falls 20%, using the GIVEN percentages. Elasticity magnitude is…", "options": ["0.4", "12", "2.5", "1.6"], "answer": 2, "explanation": "20/8=2.5, so demand is elastic. Do not invert the ratio or subtract changes.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c105", "topic": 5, "type": "mc", "challenge": true, "prompt": "Demand is inelastic over an interval. A price cut causes total revenue to…", "options": ["Fall", "Remain unchanged necessarily", "Rise", "Become profit"], "answer": 0, "explanation": "The quantity percentage gain is insufficient to offset the price cut. Revenue=P×Q, not profit.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c106", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price rises 10% from $20 and quantity falls 5% from 200. Revenue changes from $4000 to…", "options": ["$3800", "$4400", "$4000", "$4180"], "answer": 3, "explanation": "New P=22,Q=190; TR=4180. The price rise dominates because demand is inelastic for these changes.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c107", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price falls 20% from $10 and quantity rises 50% from 100. New revenue is…", "options": ["$800", "$1000", "$1200", "$1500"], "answer": 2, "explanation": "P=8,Q=150; TR=1200, up from 1000. Compute the product rather than adding percentages mechanically.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c108", "topic": 5, "type": "mc", "challenge": true, "prompt": "Price rises from $5 to $10 and quantity falls from 100 to 50. Midpoint elasticity and revenue comparison are…", "options": ["E=1; revenue stays $500", "E=2; revenue doubles", "E=1; revenue rises to $1000", "E=0.5; revenue falls"], "answer": 0, "explanation": "Quantity percentage magnitude=50/75; price percentage=5/7.5: equal. Both endpoint revenues are $500.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c109", "topic": 5, "type": "mc", "challenge": true, "prompt": "Income rises from $2000 to $3000 and quantity rises from 20 to 24. Midpoint income elasticity is closest to…", "options": ["0.45; normal necessity", "−0.45; inferior", "0.45; inferior", "2.2; luxury"], "answer": 0, "explanation": "(4/22)/(1000/2500)=0.4545. Positive and below one: normal necessity in this range.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c110", "topic": 5, "type": "mc", "challenge": true, "prompt": "Income falls by a GIVEN 10% and purchases rise by 4%. Income elasticity is…", "options": ["−0.4; inferior", "−2.5; inferior", "+2.5; luxury", "+0.4; normal"], "answer": 0, "explanation": "4/(−10)=−0.4. Keep the sign for income elasticity.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c111", "topic": 5, "type": "mc", "challenge": true, "prompt": "Income rises 6% and quantity rises 12%. Income elasticity and classification are…", "options": ["0.5; normal necessity", "2; inferior", "2; normal luxury", "−2; inferior"], "answer": 2, "explanation": "12/6=2. Positive means normal; greater than one means income-elastic/luxury over this range.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c112", "topic": 5, "type": "mc", "challenge": true, "prompt": "B’s price rises 12% and quantity demanded of A falls 6%. Cross-price elasticity is…", "options": ["−2; complements", "−0.5; complements", "+2; substitutes", "+0.5; substitutes"], "answer": 1, "explanation": "−6/12=−0.5. A negative cross-price response indicates complements.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c113", "topic": 5, "type": "mc", "challenge": true, "prompt": "B’s price falls 8% and demand for A falls 12%. Cross-price elasticity is…", "options": ["+1.5; substitutes", "−0.67; complements", "+0.67; substitutes", "−1.5; complements"], "answer": 0, "explanation": "−12/−8=+1.5. Both negative changes produce a positive ratio.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c114", "topic": 5, "type": "mc", "challenge": true, "prompt": "Supply quantity rises from 30 to 50 when price rises from $4 to $6. Midpoint supply elasticity is…", "options": ["2", "0.5", "0.8", "1.25"], "answer": 3, "explanation": "Quantity change=20/40=50%; price change=2/5=40%; ratio=1.25.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c115", "topic": 5, "type": "mc", "challenge": true, "prompt": "Which demand is likely more elastic, other things equal?", "options": ["All food over a day", "Emergency treatment during the emergency", "An essential medicine with no substitutes over a day", "A single cereal brand over a year"], "answer": 3, "explanation": "Narrow definitions, close substitutes and time to adjust increase responsiveness. Necessity alone is not the only determinant.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c116", "topic": 5, "type": "mc", "challenge": true, "prompt": "Along a straight downward-sloping demand curve, moving toward higher P and lower Q generally…", "options": ["Makes elasticity equal to the slope in dollars", "Raises elasticity magnitude", "Leaves elasticity constant because slope is constant", "Lowers elasticity to zero at the price intercept"], "answer": 1, "explanation": "E=|dQ/dP|×P/Q. With fixed slope factor, a larger P/Q raises elasticity.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c117", "topic": 5, "type": "mc", "challenge": true, "prompt": "A vertical demand curve implies…", "options": ["Elasticity is infinite", "Buyers buy any quantity at one price", "Demand shifts whenever price changes", "Quantity is unresponsive to price and elasticity is zero"], "answer": 3, "explanation": "Zero percentage Q response means E=0. A horizontal curve is the perfectly elastic limiting case.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c118", "topic": 5, "type": "mc", "challenge": true, "prompt": "At a point on Q=60−2P where P=$10, point demand elasticity magnitude is…", "options": ["2", "0.5", "5", "1"], "answer": 1, "explanation": "Q=40. E=2×10/40=0.5. The derivative/slope factor alone is not elasticity.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c119", "topic": 5, "type": "mc", "challenge": true, "prompt": "On Q=60−2P, unit elasticity occurs at…", "options": ["P=$10, Q=40", "P=$30, Q=0", "P=$15, Q=30", "P=$20, Q=20"], "answer": 2, "explanation": "Set 2P/Q=1 and Q=60−2P: 4P=60, P=15,Q=30.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c120", "topic": 5, "type": "mc", "challenge": true, "prompt": "A seller observes higher revenue after a price rise, with other demand determinants fixed. Over that interval demand is…", "options": ["Necessarily upward-sloping", "Inelastic", "Elastic", "Perfectly elastic"], "answer": 1, "explanation": "Higher P with higher TR implies quantity fell proportionally less. This inference requires movement along unchanged demand.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c121", "topic": 5, "type": "mc", "challenge": true, "prompt": "A seller lowers price and revenue rises, with unchanged demand determinants. Demand over that interval is…", "options": ["Elastic", "Perfectly inelastic", "Inelastic", "Necessarily unit elastic"], "answer": 0, "explanation": "Quantity rises enough to outweigh the lower price. Unit elasticity would leave revenue unchanged.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c122", "topic": 5, "type": "mc", "challenge": true, "prompt": "A product’s demand is price-inelastic. Does raising price necessarily raise profit?", "options": ["Yes; profit and revenue are identical", "No; revenue must fall", "Yes; marginal cost becomes zero", "No; revenue may rise, but costs and other conditions also matter"], "answer": 3, "explanation": "The elasticity-revenue rule concerns P×Q. Profit subtracts costs, so the same conclusion is not automatic.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c123", "topic": 5, "type": "mc", "challenge": true, "prompt": "A supply curve becomes more elastic in the long run because…", "options": ["Demand must become vertical", "Opportunity cost disappears", "Firms have more time to obtain inputs and expand capacity", "Every fixed cost becomes a tax"], "answer": 2, "explanation": "Adjustment opportunities typically increase with time. This is a responsiveness argument, not a guarantee about every market.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c124", "topic": 5, "type": "mc", "challenge": true, "prompt": "If income elasticity is −0.7 and cross-price elasticity with B is +0.4, A is…", "options": ["A luxury and a substitute for B", "Normal and a complement to B", "Inferior and a substitute for B", "Inferior and a complement to B"], "answer": 2, "explanation": "Income sign classifies normal/inferior. Cross-price sign separately classifies substitutes/complements.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c125", "topic": 5, "type": "mc", "challenge": true, "prompt": "Using starting-value percentages, a price increase and its exact reversal can produce different measured elasticities. Why use midpoint percentages?", "options": ["They remove all demand shifts automatically", "They turn all elasticities into one", "They use the same averages in either direction", "They replace percentage changes with dollar changes"], "answer": 2, "explanation": "The midpoint method avoids dependence on which endpoint is chosen as the base. It does not change the underlying curve.", "source": "Original advanced practice · 2026 Chapter 5 concepts; lecture models, not an official exam"}, {"id": "c126", "topic": 6, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. D: P=30−Q; S: P=6+Q. A $4 tax is imposed per unit. New quantity, buyer price and seller receipt are…", "options": ["Q=10, Pb=$16, Ps=$20", "Q=10, Pb=$20, Ps=$16", "Q=12, Pb=$22, Ps=$18", "Q=8, Pb=$22, Ps=$14"], "answer": 1, "explanation": "The wedge is (30−Q)−(6+Q)=4; Q=10. Demand gives Pb=20 and supply Ps=16.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Market before a per-unit tax. Demand P=30−1Q, supply P=6+1Q.\"><title>Market before a per-unit tax</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">8.1</text><text x=\"50\" y=\"233.63\" text-anchor=\"end\">9.7</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"171.26\" text-anchor=\"end\">19.4</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">24.3</text><text x=\"50\" y=\"108.24\" text-anchor=\"end\">29.2</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">32.4</text><text x=\"50\" y=\"45.87\" text-anchor=\"end\">38.9</text><path d=\"M62.0 99.1L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 253.42L402.0 45.09\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"67.09\">S</text></svg>"}, {"id": "c127", "topic": 6, "type": "mc", "challenge": true, "prompt": "For D: P=30−Q and S: P=6+Q, a $4 per-unit tax yields government revenue of…", "options": ["$40", "$48", "$80", "$8"], "answer": 0, "explanation": "After-tax Q=10, so revenue=t×Qt=4×10=40. Do not use pre-tax Q=12.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c128", "topic": 6, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. D: P=26−Q; S: P=2+Q. A $6 subsidy per unit creates…", "options": ["Q=12, Pb=$14, Ps=$20", "Q=15, Pb=$11, Ps=$17", "Q=15, Pb=$17, Ps=$11", "Q=9, Pb=$17, Ps=$11"], "answer": 1, "explanation": "Subsidy wedge Ps−Pb=6: (2+Q)−(26−Q)=6; Q=15,Pb=11,Ps=17.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Market before a per-unit subsidy. Demand P=26−1Q, supply P=2+1Q.\"><title>Market before a per-unit subsidy</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"146.76\" y=\"313\" text-anchor=\"middle\">7</text><text x=\"50\" y=\"233.17\" text-anchor=\"end\">7.6</text><text x=\"231.52\" y=\"313\" text-anchor=\"middle\">14</text><text x=\"50\" y=\"171.17\" text-anchor=\"end\">15.1</text><text x=\"317.48\" y=\"313\" text-anchor=\"middle\">21.1</text><text x=\"50\" y=\"108.33\" text-anchor=\"end\">22.7</text><text x=\"402.24\" y=\"313\" text-anchor=\"middle\">28.1</text><text x=\"50\" y=\"46.33\" text-anchor=\"end\">30.2</text><path d=\"M62.0 77.05L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 275.47L402.0 43.32\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"65.32\">S</text></svg>"}, {"id": "c129", "topic": 6, "type": "mc", "challenge": true, "prompt": "A $6 subsidy raises sales to 15 units. Total government expenditure is…", "options": ["$180", "$90", "$6", "$72"], "answer": 1, "explanation": "Subsidy spending equals subsidy per unit times the subsidized quantity: 6×15=90.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c130", "topic": 6, "type": "mc", "challenge": true, "prompt": "Before tax price is $20. After a $5 tax, buyers pay $23 and sellers keep $18. Burdens are…", "options": ["$23 buyers, $18 sellers", "$3 buyers, $2 sellers", "$2 buyers, $3 sellers", "$5 buyers, $0 sellers"], "answer": 1, "explanation": "Compare each price to the original $20. The burdens sum to the $5 wedge.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c131", "topic": 6, "type": "mc", "challenge": true, "prompt": "Demand is more elastic than supply. A tax generally causes…", "options": ["The legal remitter to bear all of the tax", "Buyers’ total price to rise more than sellers’ net price falls", "Sellers’ net price to fall more than buyers’ total price rises", "No quantity reduction"], "answer": 2, "explanation": "Sellers are the less elastic side here, so they bear more. Compare elasticities, not the slope’s visual angle alone.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c132", "topic": 6, "type": "mc", "challenge": true, "prompt": "Demand is perfectly inelastic and supply slopes upward. A $3 tax is introduced. The simple model predicts…", "options": ["Buyers bear all $3 and quantity is unchanged", "No tax revenue", "Sellers bear all $3 and quantity falls", "Buyers and sellers split it equally"], "answer": 0, "explanation": "Vertical demand fixes Q. Supply’s required net price at that Q is unchanged; Pb rises by the full tax.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c133", "topic": 6, "type": "mc", "challenge": true, "prompt": "Supply is perfectly inelastic and demand slopes downward. A tax generally…", "options": ["Lowers seller receipt by the full tax, with Q unchanged", "Raises buyer price by the full tax", "Splits the burden equally", "Makes supply perfectly elastic"], "answer": 0, "explanation": "Vertical supply fixes Q; demand fixes Pb at that Q. The tax is absorbed in Ps.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c134", "topic": 6, "type": "mc", "challenge": true, "prompt": "The same tax is moved from buyer remittance to seller remittance. With all else fixed…", "options": ["The less elastic side changes identity", "Sellers must now bear all the cost", "Pb, Ps and Q are unchanged", "Only Q changes"], "answer": 2, "explanation": "The economic wedge is unchanged. Legal remittance does not determine incidence.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c135", "topic": 6, "type": "mc", "challenge": true, "prompt": "Equilibrium P=$9,Q=50. A price ceiling of $12 is enacted. Sales become…", "options": ["50 at $12", "Less than 50 at $12", "Zero because every ceiling binds", "50 at $9"], "answer": 3, "explanation": "A maximum above equilibrium is nonbinding. The law permits the original price.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c136", "topic": 6, "type": "mc", "challenge": true, "prompt": "Equilibrium P=$9,Q=50. A price floor of $7 is enacted. The outcome is…", "options": ["P=$9,Q=50", "P=$7 and a shortage", "P=$9 and necessarily lower Q", "P=$7 and a surplus"], "answer": 0, "explanation": "A minimum below equilibrium is nonbinding. Do not force price to the legal bound.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c137", "topic": 6, "type": "mc", "challenge": true, "prompt": "D: Qd=30−P; S: Qs=P−6. A price ceiling of $14 creates…", "options": ["A shortage of 8 and sales of 16", "No effect because every maximum price is nonbinding", "A surplus of 8 and sales of 8", "A shortage of 8 and sales of 8"], "answer": 3, "explanation": "Equilibrium P=18,Q=12. At ceiling14, Qd=16,Qs=8; shortage8, sales8.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c138", "topic": 6, "type": "mc", "challenge": true, "prompt": "D: Qd=30−P; S: Qs=P−6. A price floor of $22, without government purchases, creates…", "options": ["A surplus of 8 and sales of 8", "A surplus of 8 and sales of 16", "No effect because floors are minimums", "A shortage of 8 and sales of 8"], "answer": 0, "explanation": "At22,Qd=8,Qs=16. Buyers limit sales to8; excess offered output is8.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c139", "topic": 6, "type": "mc", "challenge": true, "prompt": "A binding floor has Qd=40 and Qs=70. If government buys ALL excess offered units, it purchases…", "options": ["40", "30", "110", "70"], "answer": 1, "explanation": "The government absorbs Qs−Qd=30; private buyers purchase40. Government intervention must be stated before assuming all output sells.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c140", "topic": 6, "type": "mc", "challenge": true, "prompt": "A price ceiling creates Qd=90,Qs=60. Removing it lets price adjust. With ordinary slopes, equilibrium adjustment…", "options": ["Keeps Q fixed at60 in every case", "Raises P, reduces Qd and increases Qs", "Lowers P, increases Qd and reduces Qs", "Shifts D left and S right automatically"], "answer": 1, "explanation": "A binding ceiling creates a shortage. Price adjustment moves along unchanged curves toward a common quantity.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c141", "topic": 6, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. D: P=24−Q and S: P=4+Q. A binding quota caps Q at 6. Buyers’ willingness to pay at the cap is…", "options": ["$6", "$10", "$14", "$18"], "answer": 3, "explanation": "Read demand atQ6:24−6=18. Supply’s MC there is10; the wedge reflects scarcity under the cap.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Market before a quantity cap. Demand P=24−1Q, supply P=4+1Q.\"><title>Market before a quantity cap</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.26\" y=\"313\" text-anchor=\"middle\">6.5</text><text x=\"50\" y=\"233.17\" text-anchor=\"end\">7.6</text><text x=\"232.52\" y=\"313\" text-anchor=\"middle\">13</text><text x=\"50\" y=\"171.17\" text-anchor=\"end\">15.1</text><text x=\"316.48\" y=\"313\" text-anchor=\"middle\">19.4</text><text x=\"50\" y=\"108.33\" text-anchor=\"end\">22.7</text><text x=\"401.74\" y=\"313\" text-anchor=\"middle\">25.9</text><text x=\"50\" y=\"46.33\" text-anchor=\"end\">30.2</text><path d=\"M62.0 93.59L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 258.93L402.0 44.65\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"66.65\">S</text></svg>"}, {"id": "c142", "topic": 6, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. For D: P=24−Q and S: P=4+Q, which per-unit tax reduces equilibrium quantity to 6?", "options": ["$8", "$18", "$4", "$6"], "answer": 0, "explanation": "AtQ6, demand price18 and supply price10. The required tax wedge is18−10=8.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Market before a corrective quantity-target tax. Demand P=24−1Q, supply P=4+1Q.\"><title>Market before a corrective quantity-target tax</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.26\" y=\"313\" text-anchor=\"middle\">6.5</text><text x=\"50\" y=\"233.17\" text-anchor=\"end\">7.6</text><text x=\"232.52\" y=\"313\" text-anchor=\"middle\">13</text><text x=\"50\" y=\"171.17\" text-anchor=\"end\">15.1</text><text x=\"316.48\" y=\"313\" text-anchor=\"middle\">19.4</text><text x=\"50\" y=\"108.33\" text-anchor=\"end\">22.7</text><text x=\"401.74\" y=\"313\" text-anchor=\"middle\">25.9</text><text x=\"50\" y=\"46.33\" text-anchor=\"end\">30.2</text><path d=\"M62.0 93.59L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 258.93L402.0 44.65\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"66.65\">S</text></svg>"}, {"id": "c143", "topic": 6, "type": "mc", "challenge": true, "prompt": "A buyer subsidy has which two-price relationship?", "options": ["Buyer payment always falls by the full subsidy", "Buyer and seller prices must be equal", "Seller receipt − buyer net payment = subsidy", "Buyer payment − seller receipt = subsidy"], "answer": 2, "explanation": "Subsidy fills the gap with sellers receiving more than buyers pay net. A tax has the reverse wedge.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c144", "topic": 6, "type": "mc", "challenge": true, "prompt": "Demand is less elastic than supply. Which side captures more benefit from a small subsidy in the usual model?", "options": ["Buyers", "Both necessarily receive identical gains", "The legal recipient always captures all", "Sellers"], "answer": 0, "explanation": "The less elastic side captures more subsidy benefit, just as it bears more tax burden.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c145", "topic": 6, "type": "mc", "challenge": true, "prompt": "A $4 tax reduces quantity from 12 to10 with straight curves and no other failures. Deadweight loss is…", "options": ["$4", "$40", "$48", "$8"], "answer": 0, "explanation": "DWL=½×tax×quantity reduction=½×4×2=4. Government revenue is a transfer, not all deadweight loss.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c146", "topic": 6, "type": "mc", "challenge": true, "prompt": "A floor above equilibrium is lowered but remains binding. With unchanged curves and no government purchases, private sales…", "options": ["Decrease as Qs falls", "Stay fixed because both floors bind", "Increase as Qd rises", "Equal Qs at every floor"], "answer": 2, "explanation": "Private sales under a binding floor are demand-limited. Lowering P increases Qd even though offered Qs declines.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c147", "topic": 6, "type": "mc", "challenge": true, "prompt": "A ceiling below equilibrium is raised but remains binding. With unchanged curves, units actually traded generally…", "options": ["Decrease as Qd falls", "Stay unchanged because shortages persist", "Increase as Qs rises", "Equal Qd at every ceiling"], "answer": 2, "explanation": "Under a binding ceiling sales are supply-limited. A higher allowed price raises supplied quantity, reducing the shortage.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c148", "topic": 6, "type": "mc", "challenge": true, "prompt": "A government orders purchases of at least 100 units, while a quota limits sales to at most 100. These are…", "options": ["Two taxes", "Two price floors", "A mandate and a quota respectively", "A quota and a mandate respectively"], "answer": 2, "explanation": "A mandate sets a minimum quantity requirement; a quota caps quantity. Neither is a price bound.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c149", "topic": 6, "type": "mc", "challenge": true, "prompt": "A $2 tax is imposed on a good with zero market sales after the tax. Revenue is…", "options": ["Equal to pre-tax quantity times $2", "$0", "$2", "Necessarily positive because a tax rate exists"], "answer": 1, "explanation": "Tax revenue depends on actual taxable transactions, not merely the rate or the pre-tax sales level.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c150", "topic": 6, "type": "mc", "challenge": true, "prompt": "A nonbinding ceiling is introduced while input costs separately rise enough to push equilibrium above that ceiling. The ceiling can…", "options": ["Become binding because the unconstrained equilibrium changed", "Shift demand right automatically", "Guarantee all buyers are served", "Never bind once initially nonbinding"], "answer": 0, "explanation": "Binding status compares the legal price with the current unconstrained equilibrium, not only the original one.", "source": "Original advanced practice · 2026 Chapter 6 concepts; lecture models, not an official exam"}, {"id": "c151", "topic": 7, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. D: P=20−Q; S: P=4+Q. Competitive equilibrium consumer surplus is…", "options": ["$96", "$64", "$16", "$32"], "answer": 3, "explanation": "Q=8,P=12. CS=½×8×(20−12)=32.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Demand and supply for surplus calculation. Demand P=20−1Q, supply P=4+1Q.\"><title>Demand and supply for surplus calculation</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">5.4</text><text x=\"50\" y=\"233.31\" text-anchor=\"end\">6.5</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">10.8</text><text x=\"50\" y=\"170.61\" text-anchor=\"end\">13</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"108.89\" text-anchor=\"end\">19.4</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">21.6</text><text x=\"50\" y=\"46.19\" text-anchor=\"end\">25.9</text><path d=\"M62.0 99.1L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 253.42L402.0 45.09\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"67.09\">S</text></svg>"}, {"id": "c152", "topic": 7, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. For D: P=20−Q and S: P=4+Q, total surplus at equilibrium is…", "options": ["$128", "$96", "$64", "$32"], "answer": 2, "explanation": "CS32+PS32=64, or½×Q8×intercept gap16. Revenue is not total surplus.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Demand and supply for total surplus. Demand P=20−1Q, supply P=4+1Q.\"><title>Demand and supply for total surplus</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">5.4</text><text x=\"50\" y=\"233.31\" text-anchor=\"end\">6.5</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">10.8</text><text x=\"50\" y=\"170.61\" text-anchor=\"end\">13</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"108.89\" text-anchor=\"end\">19.4</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">21.6</text><text x=\"50\" y=\"46.19\" text-anchor=\"end\">25.9</text><path d=\"M62.0 99.1L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 253.42L402.0 45.09\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"67.09\">S</text></svg>"}, {"id": "c153", "topic": 7, "type": "mc", "challenge": true, "prompt": "At P=$14, Q=6, demand intercept=$26 and supply intercept=$2, with linear curves meeting there. Producer surplus is…", "options": ["$24", "$72", "$36", "$84"], "answer": 2, "explanation": "PS=½×6×(14−2)=36. Use the supply intercept, not the demand intercept.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c154", "topic": 7, "type": "mc", "challenge": true, "prompt": "Three buyers value a unit at $18,$14,$10 and three sellers cost $3,$8,$15. Each trades at most one unit. Efficient quantity is…", "options": ["0", "3", "2", "1"], "answer": 2, "explanation": "Match highest values with lowest costs: gains15,6,−5. The third trade costs more than it benefits buyers.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c155", "topic": 7, "type": "mc", "challenge": true, "prompt": "Buyers value one unit each at $20,$16,$12; sellers cost $2,$6,$14. Maximum total gains from trade are…", "options": ["$0", "$28", "$48", "$26"], "answer": 1, "explanation": "Two efficient trades yield20−2 +16−6=18+10=28. A third has negative surplus12−14=−2.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c156", "topic": 7, "type": "mc", "challenge": true, "prompt": "A transaction has buyer value $30, seller cost $12 and price $20. Consumer surplus, producer surplus and total surplus are…", "options": ["$10, $8, $18", "$20, $12, $32", "$10, $8, $20", "$30, $12, $18"], "answer": 0, "explanation": "CS=value−P=10; PS=P−cost=8; TS=value−cost=18. Price divides surplus but cancels from its total.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c157", "topic": 7, "type": "mc", "challenge": true, "prompt": "The same $30-value, $12-cost transaction occurs at $24 instead of $20. Total surplus…", "options": ["Falls by $4", "Rises by $4", "Stays $18 while surplus shifts toward the seller", "Becomes the $24 price"], "answer": 2, "explanation": "Changing the transfer price alone redistributes surplus for the same trade; it does not change value or resource cost.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c158", "topic": 7, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. D: P=20−Q; S: P=4+Q. Output is restricted to Q=6 instead of efficient Q=8. Assuming efficient allocation of the six trades, DWL is…", "options": ["$4", "$24", "$12", "$8"], "answer": 0, "explanation": "AtQ6,MB14,MC10: gap4. Missed-trade triangle has base2,height4:½×2×4=4.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Compare restricted output with the intersection. Demand P=20−1Q, supply P=4+1Q.\"><title>Compare restricted output with the intersection</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">5.4</text><text x=\"50\" y=\"233.31\" text-anchor=\"end\">6.5</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">10.8</text><text x=\"50\" y=\"170.61\" text-anchor=\"end\">13</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"108.89\" text-anchor=\"end\">19.4</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">21.6</text><text x=\"50\" y=\"46.19\" text-anchor=\"end\">25.9</text><path d=\"M62.0 99.1L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 253.42L402.0 45.09\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"67.09\">S</text></svg>"}, {"id": "c159", "topic": 7, "type": "mc", "challenge": true, "prompt": "Use the graph and equations. D: P=20−Q; S: P=4+Q. Output is forced to Q=10 rather than8. Assuming output is allocated to highest-valuing buyers, DWL is…", "options": ["$4", "$8", "$20", "$0"], "answer": 0, "explanation": "AtQ10,MC14 exceeds MB10 by4. Extra-output triangle base2,height4 gives4.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam", "figure": "<svg viewBox=\"0 0 450 350\" role=\"img\" aria-label=\"Compare forced output with the intersection. Demand P=20−1Q, supply P=4+1Q.\"><title>Compare forced output with the intersection</title><path d=\"M62 35V292H420\" fill=\"none\" stroke=\"#66766e\"/><text x=\"8\" y=\"22\">Price ($)</text><text x=\"306\" y=\"336\">Quantity (units)</text><text x=\"62.0\" y=\"313\" text-anchor=\"middle\">0</text><text x=\"50\" y=\"296.0\" text-anchor=\"end\">0</text><text x=\"147.0\" y=\"313\" text-anchor=\"middle\">5.4</text><text x=\"50\" y=\"233.31\" text-anchor=\"end\">6.5</text><text x=\"232.0\" y=\"313\" text-anchor=\"middle\">10.8</text><text x=\"50\" y=\"170.61\" text-anchor=\"end\">13</text><text x=\"317.0\" y=\"313\" text-anchor=\"middle\">16.2</text><text x=\"50\" y=\"108.89\" text-anchor=\"end\">19.4</text><text x=\"402.0\" y=\"313\" text-anchor=\"middle\">21.6</text><text x=\"50\" y=\"46.19\" text-anchor=\"end\">25.9</text><path d=\"M62.0 99.1L376.81 292.0\" fill=\"none\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"364.81\" y=\"280.0\">D</text><path d=\"M62.0 253.42L402.0 45.09\" fill=\"none\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"384.0\" y=\"67.09\">S</text></svg>"}, {"id": "c160", "topic": 7, "type": "mc", "challenge": true, "prompt": "After a tax, CS=$80, PS=$50 and government revenue=$30. Total surplus after tax is…", "options": ["$190", "$100", "$160", "$130"], "answer": 2, "explanation": "Include the government’s revenue:80+50+30=160. Do not treat the revenue transfer as destroyed surplus.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c161", "topic": 7, "type": "mc", "challenge": true, "prompt": "Before tax total surplus is $200. After tax CS=80,PS=50,revenue=30. DWL is…", "options": ["$30", "$70", "$40", "$160"], "answer": 2, "explanation": "After-tax TS=160. DWL=200−160=40, not the government’s $30 revenue.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c162", "topic": 7, "type": "mc", "challenge": true, "prompt": "A $6 tax reduces output by4 with linear curves and no other market failures. DWL is…", "options": ["$24", "$48", "$12", "$6"], "answer": 2, "explanation": "The triangle is½×6×4=12. Revenue needs after-tax quantity and is a separate calculation.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c163", "topic": 7, "type": "mc", "challenge": true, "prompt": "At the current output, MB=$18 and MC=$12. With no externalities, slightly increasing output…", "options": ["Only transfers surplus without changing it", "Necessarily reduces consumer benefit to zero", "Lowers total surplus", "Raises total surplus"], "answer": 3, "explanation": "The extra unit adds18 of value and12 of cost: net gain6. Efficient quantity has MB=MC at the margin.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c164", "topic": 7, "type": "mc", "challenge": true, "prompt": "At the current output, MB=$8 and MC=$13. With no externalities, slightly reducing output…", "options": ["Requires abolishing all production", "Makes equity automatic", "Raises total surplus by avoiding units that cost more than they benefit", "Lowers total surplus because all output is valuable"], "answer": 2, "explanation": "The marginal unit destroys5 of surplus. Reduce overproduction toward MB=MC, not necessarily toward zero.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c165", "topic": 7, "type": "mc", "challenge": true, "prompt": "A scarce unit goes to a buyer valuing it at $8 while another excluded buyer values it at $15. Reallocation at unchanged production cost can…", "options": ["Leave total surplus unchanged necessarily", "Prove the excluded buyer is poorer", "Raise total surplus by $15", "Raise total surplus by $7"], "answer": 3, "explanation": "Efficient allocation directs units to higher marginal value. The improvement is15−8=7, distinct from a payment transfer.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c166", "topic": 7, "type": "mc", "challenge": true, "prompt": "A unit is made by a $12-cost producer while an available producer could make it for $7. Switching production can…", "options": ["Raise total surplus by $12", "Guarantee equal incomes", "Lower total surplus by $5", "Raise total surplus by $5"], "answer": 3, "explanation": "Efficient production uses lower-cost suppliers. For unchanged buyer benefit, resource cost falls by5.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official exam"}, {"id": "c167", "topic": 7, "type": "mc", "challenge": true, "prompt": "“This policy should be adopted because its distribution is fairer” is…", "options": ["A claim that fairness equals efficiency", "A measurable elasticity", "Positive because it mentions a policy", "Normative"], "answer": 3, "explanation": "The word should and fairness judgment express a value-based recommendation. Positive analysis describes testable outcomes.", "source": "Original advanced practice · 2026 Chapter 7 concepts; lecture models, not an official
