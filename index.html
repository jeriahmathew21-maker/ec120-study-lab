<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EC120 Study Lab</title><style>:root{--ink:#193c34;--muted:#66766e;--paper:#f6f5ef;--green:#265e49;--line:#dce2d8;--lime:#e0edb5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',sans-serif;font-size:16px}button,select,textarea,input{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 18px;background:white;color:var(--ink);font-weight:600}button:hover{border-color:var(--green);background:#f0f5e8}button:disabled{cursor:default;opacity:.55}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:#194532}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d59b42;outline-offset:3px}header{max-width:1220px;margin:auto;display:flex;align-items:center;gap:25px;padding:26px 32px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;white-space:nowrap}.brand b{font-weight:400;color:var(--muted)}.logo{display:grid;place-items:center;background:var(--green);color:white;border-radius:10px;width:36px;height:36px;font-size:27px}.tag{font-size:11px;letter-spacing:1.8px;margin-left:auto;color:var(--muted)}.quiet{background:transparent}main{max-width:1160px;margin:0 auto;padding:38px 24px;min-height:75vh}h1,h2,h3{font-family:'Segoe UI',sans-serif}h1{font-size:clamp(34px,4vw,53px);line-height:1.12;letter-spacing:-2px;margin:13px 0 20px}h2{font-size:26px;letter-spacing:-.6px;line-height:1.4}h3{font-size:18px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:center;padding:18px 0 34px}.hero p{color:var(--muted);max-width:540px;line-height:1.7}.hero-art{background:#e8eddf;border-radius:24px;padding:18px;transform:rotate(2deg)}.hero-art svg{width:100%;height:210px}.hero-art p{font-size:12px;text-align:center;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);background:white;border:1px solid var(--line);border-radius:14px;margin:12px 0 32px}.stat{padding:20px 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font-family:'Segoe UI',sans-serif;font-size:28px}.stat span,.muted{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:25px}.card p{font-size:14px;color:var(--muted);line-height:1.7}.card .num{font-size:12px;color:#8a9b84}.card button{margin-top:8px}.featured{background:var(--green);color:white}.featured p,.featured .num{color:#d0dfd1}.featured button{background:var(--lime);color:var(--ink);border:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:28px}.topicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.topicrow{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;background:transparent}.topicrow strong{flex:1;font-size:14px}.topicrow small{font-size:12px;color:var(--muted)}.pill{background:#e9eddf;border-radius:20px;padding:5px 10px;font-size:11px}.notice{margin:24px 0;background:#eeeee4;border-radius:10px;padding:15px 18px;font-size:13px;line-height:1.7;color:var(--muted)}.quiz{max-width:850px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.progress{height:5px;background:var(--line);margin:20px 0 30px;border-radius:4px}.progress div{height:100%;background:var(--green)}.question{background:white;border:1px solid var(--line);padding:32px;border-radius:18px}.options{display:grid;gap:10px;margin:25px 0}.option{display:flex;text-align:left;align-items:center;gap:16px;padding:16px;font-weight:400}.letter{display:grid;place-items:center;border:1px solid var(--line);width:30px;height:30px;border-radius:7px;flex-shrink:0;font-weight:600}.selected{border:2px solid var(--green);background:#edf4e6}.feedback{background:#edf4e6;padding:20px;border-radius:12px;line-height:1.7;margin-top:20px}.feedback.wrong{background:#fff0e1}.feedback h3{margin-top:0}.feedback p{margin-bottom:0}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}textarea{width:100%;min-height:95px;padding:14px;border:1px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fcfcf8}label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}select{padding:8px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink)}.source{font-size:11px;color:var(--muted);margin-top:20px}footer{text-align:center;font-size:12px;color:var(--muted);line-height:1.8;padding:25px;border-top:1px solid var(--line)}svg text{font-family:'Segoe UI',sans-serif;fill:var(--ink);font-size:14px}.graphwrap{max-width:480px;margin:auto}.graphwrap svg{width:100%}.graphoptions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.jumplist{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}.jumplist button{padding:7px 10px;font-size:12px}.done{background:#e0edb5}.studycard{margin:15px 0;line-height:1.8}.studycard li{margin:8px 0}.reviewitem{border-top:1px solid var(--line);padding:20px 0}.reviewitem p{line-height:1.7}.import{display:none}#storagewarn{color:#8c430c}details{margin:18px 0}summary{cursor:pointer;font-weight:600} @media(max-width:750px){header{padding:18px;gap:10px}.tag{display:none}header button{margin-left:auto;font-size:12px}.brand b{display:none}.hero{grid-template-columns:1fr;gap:15px}.hero-art{display:none}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.topicgrid{grid-template-columns:1fr}.question{padding:20px}main{padding:25px 16px}.graphoptions{grid-template-columns:1fr}h1{letter-spacing:-1px}}

</style></head><body><header><a class="brand" href="#" onclick="home();return false"><span class="logo">e.</span> EC120 <b>Study Lab</b></a><span class="tag">FALL 2026 · CHAPTERS 1–8</span><button onclick="exportData()" class="quiet">Export progress ↗</button></header><main id="app"></main><footer>Built from your lectures and reviewed study materials · Original practice questions, not an official exam.<br>Progress stays in this browser. Export it for backup or to review together in chat.</footer><script>const BANK=[{"id": "q1", "topic": 1, "type": "mc", "prompt": "Scarcity means that…", "options": ["resources are limited relative to wants", "only poor people face choices", "money is the only scarce resource", "every choice has a monetary payment"], "answer": 0, "explanation": "Scarcity forces trade-offs even for wealthy people. Time is scarce too, and a choice can have a cost without a cash payment.", "source": "L0 p9; L1 p7"}, {"id": "q2", "topic": 1, "type": "mc", "prompt": "A concert costs $30. Attending also means giving up a $50 shift. Ignoring other costs, the economic cost is…", "options": ["$30", "$50", "$80", "$20"], "answer": 2, "explanation": "Add the $30 direct cost and $50 forgone earnings. $30 ignores time, $50 ignores the ticket, and subtraction does not measure total cost.", "source": "L1 p22"}, {"id": "q3", "topic": 1, "type": "mc", "prompt": "You paid a nonrefundable $20 for a film. You dislike it and could enjoy studying instead. What should guide whether you stay?", "options": ["The $20 already paid", "Future benefits and costs of staying versus leaving", "How much everyone else paid", "A need to recover the $20 by staying"], "answer": 1, "explanation": "The $20 is sunk and cannot change under either choice. Compare the remaining film with the next-best use of your time; staying cannot recover the payment.", "source": "L1 pp13–14,22"}, {"id": "q4", "topic": 1, "type": "mc", "prompt": "Extra shifts yield $72 each. Their marginal costs are $20, $35, $55, $80. How many maximize net benefit?", "options": ["1", "2", "3", "4"], "answer": 2, "explanation": "The first three add positive surplus. The fourth reduces surplus by $8. Stopping at one or two leaves beneficial shifts unworked.", "source": "L1 pp29–31"}, {"id": "q5", "topic": 1, "type": "mc", "prompt": "A straight PPF has 60 burgers on the vertical intercept and 30 pizzas on the horizontal intercept. The cost of one pizza is…", "options": ["0.5 burger", "2 burgers", "30 burgers", "60 burgers"], "answer": 1, "explanation": "60/30 = 2 burgers per pizza. The reciprocal measures pizzas per burger. Intercepts are maximum outputs, not the cost of one unit.", "source": "L1 pp23–27"}, {"id": "q6", "topic": 1, "type": "mc", "prompt": "Which is a framing effect?", "options": ["Choosing differently when identical outcomes are described as 90% survival versus 10% mortality", "Changing plans because wages rise", "Buying less after a price increase", "Choosing a cheaper identical product"], "answer": 0, "explanation": "Only the first changes the description without changing outcomes. The others respond to actual changes in costs or benefits.", "source": "L1 p21"}, {"id": "q7", "topic": 2, "type": "mc", "prompt": "Marginal benefits of five slices are $10, $8, $6, $4, $2. At $5 per slice, buy…", "options": ["2", "3", "4", "5"], "answer": 1, "explanation": "The third gives $6 ≥ $5; the fourth gives $4 < $5. Two leaves surplus unclaimed; four or five adds units costing more than their benefit.", "source": "L2 pp7–12"}, {"id": "q8", "topic": 2, "type": "mc", "prompt": "Coffee's own price falls, with everything else fixed. This causes…", "options": ["demand to shift right", "demand to shift left", "a movement down/right along demand", "a movement up/left along demand"], "answer": 2, "explanation": "An own-price change changes quantity demanded along the existing curve. A demand shift requires a non-price determinant to change; up/left would describe a price increase.", "source": "L2 pp20–21,35–37"}, {"id": "q9", "topic": 2, "type": "mc", "prompt": "Income rises and demand for bus trips falls. Bus trips are…", "options": ["a normal good", "an inferior good", "necessarily a complement", "necessarily a substitute"], "answer": 1, "explanation": "Inferior means demand falls as income rises. Normal goods do the opposite. Substitutes and complements describe relationships between goods, not this income response.", "source": "L2 pp22–23"}, {"id": "q10", "topic": 2, "type": "mc", "prompt": "Tea and coffee are substitutes. Tea becomes more expensive. Coffee demand…", "options": ["shifts right", "shifts left", "does not change", "moves along its curve because tea's price changed"], "answer": 0, "explanation": "Buyers substitute toward coffee at each coffee price. Tea's price is a demand shifter for coffee, not coffee's own price.", "source": "L2 pp26–28"}, {"id": "q11", "topic": 2, "type": "mc", "prompt": "Game consoles and games are complements. Console prices rise. Demand for games…", "options": ["rises", "falls", "must stay constant", "becomes a supply curve"], "answer": 1, "explanation": "Fewer consoles make games less attractive at each game price. Complement prices move demand in the opposite direction; they do not directly change game supply.", "source": "L2 pp26–29"}, {"id": "q12", "topic": 2, "type": "mc", "prompt": "At $6, A buys 2 cups, B buys 0, and C buys 2. Market quantity demanded is…", "options": ["2", "3", "4", "12"], "answer": 2, "explanation": "Add quantities at the same price: 2+0+2=4. Do not count only active consumers, count people, or add prices.", "source": "L2 pp17–19; L9 p8"}, {"id": "q13", "topic": 3, "type": "mc", "prompt": "Marginal costs are $2, $3, $4, $5, $6. At a market price of $5.50, supply…", "options": ["2 units", "3 units", "4 units", "5 units"], "answer": 2, "explanation": "The first four units have MC below $5.50. The fifth costs $6 and would reduce profit. The unique optimum is four units.", "source": "L3 pp5–10"}, {"id": "q14", "topic": 3, "type": "mc", "prompt": "Which cost affects the decision to make one extra coffee today?", "options": ["Nonrefundable rent already committed", "Extra beans and milk", "Last month's advertising", "The purchase cost of equipment already owned and paid for"], "answer": 1, "explanation": "Extra inputs are marginal costs. The other listed payments do not change with this additional coffee. Fixed costs can matter to longer-run entry or exit decisions.", "source": "L3 pp8–12"}, {"id": "q15", "topic": 3, "type": "mc", "prompt": "A competitive firm's supply curve reflects…", "options": ["marginal benefit", "marginal cost", "total revenue", "consumer income"], "answer": 1, "explanation": "The seller compares price with the cost of an additional unit. Demand reflects marginal benefit; total revenue and consumer income are different concepts.", "source": "L3 pp14–17"}, {"id": "q16", "topic": 3, "type": "mc", "prompt": "A factory can make shirts or jackets. Jacket prices rise. Shirt supply…", "options": ["shifts right", "shifts left", "moves up along shirt supply", "must stay constant"], "answer": 1, "explanation": "Jackets are substitutes in production. Their higher price raises the opportunity cost of making shirts, reducing shirt supply at each shirt price.", "source": "L3 pp26–30"}, {"id": "q17", "topic": 3, "type": "mc", "prompt": "Beef and leather are jointly produced. A rise in leather prices tends to…", "options": ["reduce beef supply", "increase beef supply", "reduce beef demand", "raise beef's own price with no supply change necessarily"], "answer": 1, "explanation": "More valuable leather encourages joint production, increasing beef supply. This is a production relationship, not a direct change in consumers' demand for beef.", "source": "L3 p29"}, {"id": "q18", "topic": 3, "type": "mc", "prompt": "A competitive market has…", "options": ["one seller setting price freely", "many price-taking sellers of identical products", "identical costs for every seller", "no scarcity"], "answer": 1, "explanation": "Competition means many buyers and sellers with no individual controlling price. Costs may differ across firms, and scarcity remains.", "source": "L3 p17; L4 p8"}, {"id": "q19", "topic": 4, "type": "mc", "prompt": "At a price of $150, hotels offer 12,000 rooms and buyers want 16,000. Rooms rented and shortage are…", "options": ["16,000; 4,000", "12,000; 4,000", "12,000; 16,000", "14,000; zero"], "answer": 1, "explanation": "Without forced trades, sales are limited by the smaller quantity, 12,000. Shortage is 16,000−12,000=4,000, not all desired purchases.", "source": "L4 pp17,21"}, {"id": "q20", "topic": 4, "type": "mc", "prompt": "A surplus at the current price creates pressure for price to…", "options": ["rise, raising quantity demanded", "fall, raising quantity demanded and lowering quantity supplied", "fall, shifting demand right", "stay fixed by definition"], "answer": 1, "explanation": "Sellers compete for buyers. A lower price creates movements along both curves; it does not itself shift demand.", "source": "L4 pp14–16"}, {"id": "q21", "topic": 4, "type": "mc", "prompt": "An event increases hotel demand with supply unchanged. Equilibrium…", "options": ["price rises and quantity rises", "price falls and quantity rises", "price rises and quantity falls", "price and quantity fall"], "answer": 0, "explanation": "Demand shifts right. Buyers bid up price, and sellers move up their supply curve. The other patterns describe different shifts.", "source": "L4 pp22–25"}, {"id": "q22", "topic": 4, "type": "mc", "prompt": "A frost destroys a crop, with demand unchanged. Equilibrium…", "options": ["price and quantity rise", "price falls and quantity rises", "price rises and quantity falls", "price and quantity fall"], "answer": 2, "explanation": "Supply shifts left: less is available at each price. Price rises and buyers move up/left along unchanged demand.", "source": "L4 p26"}, {"id": "q23", "topic": 4, "type": "mc", "prompt": "Housing demand rises while construction costs rise. What is certain?", "options": ["Price rises; quantity is ambiguous", "Quantity rises; price is ambiguous", "Price falls; quantity rises", "Both are ambiguous"], "answer": 0, "explanation": "Demand right and supply left both raise price. Their quantity effects oppose one another, so relative shift sizes matter.", "source": "L4 pp28–30"}, {"id": "q24", "topic": 4, "type": "mc", "prompt": "EV production becomes cheaper while gasoline becomes cheaper, reducing EV demand. What is certain?", "options": ["Price rises", "Quantity rises", "Price falls; quantity is ambiguous", "Both price and quantity rise"], "answer": 2, "explanation": "Supply right and demand left both lower price. Supply raises quantity while demand lowers it, leaving the net quantity effect ambiguous.", "source": "L9 p12"}, {"id": "q25", "topic": 5, "type": "mc", "prompt": "Price rises from $10 to $12 and quantity falls from 100 to 80. Midpoint demand elasticity magnitude is about…", "options": ["0.82", "1.00", "1.22", "2.00"], "answer": 2, "explanation": "Quantity changes by −20/90 and price by 2/11. Their absolute ratio is 1.22. 0.82 inverts the ratio; raw dollar and unit changes are not elasticities.", "source": "L5 pp7–10"}, {"id": "q26", "topic": 5, "type": "mc", "prompt": "With inelastic demand over the interval, raising price will…", "options": ["raise total revenue", "lower total revenue", "leave revenue unchanged", "necessarily raise profit by the same percentage"], "answer": 0, "explanation": "Quantity falls proportionally less than price rises, so P×Q rises. Revenue is unchanged at unit elasticity; profit also depends on costs.", "source": "L5 pp18–23"}, {"id": "q27", "topic": 5, "type": "mc", "prompt": "Which tends to have the most elastic demand?", "options": ["All food", "A particular rice brand with many close substitutes", "Emergency surgery", "Electricity immediately after a price change"], "answer": 1, "explanation": "Close substitutes make it easy to switch. Broad necessities and very short adjustment periods usually have less responsive demand.", "source": "L5 pp13–17"}, {"id": "q28", "topic": 5, "type": "mc", "prompt": "Income falls 40% and bus trips rise 35%. Income elasticity is…", "options": ["+0.875, normal", "−0.875, inferior", "−1.14, inferior", "+1.14, luxury"], "answer": 1, "explanation": "35/(−40)=−0.875. Keep the sign for income elasticity. A negative sign indicates an inferior good; 1.14 reverses the ratio.", "source": "L5 pp25–26"}, {"id": "q29", "topic": 5, "type": "mc", "prompt": "Tea price rises 20% and coffee demand rises 10%. Cross-price elasticity is…", "options": ["−0.5, complements", "+0.5, substitutes", "+2, substitutes", "−2, complements"], "answer": 1, "explanation": "10/20=+0.5. A positive cross-price response means substitutes. Negative means complements; 2 reverses numerator and denominator.", "source": "L5 pp27–28"}, {"id": "q30", "topic": 5, "type": "mc", "prompt": "A straight downward demand curve has constant slope. Its elasticity…", "options": ["must be constant", "is always one", "varies because P/Q changes", "equals its slope in all units"], "answer": 2, "explanation": "Elasticity uses percentage changes: abs(ΔQ/ΔP)×P/Q. Constant slope does not imply constant P/Q. Elasticity is unit-free, unlike slope.", "source": "L5 pp23,32"}, {"id": "q31", "topic": 6, "type": "mc", "prompt": "A $2 per-unit tax creates which relationship?", "options": ["Buyer price − seller price = $2", "Seller price − buyer price = $2", "Buyer price always rises exactly $2", "Seller price never changes"], "answer": 0, "explanation": "The tax wedge is Pb−Ps=t. The two sides generally share the burden, so the buyer need not pay the full increase; the reversed wedge describes a subsidy.", "source": "L6 pp6–13"}, {"id": "q32", "topic": 6, "type": "mc", "prompt": "Moving the legal obligation for the same tax from buyers to sellers, all else equal, changes…", "options": ["the tax's economic burden completely", "neither equilibrium quantity nor the two net/gross prices", "only the quantity", "who has the less elastic curve"], "answer": 1, "explanation": "Statutory responsibility does not determine economic incidence. The same wedge produces the same outcome; relative elasticities determine burden.", "source": "L6 pp10–14"}, {"id": "q33", "topic": 6, "type": "mc", "prompt": "Demand is less elastic than supply. Who bears more of a per-unit tax?", "options": ["Buyers", "Sellers", "Exactly half each", "Whoever sends payment to government"], "answer": 0, "explanation": "Buyers are less able to adjust quantities, so they bear more. Legal remittance does not determine burden; equal division needs further conditions.", "source": "L6 pp13–20"}, {"id": "q34", "topic": 6, "type": "mc", "prompt": "A binding price ceiling is set…", "options": ["above equilibrium and creates surplus", "below equilibrium and creates shortage", "below equilibrium and creates surplus", "at any price and always matters"], "answer": 1, "explanation": "A ceiling is a maximum. Below equilibrium, Qd exceeds Qs. A ceiling above equilibrium leaves the market price feasible and is nonbinding.", "source": "L6 pp24–25"}, {"id": "q35", "topic": 6, "type": "mc", "prompt": "A binding price floor without government purchases causes…", "options": ["Qd > Qs and sales = Qs", "Qs > Qd and sales = Qd", "demand to shift right", "all supplied units to be sold automatically"], "answer": 1, "explanation": "Above equilibrium, sellers offer more than buyers want. Actual sales are demand-limited unless a separate buyer such as government purchases the surplus.", "source": "L6 p26; L9 p24"}, {"id": "q36", "topic": 6, "type": "mc", "prompt": "A per-unit subsidy in a standard competitive market tends to…", "options": ["reduce quantity", "raise buyer net price", "lower buyer net price, raise seller receipts and increase quantity", "benefit only its legal recipient"], "answer": 2, "explanation": "The subsidy creates Ps−Pb=s. Both sides can benefit; the less elastic side captures more. Legal recipient alone does not determine the benefit.", "source": "L6 pp21–23"}, {"id": "q37", "topic": 7, "type": "mc", "prompt": "Demand intercept is $10, supply intercept $2, and equilibrium is P=$6, Q=15. Total surplus is…", "options": ["$30", "$60", "$90", "$120"], "answer": 1, "explanation": "CS=½×15×(10−6)=30; PS=½×15×(6−2)=30; total=60. $90 is revenue, and $120 omits the triangle factor.", "source": "L7 pp10–14"}, {"id": "q38", "topic": 7, "type": "mc", "prompt": "Efficient allocation gives units to…", "options": ["buyers with highest marginal willingness to pay", "the first people in line, necessarily", "only the lowest-income buyers", "the producers with highest costs"], "answer": 0, "explanation": "This maximizes measured benefits given the quantity. It is not automatically equitable: willingness to pay also reflects income. Efficient production instead uses low-cost producers.", "source": "L7 pp15–19,31"}, {"id": "q39", "topic": 7, "type": "mc", "prompt": "Efficiency and equity…", "options": ["mean the same thing", "concern total surplus and distribution respectively", "guarantee every person gains", "cannot ever conflict"], "answer": 1, "explanation": "Efficiency concerns the size of total surplus; equity concerns its distribution and fairness. Maximizing the total does not guarantee everyone gains.", "source": "L7 pp7–9,31"}, {"id": "q40", "topic": 7, "type": "mc", "prompt": "A factory's pollution harms neighbours outside the transaction. This is…", "options": ["a positive externality", "a negative externality that can cause excessive market output", "a cost already fully reflected in every market price by definition", "proof that all production should stop"], "answer": 1, "explanation": "Unpriced harm to third parties is a negative externality. Private decisions may ignore social cost and overproduce; the efficient quantity need not be zero.", "source": "L7 p23; L9 p26"}, {"id": "q41", "topic": 7, "type": "mc", "prompt": "A tax reduces quantity below the efficient level in a market without other failures. Deadweight loss is…", "options": ["all tax revenue", "the surplus from beneficial trades that no longer happen", "all remaining consumer surplus", "the transfer from buyers to government"], "answer": 1, "explanation": "Missing trades with MB>MC destroy surplus. Tax revenue is a transfer, not itself lost surplus. With other failures, a corrective tax can instead improve efficiency.", "source": "L7 pp26–30"}, {"id": "q42", "topic": 7, "type": "mc", "prompt": "Which can prevent mutually beneficial trades because buyers cannot assess quality?", "options": ["Asymmetric information about a used phone", "A normal movement toward equilibrium", "An increase in productivity by itself", "Every voluntary trade"], "answer": 0, "explanation": "A seller knowing hidden defects that a buyer cannot observe can obstruct trade. Productivity and ordinary equilibrium adjustment are not themselves information failures.", "source": "L7 pp21–25"}, {"id": "q43", "topic": 8, "type": "mc", "prompt": "Aisha needs 2 hours per shirt and 1 per poster. Ben needs 3 hours per shirt and 1 per poster. Who has comparative advantage in shirts?", "options": ["Aisha", "Ben", "Both equally", "Neither because poster speed is equal"], "answer": 0, "explanation": "Aisha gives up 2 posters per shirt; Ben gives up 3. Lower opportunity cost gives Aisha the comparative advantage despite equal poster productivity.", "source": "L8 pp7–11"}, {"id": "q44", "topic": 8, "type": "mc", "prompt": "Pat takes 15 minutes to shampoo and 60 to cut hair. Alex takes 10 and 50. Who should specialize in cutting?", "options": ["Alex because faster", "Pat because 4 shampoos forgone rather than Alex's 5", "Neither", "Alex because 5 is greater than 4"], "answer": 1, "explanation": "Pat sacrifices 60/15=4 shampoos per cut; Alex sacrifices 50/10=5. Alex is absolutely faster at both but Pat has lower opportunity cost in cutting.", "source": "L8 p14"}, {"id": "q45", "topic": 8, "type": "mc", "prompt": "You can make 12 muffins or 6 cakes per hour; a friend can make 8 muffins or 2 cakes. Your cost of one cake is…", "options": ["0.5 muffin", "2 muffins", "4 muffins", "6 muffins"], "answer": 1, "explanation": "Divide forgone output by gained output: 12/6=2 muffins per cake. Your friend gives up 8/2=4, so you have comparative advantage in cakes.", "source": "L9 p29"}, {"id": "q46", "topic": 8, "type": "mc", "prompt": "Being absolutely better at both goods means…", "options": ["trade cannot help", "you also have comparative advantage in both", "trade can still help when opportunity costs differ", "your opportunity costs are zero"], "answer": 2, "explanation": "Absolute advantage compares productivity; comparative advantage compares opportunity cost. Different relative costs allow gains even when one person is faster at everything.", "source": "L8 pp8–15"}, {"id": "q47", "topic": 8, "type": "mc", "prompt": "Maya needs 30 minutes per tray and 40 per delivery; Daniel needs 10 and 60. Each has 6 hours. Starting with each doing 4 hours of trays and 2 hours of deliveries, full specialization adds…", "options": ["2 trays and 3 deliveries", "4 trays and 2 deliveries", "4 trays and 4 deliveries", "6 trays and 3 deliveries"], "answer": 2, "explanation": "Initially: 8+24=32 trays, 3+2=5 deliveries. Specialize Daniel in trays (36) and Maya in deliveries (9): gains are 4 and 4.", "source": "L8 pp21–22"}, {"id": "q48", "topic": 8, "type": "mc", "prompt": "Why can comparative advantage change over time?", "options": ["It is fixed forever", "Technology or training can change relative opportunity costs", "It depends only on national pride", "It removes scarcity"], "answer": 1, "explanation": "Skills, technology and resources can change relative costs. Comparative advantage is neither permanent nor a way to eliminate scarcity.", "source": "L8 p24"}, {"id": "q49", "topic": 1, "type": "short", "prompt": "In one sentence, distinguish microeconomics from macroeconomics.", "explanation": "Micro studies choices of individuals, households and firms and their interactions; macro studies aggregate outcomes such as inflation, unemployment and growth.", "source": "L0 p25"}, {"id": "q50", "topic": 1, "type": "short", "prompt": "Why can a new meeting starting soon change your decision to wait for coffee? Name the principle.", "explanation": "Interdependence: the meeting changes the opportunity cost of waiting, so compare future costs and benefits again.", "source": "L1 pp13–14,32"}, {"id": "q51", "topic": 1, "type": "short", "prompt": "Classify points inside, on, and outside a PPF, and describe better pizza-only technology.", "explanation": "Inside: attainable but inefficient; on: productively efficient; outside: currently unattainable. Pizza-only technology rotates the frontier outward toward the pizza axis while the burger intercept may stay unchanged.", "source": "L1 pp23–27"}, {"id": "q52", "topic": 2, "type": "short", "prompt": "Name four non-price demand shifters.", "explanation": "Any four: income, preferences, prices of related goods, expectations, network/congestion effects, number/type of buyers. Own price is a movement, not a shifter.", "source": "L2 pp21–33"}, {"id": "q53", "topic": 2, "type": "short", "prompt": "Explain the difference between a network effect and congestion in one sentence.", "explanation": "More users raise usefulness and demand with a network effect, but lower usefulness and demand with congestion.", "source": "L2 p32"}, {"id": "q54", "topic": 3, "type": "short", "prompt": "Give two reasons supply can shift right.", "explanation": "Lower input prices, improved productivity, more sellers, a lower price of a substitute in production, or a higher price of a complement in production. Each increases supply at a given own price.", "source": "L3 pp21–37"}, {"id": "q55", "topic": 3, "type": "short", "prompt": "For a storable good, what happens to current supply if sellers expect a higher future price? Why?", "explanation": "Current supply can shift left because selling now sacrifices a more valuable future sale. Storage/deferral must be possible.", "source": "L3 pp31–33"}, {"id": "q56", "topic": 4, "type": "short", "prompt": "Explain how prices help coordinate a market.", "explanation": "Prices convey scarcity and value and give buyers and sellers incentives to adjust their quantities; a shortage pushes price upward and a surplus downward when adjustment is allowed.", "source": "L4 pp6–16"}, {"id": "q57", "topic": 5, "type": "short", "prompt": "Income rises 10%, quantity demanded rises 15%. Calculate and classify income elasticity.", "explanation": "15/10=1.5: positive means normal; greater than 1 means luxury. Retain the sign for income elasticity.", "source": "L5 p25"}, {"id": "q58", "topic": 5, "type": "short", "prompt": "Why is supply often more elastic in the long run?", "explanation": "Producers have more time to obtain inputs, expand capacity and enter or leave markets; short-run capacity constraints limit quantity adjustment.", "source": "L5 pp29–31"}, {"id": "q59", "topic": 6, "type": "short", "prompt": "At a target Q=40, demand gives $9 and supply gives $5. What tax achieves that quantity? What is revenue?", "explanation": "Tax = 9−5=$4 per unit; revenue = 4×40=$160. Demand gives the buyer price and supply the net seller price at the target quantity.", "source": "L6 pp29–31; L9 p22"}, {"id": "q60", "topic": 6, "type": "short", "prompt": "What does a binding quantity quota do to price and quantity in an otherwise competitive market?", "explanation": "A quota below equilibrium restricts quantity, raises the price buyers pay and can generate quota rents; it prevents some mutually beneficial trades.", "source": "L6 p28"}, {"id": "q61", "topic": 7, "type": "short", "prompt": "Define consumer and producer surplus. Is producer surplus always profit?", "explanation": "Consumer surplus is willingness to pay minus price; producer surplus is price minus marginal cost, summed across units. Profit also subtracts fixed costs, so producer surplus need not equal profit.", "source": "L7 pp10–13; L3 p8"}, {"id": "q62", "topic": 7, "type": "short", "prompt": "With linear curves, a $4 tax reduces quantity from 50 to 40. Calculate deadweight loss and explain it.", "explanation": "DWL = ½×4×(50−40)=$20, assuming the untaxed outcome is efficient. It is the surplus lost on the 10 trades prevented by the tax.", "source": "L7 pp27–30"}, {"id": "q63", "topic": 7, "type": "short", "prompt": "Name four sources of market failure covered in the lecture.", "explanation": "Market power, externalities, information problems and irrationality. Government distortions can also reduce efficiency, while intervention can sometimes correct failures.", "source": "L7 pp21–26"}, {"id": "q64", "topic": 8, "type": "short", "prompt": "You move 10 boxes or assemble 2 items per hour; Alex moves 6 boxes or assembles 3. Who should do what? Show opportunity costs.", "explanation": "Your cost per box is 2/10=0.2 items; Alex’s is 3/6=0.5. You move boxes. Your cost per item is 5 boxes; Alex’s is 2. Alex assembles.", "source": "L8 p18"}, {"id": "q65", "topic": 2, "type": "graph", "prompt": "Coffee’s own price falls. Select the change on its demand graph.", "answer": "moveD", "explanation": "Lower own price causes a movement down/right along D, increasing quantity demanded. D does not shift.", "source": "L2 pp20,35–37"}, {"id": "q66", "topic": 2, "type": "graph", "prompt": "Coffee is a normal good and incomes rise. Select the demand change.", "answer": "Dright", "explanation": "Demand shifts right: more is wanted at each price. With an upward-sloping unchanged supply curve, equilibrium price and quantity rise.", "source": "L2 pp21–22"}, {"id": "q67", "topic": 2, "type": "graph", "prompt": "Tea becomes cheaper; tea and coffee are substitutes. Select the change in coffee demand.", "answer": "Dleft", "explanation": "Demand shifts left: less is wanted at each price. With supply unchanged, equilibrium price and quantity fall.", "source": "L2 p26; L4 p24"}, {"id": "q68", "topic": 3, "type": "graph", "prompt": "Coffee beans become more expensive. Select the change in coffee supply.", "answer": "Sleft", "explanation": "Supply shifts left/up as costs rise or capacity falls. With demand unchanged, equilibrium price rises and quantity falls.", "source": "L3 p22"}, {"id": "q69", "topic": 3, "type": "graph", "prompt": "A better machine lowers the marginal cost of coffee. Select the supply change.", "answer": "Sright", "explanation": "Supply shifts right/down when marginal cost falls. With demand unchanged, equilibrium price falls and quantity rises.", "source": "L3 p24"}, {"id": "q70", "topic": 4, "type": "graph", "prompt": "An event attracts more visitors. Select the change in hotel demand.", "answer": "Dright", "explanation": "Demand shifts right: more is wanted at each price. With an upward-sloping unchanged supply curve, equilibrium price and quantity rise.", "source": "L4 p23"}, {"id": "q71", "topic": 4, "type": "graph", "prompt": "A crop is damaged by frost. Select the supply change.", "answer": "Sleft", "explanation": "Supply shifts left/up as costs rise or capacity falls. With demand unchanged, equilibrium price rises and quantity falls.", "source": "L4 p26"}, {"id": "q72", "topic": 3, "type": "graph", "prompt": "Coffee’s own market price rises with costs unchanged. Select the change in quantity supplied.", "answer": "moveS", "explanation": "A higher own price causes a movement up/right along S, increasing quantity supplied. S does not shift.", "source": "L3 pp20,38"}, {"id": "q73", "topic": 1, "type": "mc", "prompt": "A point strictly inside a PPF is…", "options": ["unattainable", "attainable but productively inefficient", "always the fairest choice", "proof that resources are unlimited"], "answer": 1, "explanation": "An interior point is feasible but leaves productive resources underused. Fairness cannot be inferred from the PPF, and scarcity still limits the frontier.", "source": "L1 pp23–27"}, {"id": "q74", "topic": 2, "type": "mc", "prompt": "Buyers expect a storable good to cost more next month. Holding its current price fixed, current demand tends to…", "options": ["shift right", "shift left", "move up along demand", "remain unchanged by definition"], "answer": 0, "explanation": "Expected higher future prices encourage purchases now at each current price. This is a change in expectations, not an own-current-price movement.", "source": "L2 pp30–31"}, {"id": "q75", "topic": 3, "type": "mc", "prompt": "Extra workers add 15, 12, 9, 6, 3 and 0 drinks per hour. Each drink sells for $3 and each worker costs $12 per hour. How many should be hired?", "options": ["3", "4", "5", "6"], "answer": 1, "explanation": "Marginal revenue benefits are $45, $36, $27, $18, $9 and $0. Hire four: the fifth adds only $9 against a $12 wage. Do not compare the wage with total output.", "source": "L9 p35; L3 pp15–16"}, {"id": "q76", "topic": 4, "type": "mc", "prompt": "Demand and supply both increase. What is certain?", "options": ["Price increases", "Quantity increases; price is ambiguous", "Quantity decreases", "Price and quantity are both ambiguous"], "answer": 1, "explanation": "Both shifts raise quantity. Demand raises price but supply lowers it, so price depends on the relative shifts.", "source": "L4 pp31–32; L9 p14"}, {"id": "q77", "topic": 5, "type": "mc", "prompt": "Price rises 10% and quantity supplied rises 20%. Supply elasticity is…", "options": ["0.5, inelastic", "2, elastic", "−2, elastic", "10, elastic"], "answer": 1, "explanation": "Supply elasticity is 20/10=2. It is positive and greater than 1. The reciprocal is not the requested ratio.", "source": "L5 pp29–31"}, {"id": "q78", "topic": 6, "type": "mc", "prompt": "A quota caps sales at 30 when the competitive equilibrium quantity is 50. With downward demand, the buyer price tends to…", "options": ["fall", "rise", "remain unchanged", "become zero"], "answer": 1, "explanation": "Restricting the quantity available moves the buyer price up the demand curve. A cap above equilibrium would instead be nonbinding.", "source": "L6 p28"}, {"id": "q79", "topic": 7, "type": "mc", "prompt": "A garden benefits neighbours who do not pay for it. If those benefits are ignored, the market tends to provide…", "options": ["too much gardening", "too little gardening", "the efficient amount by definition", "no private benefits"], "answer": 1, "explanation": "This is a positive externality. Private decision makers ignore some social benefits, causing underprovision relative to the social optimum. Private benefits can still exist.", "source": "L7 p23"}, {"id": "q80", "topic": 8, "type": "mc", "prompt": "A worker can produce 12 units of coffee or 4 units of beef per day. With coffee on the vertical axis and beef on the horizontal axis, the straight PPF slope is…", "options": ["−1/3", "−3", "+3", "−12"], "answer": 1, "explanation": "An extra unit of beef sacrifices 12/4=3 units of coffee, so the slope is −3. Reversing the axes gives the reciprocal.", "source": "L8 pp15–17"}, {"id": "h1", "topic": 1, "type": "mc", "prompt": "Why does a student with a full scholarship still face scarcity?", "options": ["Time and attention remain limited", "All opportunity costs disappear", "Only tuition creates scarcity", "Scarcity only concerns money"], "answer": 0, "explanation": "Free tuition does not create unlimited time. Studying still sacrifices the next-best activity.", "source": "Original analogue of 2025 midterm Q1; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h2", "topic": 1, "type": "mc", "prompt": "A seller values keeping a guitar at $450 and is offered $350. Why reject?", "options": ["Keeping it is worth $100 more than selling", "The asking price alone fixes its economic value", "Selling creates $100 of seller surplus", "All past spending must be recovered"], "answer": 0, "explanation": "The relevant forgone benefit of selling is keeping the guitar, valued at $450. The $350 offer is below that reservation value; past payments need not determine today's choice.", "source": "Original analogue of 2025 midterm Q2; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h4", "topic": 6, "type": "mc", "prompt": "At P=$4, Qd=12 and Qs=6; at P=$5, both are 9; at P=$6, Qd=6 and Qs=12. A price ceiling of $6 results in sales of…", "options": ["6", "9", "12", "18"], "answer": 1, "explanation": "The ceiling is above the $5 equilibrium and is nonbinding. The market remains at $5 and 9 units; do not force price to equal a nonbinding ceiling.", "source": "Original analogue of 2025 midterm Q4; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h5", "topic": 3, "type": "mc", "prompt": "A clinic provides 10 visits weekly alone. With 1, 2, 3, 4 added workers, TOTAL visits become 30, 46, 58, 64. Visits earn $100 each; each worker costs $900 weekly. How many add?", "options": ["1", "2", "3", "4"], "answer": 2, "explanation": "Marginal visits are 20,16,12,6, worth $2000,$1600,$1200,$600. The first three exceed the $900 wage; the fourth does not. Compare incremental, not total, output.", "source": "Original analogue of 2025 midterm Q5; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h6", "topic": 6, "type": "mc", "prompt": "The graph has D: P=14−Q and S: P=2+Q. Removing a binding $6 price ceiling changes units sold from…", "options": ["4 to 6", "8 to 6", "6 to 8", "4 to 8"], "answer": 0, "explanation": "At the ceiling, Qs=4 and Qd=8, so only 4 trade. Without it, 14−Q=2+Q gives Q=6 and P=8.", "source": "Original analogue of 2025 midterm Q6; cross-checked with 2026 Chapters 1–8", "pastmock": true, "figure": "<svg viewBox=\"0 0 420 310\" role=\"img\" aria-label=\"Numerical market graph; equations and values are also stated in the question\"><path d=\"M55 25V270H390\" stroke=\"#87998b\" fill=\"none\"/><text x=\"12\" y=\"25\">Price</text><text x=\"335\" y=\"302\">Quantity</text><text x=\"50\" y=\"288\">0</text><text x=\"102\" y=\"288\">2</text><text x=\"154\" y=\"288\">4</text><text x=\"206\" y=\"288\">6</text><text x=\"258\" y=\"288\">8</text><text x=\"310\" y=\"288\">10</text><text x=\"362\" y=\"288\">12</text><text x=\"25\" y=\"274.0\">0</text><text x=\"25\" y=\"240.42857142857144\">2</text><text x=\"25\" y=\"206.85714285714286\">4</text><text x=\"25\" y=\"173.28571428571428\">6</text><text x=\"25\" y=\"139.71428571428572\">8</text><text x=\"25\" y=\"106.14285714285714\">10</text><text x=\"25\" y=\"72.57142857142858\">12</text><text x=\"25\" y=\"39.0\">14</text><path d=\"M55 35.0L367 236.42857142857144\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"327\" y=\"228.42857142857144\">D / MB</text><path d=\"M55 236.42857142857144L367 35.0\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"327\" y=\"27.0\">S / MPC</text></svg>"}, {"id": "h7", "topic": 1, "type": "mc", "prompt": "You choose between walking and the bus. Which costs belong in the comparison, assuming no indirect effects?", "options": ["Bus fare, travel time and discomfort", "Only bus fare", "Gasoline for a car you will not use", "Only costs with receipts"], "answer": 0, "explanation": "Include monetary and nonmonetary differences between the actual alternatives. Unused gasoline is irrelevant under the stated assumption.", "source": "Original analogue of 2025 midterm Q7; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h8", "topic": 8, "type": "mc", "prompt": "A person is more productive than a partner at both tasks. Specialization can still help if…", "options": ["their opportunity costs differ", "both have zero costs", "the slower partner has absolute advantage in both", "their relative productivities are identical"], "answer": 0, "explanation": "Comparative advantage depends on relative opportunity cost. Absolute productivity differences alone do not determine who should specialize in each task.", "source": "Original analogue of 2025 midterm Q8; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h10", "topic": 2, "type": "mc", "prompt": "Which set shifts demand LEFT in each case?", "options": ["Lower popularity, higher income for an inferior good, cheaper substitute", "More buyers, cheaper complement, greater popularity", "Higher income for a normal good, dearer substitute, network benefits", "Lower own price, higher own price, unchanged income"], "answer": 0, "explanation": "All three in the first set lower willingness to buy at each own price. The next sets raise demand; own-price changes cause movements.", "source": "Original analogue of 2025 midterm Q10; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h11", "topic": 8, "type": "mc", "prompt": "In a day, Lee makes 12 muffins or 12 cookies; Sam makes 6 muffins or 4 cookies. Lee has absolute and comparative advantage in…", "options": ["muffins only", "cookies", "neither good", "both goods by definition"], "answer": 1, "explanation": "Lee is absolutely faster at both. A cookie costs Lee 1 muffin and Sam 1.5 muffins, so Lee has comparative advantage in cookies. Sam has comparative advantage in muffins.", "source": "Original analogue of 2025 midterm Q11; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h12", "topic": 1, "type": "mc", "prompt": "You receive a free, non-resellable concert ticket. Attending costs you…", "options": ["nothing", "the printed ticket price", "the value of your next-best use of the evening, plus any new attendance costs", "every activity you could ever do"], "answer": 2, "explanation": "The ticket payment is zero, but time and other incremental attendance costs matter. Count the next-best alternative, not all alternatives together.", "source": "Original analogue of 2025 midterm Q12; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h15", "topic": 7, "type": "mc", "prompt": "Which competitive market is most likely to underprovide output when unpriced spillovers are ignored?", "options": ["Vaccinations that protect neighbours", "A good with no spillovers or information problems", "A good whose price freely adjusts with no failures", "A good merely becoming more popular"], "answer": 0, "explanation": "Protection to others is a positive externality. Private demand ignores part of social benefit, potentially causing underproduction.", "source": "Original analogue of 2025 midterm Q15; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h17", "topic": 1, "type": "mc", "prompt": "Technology doubles both intercepts of a straight PPF from (Qx=6,Qy=12) to (12,24). The cost per unit of x…", "options": ["doubles", "halves", "stays at 2 units of y", "becomes zero"], "answer": 2, "explanation": "The frontier expands, but the ratio 12/6=24/12=2 is unchanged. Proportional productivity growth need not change opportunity cost.", "source": "Original analogue of 2025 midterm Q17; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h19", "topic": 6, "type": "mc", "prompt": "Before tax, P=$50. After a $12 tax, buyers pay $58 and sellers receive $46. Buyer and seller burdens per unit are…", "options": ["$8 and $4", "$4 and $8", "$12 and $0", "$58 and $46"], "answer": 0, "explanation": "Buyer burden=58−50=8; seller burden=50−46=4; their sum is the $12 wedge. Net/gross prices are not themselves the burdens.", "source": "Original analogue of 2025 midterm Q19; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h20", "topic": 5, "type": "mc", "prompt": "Price rises from $4 to $4.40 and quantity falls by a GIVEN 30%. Using midpoint change for price, demand elasticity magnitude is…", "options": ["0.32", "3.15", "3.00", "30"], "answer": 1, "explanation": "Midpoint price change=0.40/4.20=9.5238%. Use the provided 30% quantity change as given: 30/9.5238=3.15, elastic. Do not recompute a percentage without quantity endpoints.", "source": "Original analogue of 2025 midterm Q20; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h22", "topic": 5, "type": "mc", "prompt": "With elastic demand over the interval, a price increase causes total revenue to…", "options": ["increase", "decrease", "stay constant", "equal profit"], "answer": 1, "explanation": "The percentage quantity reduction exceeds the percentage price rise, so P×Q falls. Revenue does not subtract costs.", "source": "Original analogue of 2025 midterm Q22; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h23", "topic": 3, "type": "mc", "prompt": "Which shifts the supply of ice cream left?", "options": ["A rise in cream input prices", "A rise in consumer income", "A fall in ice cream's own price", "A rise in its popularity"], "answer": 0, "explanation": "Higher input cost raises marginal cost at each quantity. Own price changes quantity supplied; income and tastes affect demand.", "source": "Original analogue of 2025 midterm Q23; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h24", "topic": 8, "type": "mc", "prompt": "Making 20 additional phones sacrifices 60 computers. The opportunity cost of 4 phones is…", "options": ["3 computers", "12 computers", "15 computers", "80 computers"], "answer": 1, "explanation": "Each phone costs 60/20=3 computers. Four cost 4×3=12. Keep units attached to ratios.", "source": "Original analogue of 2025 midterm Q24; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h25", "topic": 2, "type": "mc", "prompt": "Soup and salad are substitutes. Salad becomes cheaper. Soup demand…", "options": ["shifts right", "shifts left", "moves down its existing curve because salad's price changed", "must remain fixed"], "answer": 1, "explanation": "Consumers switch toward salad, reducing demand for soup at every soup price. The other good's price is a shifter.", "source": "Original analogue of 2025 midterm Q25; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h26", "topic": 5, "type": "mc", "prompt": "Income rises from $1800 to $2200. Quantity demanded rises by a GIVEN 15%. Midpoint income elasticity is…", "options": ["0.75", "1.33", "−0.75", "1.00"], "answer": 0, "explanation": "Midpoint income change=400/2000=20%. Elasticity=15/20=0.75: a normal necessity, not an inferior good or luxury.", "source": "Original analogue of 2025 midterm Q26; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h27", "topic": 2, "type": "mc", "prompt": "More retirees buy cruises at every cruise price. This is…", "options": ["a decrease in quantity demanded", "a movement along demand caused by cruise price", "an increase in demand", "a decrease in supply"], "answer": 2, "explanation": "The number/type of buyers changes. It shifts demand, rather than describing a response to the cruise's own price.", "source": "Original analogue of 2025 midterm Q27; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h30", "topic": 3, "type": "mc", "prompt": "Workers add 18,15,12,9,6,3,0 drinks per hour. Drinks sell for $4 and wages are $20 per hour. Hire…", "options": ["4", "5", "6", "7"], "answer": 1, "explanation": "Marginal revenue products are 72,60,48,36,24,12,0 dollars per hour. The fifth earns $24≥$20; the sixth earns $12<$20. Use the same time units for wages and output.", "source": "Original analogue of 2025 midterm Q30; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h31", "topic": 2, "type": "mc", "prompt": "Community-college education is explicitly assumed to be an inferior good. Incomes fall in a recession. Its demand…", "options": ["shifts right", "shifts left", "does not change", "moves only along D"], "answer": 0, "explanation": "For an inferior good, lower income increases demand. The inferior-good assumption is essential; do not infer it from the name of the product alone.", "source": "Original analogue of 2025 midterm Q31; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h33", "topic": 6, "type": "mc", "prompt": "Demand is more elastic than supply. A tax causes the seller's net price to fall by ___ the buyer's price rises.", "options": ["less than", "more than", "exactly as much as", "zero regardless of the tax"], "answer": 1, "explanation": "The relatively inelastic sellers bear more because they adjust quantity less easily. Statutory tax assignment does not change this comparison.", "source": "Original analogue of 2025 midterm Q33; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h35", "topic": 6, "type": "mc", "prompt": "D: P=14−Q and S: P=2+Q. A $4 per-unit subsidy to buyers changes quantity from 6 to 8. Buyer net price and seller receipt become…", "options": ["$6 and $10", "$10 and $6", "$8 and $12", "$4 and $8"], "answer": 0, "explanation": "At Q=8, original D gives buyer net price 14−8=6; S gives seller receipt 2+8=10. The $4 subsidy fills the gap. The demand curve expressed in seller-price terms shifts up by $4.", "source": "Original analogue of 2025 midterm Q35; cross-checked with 2026 Chapters 1–8", "pastmock": true, "figure": "<svg viewBox=\"0 0 420 310\" role=\"img\" aria-label=\"Numerical market graph; equations and values are also stated in the question\"><path d=\"M55 25V270H390\" stroke=\"#87998b\" fill=\"none\"/><text x=\"12\" y=\"25\">Price</text><text x=\"335\" y=\"302\">Quantity</text><text x=\"50\" y=\"288\">0</text><text x=\"102\" y=\"288\">2</text><text x=\"154\" y=\"288\">4</text><text x=\"206\" y=\"288\">6</text><text x=\"258\" y=\"288\">8</text><text x=\"310\" y=\"288\">10</text><text x=\"362\" y=\"288\">12</text><text x=\"25\" y=\"274.0\">0</text><text x=\"25\" y=\"240.42857142857144\">2</text><text x=\"25\" y=\"206.85714285714286\">4</text><text x=\"25\" y=\"173.28571428571428\">6</text><text x=\"25\" y=\"139.71428571428572\">8</text><text x=\"25\" y=\"106.14285714285714\">10</text><text x=\"25\" y=\"72.57142857142858\">12</text><text x=\"25\" y=\"39.0\">14</text><path d=\"M55 35.0L367 236.42857142857144\" stroke=\"#376c9c\" stroke-width=\"3\"/><text x=\"327\" y=\"228.42857142857144\">D / MB</text><path d=\"M55 236.42857142857144L367 35.0\" stroke=\"#bd7747\" stroke-width=\"3\"/><text x=\"327\" y=\"27.0\">S / MPC</text></svg>"}, {"id": "h37", "topic": 5, "type": "mc", "prompt": "The price of product B falls 25% and demand for A falls 40%. Cross-price elasticity of A with respect to B is…", "options": ["+1.6, substitutes", "−1.6, complements", "+0.625, complements", "−0.625, substitutes"], "answer": 0, "explanation": "Divide −40% by −25%=+1.6. A positive cross-price elasticity indicates substitutes; retain both signs before dividing.", "source": "Original analogue of 2025 midterm Q37; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h38", "topic": 4, "type": "mc", "prompt": "A market has (P,Qd,Qs) values (4,16,8), (5,14,10), (6,12,12), (7,10,14). Zero excess supply occurs at…", "options": ["$4", "$5", "$6", "$7"], "answer": 2, "explanation": "At $6, Qd=Qs=12. Zero surplus means no excess supply, not zero consumer or producer surplus.", "source": "Original analogue of 2025 midterm Q38; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h39", "topic": 2, "type": "mc", "prompt": "Buyers expect houses to be cheaper later. Isolate the buyer-expectations channel; current supply stays fixed. Current demand…", "options": ["shifts left", "shifts right", "moves along D only", "is unchanged by definition"], "answer": 0, "explanation": "Buyers postpone purchases, reducing demand at each current price. Holding current supply fixed avoids mixing in sellers' expectations.", "source": "Original analogue of 2025 midterm Q39; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "h40", "topic": 4, "type": "mc", "prompt": "For a normal good, which single change lowers BOTH equilibrium price and quantity?", "options": ["Income falls", "Input costs fall", "More firms enter", "Productivity rises"], "answer": 0, "explanation": "Falling income shifts demand left. The other changes shift supply right, lowering price but increasing quantity.", "source": "Original analogue of 2025 midterm Q40; cross-checked with 2026 Chapters 1–8", "pastmock": true}, {"id": "x1", "topic": 7, "type": "mc", "prompt": "Which is a normative statement?", "options": ["A tax reduces quantity in this model", "The tax should be adopted because its distribution is fairer", "Demand slopes down in this model", "Revenue equals price times quantity"], "answer": 1, "explanation": "Normative statements make value judgments about what should happen. Positive statements describe or predict outcomes and can be tested.", "source": "Cheat sheets: Chapter 7"}, {"id": "x2", "topic": 8, "type": "mc", "prompt": "The knowledge problem arises when…", "options": ["relevant knowledge is dispersed or unavailable to the decision maker", "all people have perfect information", "all prices equal zero", "comparative advantage disappears"], "answer": 0, "explanation": "Prices can aggregate dispersed information, although they do not ensure perfect knowledge or remove all market failures.", "source": "Cheat sheets: Chapter 8"}, {"id": "x3", "topic": 8, "type": "mc", "prompt": "An internal market allows…", "options": ["divisions within an organization to trade scarce resources", "only governments to set all prices", "firms to eliminate opportunity costs", "buyers to avoid every payment"], "answer": 0, "explanation": "Internal prices can help allocate scarce resources among competing uses inside an organization.", "source": "Cheat sheets: Chapter 8"}, {"id": "x4", "topic": 8, "type": "mc", "prompt": "A prediction market trades contracts whose payoffs depend on…", "options": ["whether a specified uncertain event occurs", "a guaranteed perfect forecast", "the total fixed costs of a firm", "the existence of zero risk"], "answer": 0, "explanation": "Such markets aggregate participants’ information and beliefs; their forecasts are not guaranteed to be correct.", "source": "Cheat sheets: Chapter 8"}, {"id": "x5", "topic": 5, "type": "mc", "prompt": "A vertical demand curve has price elasticity…", "options": ["zero", "one", "infinite", "always negative infinity"], "answer": 0, "explanation": "Quantity does not respond to price, so percentage quantity change is zero. A horizontal curve is the perfectly elastic limiting case.", "source": "Cheat sheets: Chapter 5"}, {"id": "x6", "topic": 6, "type": "mc", "prompt": "A mandate to buy or sell at least a minimum quantity differs from a quota because a quota…", "options": ["sets a maximum quantity", "always raises efficiency", "sets a minimum price", "is a tax on buyers"], "answer": 0, "explanation": "A mandate is a minimum-quantity requirement; a quota caps quantity. A price floor instead sets a minimum price.", "source": "Cheat sheets: Chapter 6"}];</script><script>const TOPICS=['','Choices & opportunity cost','Demand & consumer choice','Supply & producer choice','Market equilibrium','Elasticity','Taxes & market rules','Efficiency & market failure','Comparative advantage'];
const NOTES=[null,
['Start with the next-best alternative.',['Scarcity forces choices. Economic cost includes direct costs and the value of what you give up. Do not add every rejected alternative.','Ignore sunk costs: only costs and benefits that differ between your current choices matter.','Take another step if marginal benefit ≥ marginal cost. In discrete problems, stop before the next unit costs more than it benefits you.','A PPF shows feasible production: on = efficient, inside = inefficient, outside = unattainable today. With pizza on x and burgers on y, the absolute slope is burgers forgone per pizza.','Interdependence means other people, markets, expectations and your other decisions affect your best choice. A framing effect changes choices by changing the description of the same outcome.']],
['Demand is willingness to pay at the margin.',['Buy units with MB ≥ price. Diminishing marginal benefit explains the usual downward slope.','Market demand adds individual quantities at the SAME price: add horizontally, not vertically.','Own price changes → movement along D. Income, tastes, related prices, expectations, users and buyer numbers → shifts.','Normal good: income ↑ → D right. Inferior good: income ↑ → D left.','Substitute price ↑ → D right. Complement price ↑ → D left. More users can increase value (network) or reduce it (congestion).']],
['Supply is the cost of one more unit.',['For a competitive price-taking seller, produce units with MC ≤ price. Rising MC produces the usual upward supply slope.','Extra ingredients and labour are variable costs. A committed fixed cost does not change the cost of one more unit.','Own price changes → movement along S. Changes in marginal cost or seller numbers → shifts.','Input prices ↑ → S left; better technology → S right; more sellers → market S right.','A more valuable substitute in production raises opportunity cost and shifts S left. A more valuable joint product can shift S right. Expected higher future prices can reduce current supply when sales can be deferred.']],
['Always identify the cause before drawing arrows.',['Equilibrium: Qd = Qs. A shortage creates upward price pressure; a surplus creates downward pressure when prices can adjust.','At a fixed price, actual voluntary trades are limited by min(Qd, Qs), absent government purchases.','D right → P ↑, Q ↑. D left → P ↓, Q ↓. S right → P ↓, Q ↑. S left → P ↑, Q ↓.','When two curves shift, analyze them separately. Same-direction predictions are definite; opposing predictions need relative shift sizes.','Demand rising does not itself shift supply: the resulting price rise creates a movement along supply. Prices communicate information and provide incentives.']],
['Elasticity is percentage responsiveness.',['Midpoint change: (new − old) / [(new + old)/2]. Elasticity = %ΔQ / %ΔP. For price elasticity of demand use the absolute value.','Demand: E > 1 elastic; E < 1 inelastic; E = 1 unit elastic. A constant slope does not mean constant elasticity.','Price ↑: total revenue falls with elastic demand, rises with inelastic demand, stays unchanged with unit elasticity over the interval. Revenue is P×Q, not profit.','Keep signs for income and cross-price elasticity. Income E < 0: inferior; 0 < E < 1: normal necessity; E > 1: normal luxury. Cross-price E > 0: substitutes; E < 0: complements.','Demand is often more elastic with substitutes, narrow product definitions, easier search and more time. Supply is often more elastic with available inputs and time to expand capacity.']],
['With a tax or subsidy, keep two prices.',['Tax: Pb − Ps = tax per unit. Tax revenue = tax × quantity AFTER tax. Buyer tax shifts D down; seller tax shifts S up.','Statutory burden is who remits; economic burden is who loses through changed prices. The relatively less elastic side bears more tax.','Subsidy: Ps − Pb = subsidy. Buyers pay less net, sellers receive more, quantity rises; the less elastic side captures more benefit.','Binding ceiling: maximum below equilibrium → shortage. Binding floor: minimum above equilibrium → surplus. A nonbinding rule leaves equilibrium unchanged.','A binding quota sets quantity below equilibrium. Read demand at that quantity for buyer price. To hit a target with a tax, subtract the supply price from the demand price at the target.']],
['Efficiency maximizes total surplus.',['Consumer surplus: below demand and above price. Producer surplus: above supply and below price. For triangles use ½×base×height.','Efficient production uses lowest-cost producers; efficient allocation serves highest willingness-to-pay buyers; efficient quantity has MB = MC.','Efficiency is different from equity. Willingness to pay is affected by income, and higher total surplus does not mean everyone gains.','Market power, externalities, information problems and irrationality can cause market failure. Negative externalities can lead to too much output; positive externalities to too little.','Deadweight loss is destroyed surplus, not a transfer. Underproduction misses MB > MC trades; overproduction adds MC > MB units. For a linear tax wedge without other failures: DWL = ½×tax×quantity reduction. Government can correct failures or create distortions.']],
['Compare opportunity costs, not speed alone.',['Absolute advantage: more output from the same inputs, or fewer inputs per unit. Comparative advantage: lower opportunity cost.','When given time per unit: OC of A = time for A / time for B, measured in units of B.','When given outputs per hour: OC of A = maximum B / maximum A, measured in units of B.','Specialize according to comparative advantage. Someone who is absolutely better at both tasks can still gain from specialization with another person.','Calculate production before and after using actual time allocations. Opportunity costs can change as technology, skills or resources change.']]];
NOTES[5][1].push('Perfectly inelastic: vertical curve, E=0. Perfectly elastic: horizontal curve, limiting E is infinite.');
NOTES[7][1].push('Positive analysis describes or predicts what happens; normative analysis makes a value judgment about what should happen.');
NOTES[8][1].push('Supplemental Chapter 8 vocabulary: internal markets allocate resources within an organization; the knowledge problem is missing or dispersed decision-relevant information; prediction-market payoffs depend on uncertain events.');
const KEY='ec120-study-v1';let state={attempts:[],sessions:[],active:null},storageOK=true;try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(Array.isArray(x.attempts)&&Array.isArray(x.sessions))state=x;}}catch{storageOK=false}let active=state.active,ticker;const app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){state.active=active;try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false}}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function latest(id){return state.attempts.filter(a=>a.id===id).at(-1)}function autoAttempts(){return state.attempts.filter(a=>!a.self&&BANK.some(q=>q.id===a.id))}function pct(a){return a.length?Math.round(100*a.filter(x=>x.correct).length/a.length)+'%':'—'}function sethtml(s){app.innerHTML=s;window.scrollTo(0,0)}
function graph(kind='',answer=false){let lines='<path d="M65 35V260H400" fill="none" stroke="#85968a" stroke-width="1.5"/><text x="32" y="40">Price</text><text x="335" y="288">Quantity</text>';let d='<path d="M90 65L355 235" stroke="#376c9c" stroke-width="3"/><text x="360" y="239">D</text>',s='<path d="M90 235L355 65" stroke="#bd7747" stroke-width="3"/><text x="360" y="65">S</text>';let extra='';if(kind==='Dright'||kind==='Dleft'){let k=kind==='Dright'?45:-38;extra=`<path d="M${90+k} 65L${355+k} 235" stroke="#376c9c" stroke-width="3" stroke-dasharray="7 5"/><text x="${340+k}" y="251">D₂</text><path d="M220 115h${k}" stroke="#376c9c" stroke-width="2"/>`;}if(kind==='Sright'||kind==='Sleft'){let k=kind==='Sright'?45:-38;extra=`<path d="M${90+k} 235L${355+k} 65" stroke="#bd7747" stroke-width="3" stroke-dasharray="7 5"/><text x="${340+k}" y="51">S₂</text>`;}if(kind==='moveD'){extra='<circle cx="143" cy="99" r="6" fill="#376c9c"/><text x="125" y="86">A</text><circle cx="302" cy="201" r="6" fill="#376c9c"/><text x="305" y="188">B</text><text x="125" y="278">A → B: lower P, higher Qd</text>';}if(kind==='moveS'){extra='<circle cx="143" cy="201" r="6" fill="#bd7747"/><text x="125" y="188">A</text><circle cx="302" cy="99" r="6" fill="#bd7747"/><text x="305" y="86">B</text><text x="125" y="278">A → B: higher P, higher Qs</text>';}return `<svg viewBox="0 0 450 305" role="img" aria-label="Supply and demand diagram${kind?': '+kind:''}. Dashed line is the shifted curve. Solid blue is demand and solid orange is supply.">${lines+d+s+extra}</svg>`}
function home(){clearInterval(ticker);let aa=autoAttempts(),seen=new Set(state.attempts.filter(a=>BANK.some(q=>q.id===a.id)).map(a=>a.id));sethtml(`<section class="hero"><div><div class="eyebrow">Your economics practice space</div><h1>Understand the why.<br>Then ace the choice.</h1><p>Build your foundation, test your reasoning, and turn mistakes into a study plan. Only your current curriculum: Chapters 1–8.</p><button class="primary" onclick="start('diagnostic')">Start 16-question diagnostic →</button></div><div class="hero-art">${graph('Dright')}<p>Same market. New conditions. Can you explain the change?</p></div></section><div class="stats"><div class="stat"><b>${seen.size}<span> / ${BANK.length}</span></b><span>Questions attempted</span></div><div class="stat"><b>${pct(aa)}</b><span>Auto-graded accuracy · all attempts</span></div><div class="stat"><b>${BANK.filter(q=>latest(q.id)&&!latest(q.id).correct).length}</b><span>Questions to revisit</span></div><div class="stat"><b>${state.sessions.filter(s=>s.mode==='exam').length}</b><span>Mock exams finished</span></div></div>${!storageOK?'<p id="storagewarn">Browser storage is unavailable. Export progress before closing.</p>':''}${active?`<div class="notice">You have an unfinished ${active.mode} session. <button onclick="resume()">Resume session →</button></div>`:''}<div class="grid"><article class="card featured"><span class="num">01 / LEARN</span><h3>Build the foundation</h3><p>Short explanations, formulas and common traps. Then practise one chapter at a time.</p><button onclick="foundations()">Open foundation guide →</button></article><article class="card"><span class="num">02 / APPLY</span><h3>Practice with feedback</h3><p>${BANK.length} questions: multiple choice, short answers and interactive graph choices. Explain your reasoning before checking.</p><button onclick="start('practice')">Practice core topics →</button><button class="quiet" onclick="labHome()">Graph-only area · drag the curves</button></article><article class="card"><span class="num">03 / TEST</span><h3>The 60-minute mock</h3><p>40 multiple-choice questions, five per chapter. Answers stay hidden until you finish. Use your calculator and study sheet.</p><button onclick="start('exam')">Start mock exam →</button></article></div><article class="card featured" style="margin-top:24px"><span class="num">04 / DRAW</span><h2>Graph-only practice</h2><p>Move demand and supply curves yourself. Practise shifts, movements along curves, and the resulting equilibrium. 14 hands-on scenarios with saved feedback.</p><button class="primary" onclick="labHome()">Open graph lab →</button></article><button class="quiet" onclick="audit()">Cheat-sheet corrections & scope</button><div class="section-head"><h2>Your chapter map</h2><button onclick="start('weak')">Review missed questions</button></div><div class="topicgrid">${TOPICS.slice(1).map((t,i)=>{let a=aa.filter(x=>x.topic===i+1);return `<button class="topicrow" onclick="start('topic',${i+1})"><span class="pill">0${i+1}</span><strong>${t}</strong><small>${a.length?pct(a)+' · '+a.length+' attempts':'Not started'} →</small></button>`}).join('')}</div><div class="section-head"><h2>Study together</h2><button onclick="report()">View progress report</button></div><p class="muted">After the diagnostic, export your progress and share the file in our chat. It includes your choices, reasoning, confidence and timing so we can target the gaps. This app does not automatically send results to chat.</p><div class="notice"><strong>Scope:</strong> Lectures 0–9, cross-checked against the supplied cheat sheets and 2025 exam. Only Chapters 1–8 are included; practice inspired by the older exam is restricted to those chapters. Lecture 9 specifies 40 MCQs in 60 minutes and allows one double-sided 8.5×11 study sheet. Short-answer and graph drills are extra learning practice. The slides say textbook content is testable; the supplied Econ.pdf is a different 2017 textbook test bank, so it does not determine 2026 exam scope. Later-course topics in some sheets are excluded. References use PDF page numbers, which can differ from printed slide numbers.</div><button class="quiet" onclick="document.getElementById('import').click()">Import progress backup</button><input id="import" class="import" type="file" accept="application/json" onchange="importData(this.files[0])">`)}
function foundations(){clearInterval(ticker);sethtml(`<button onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:30px">Keep the reasoning simple</div><h1>Your foundation guide</h1><p class="muted">Read a chapter, close the guide, then explain its main rule from memory.</p>${NOTES.slice(1).map((n,i)=>`<article class="card studycard"><span class="eyebrow">Chapter ${i+1} · ${TOPICS[i+1]}</span><h2>${n[0]}</h2><ul>${n[1].map(x=>`<li>${x}</li>`).join('')}</ul><button onclick="start('topic',${i+1})">Practise this chapter →</button></article>`).join('')}<div class="notice">Two-step study plan: first do the diagnostic without notes; revisit the weakest chapters and graph rules. Then take a timed mock, review every error, and explain the rule behind it in your own words. Repeated-bank scores reflect practice, not a guaranteed exam prediction.</div>`)}
function start(mode,topic){if(active&&!confirm('Replace your unfinished session? Previously graded practice answers remain saved.'))return;let ids;if(mode==='exam')ids=shuffle(TOPICS.slice(1,9).flatMap((_,i)=>shuffle(BANK.filter(q=>q.topic===i+1&&q.type==='mc')).slice(0,5))).map(q=>q.id);else if(mode==='diagnostic')ids=TOPICS.slice(1,9).flatMap((_,i)=>shuffle(BANK.filter(q=>q.topic===i+1&&q.type==='mc')).slice(0,2)).map(q=>q.id);else if(mode==='weak')ids=BANK.filter(q=>latest(q.id)&&!latest(q.id).correct).map(q=>q.id);else ids=shuffle(BANK.filter(q=>mode==='topic'?q.topic===topic:mode==='graphs'?q.type==='graph':q.topic<=8)).map(q=>q.id);if(!ids.length){alert('No missed questions yet. Start with the diagnostic.');return}active={mode,ids,index:0,responses:{},started:Date.now(),deadline:['exam','pastmock'].includes(mode)?Date.now()+3600000:null,topic};save();showQuestion()}
function resume(){showQuestion()}function current(){return BANK.find(q=>q.id===active.ids[active.index])}function response(){let q=current();return active.responses[q.id]??(active.responses[q.id]={choice:null,text:'',confidence:'unsure',elapsed:0})}let entered=Date.now();function capture(){if(!active||!document.querySelector('.question'))return;let r=response();r.elapsed+=(Date.now()-entered)/1000;entered=Date.now();let txt=document.getElementById('reason');if(txt)r.text=txt.value;let c=document.getElementById('confidence');if(c)r.confidence=c.value;save()}function choose(v){capture();response().choice=v;save();showQuestion(false)}
const GLABELS={Dright:'Shift demand right',Dleft:'Shift demand left',Sright:'Shift supply right',Sleft:'Shift supply left',moveD:'Move down/right along demand',moveS:'Move up/right along supply'};
function showQuestion(scroll=true){clearInterval(ticker);if(!active)return home();if(active.deadline&&Date.now()>=active.deadline)return finish(true);let q=current(),r=response(),exam=['exam','pastmock'].includes(active.mode);entered=Date.now();app.innerHTML=`<div class="quiz"><div class="toolbar"><button onclick="capture();home()">← Save & dashboard</button><span class="pill">${esc(active.mode)} · ${active.index+1} / ${active.ids.length}</span><b id="timer"></b></div><div class="progress"><div style="width:${100*(active.index+1)/active.ids.length}%"></div></div><article class="question"><div class="eyebrow">Chapter ${q.topic} · ${TOPICS[q.topic]} · ${q.type==='mc'?'Multiple choice':q.type==='short'?'Super-short answer':'Graph drill'}</div><h2>${q.prompt}</h2>${q.figure?`<div class="graphwrap">${q.figure}</div>`:""}${q.type==='mc'?`<div class="options">${q.options.map((o,i)=>`<button class="option ${r.choice===i?'selected':''}" ${r.graded?'disabled':''} onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>`:q.type==='graph'?`<div class="graphwrap">${graph(r.choice||'')}</div><p class="muted">Choose a change to preview it. Dashed = shifted curve; A → B = movement. Sketches are schematic, not numerical.</p><div class="graphoptions">${Object.entries(GLABELS).map(([k,v])=>`<button class="${r.choice===k?'selected':''}" ${r.graded?'disabled':''} onclick="choose('${k}')">${v}</button>`).join('')}</div>`:''}${!exam?`<label for="reason">${q.type==='short'?'Your answer · aim for 1–3 sentences':'Why this answer? · optional, but useful'}</label><textarea id="reason" ${r.graded||r.revealed?'disabled':''} oninput="response().text=this.value;save()" placeholder="Put the economic rule into your own words…">${esc(r.text)}</textarea><label for="confidence">How sure are you?</label><select id="confidence" onchange="response().confidence=this.value;save()" ${r.graded?'disabled':''}>${['unsure','somewhat sure','confident'].map(v=>`<option ${r.confidence===v?'selected':''}>${v}</option>`).join('')}</select>`:''}${r.graded||r.revealed?feedback(q,r):''}${!exam&&!r.graded&&!r.revealed?`<div class="actions"><button class="primary" onclick="checkAnswer()">${q.type==='short'?'Reveal model answer':'Check answer'} →</button></div>`:''}${!exam?`<div class="source">Source: ${esc(q.source)} · L = lecture; pages refer to PDF pages.</div>`:''}</article><div class="actions"><button ${active.index===0?'disabled':''} onclick="navigate(-1)">← Previous</button>${active.index<active.ids.length-1?'<button onclick="navigate(1)">Next →</button>':''}<button class="${exam?'primary':'quiet'}" onclick="finish()">${exam?'Submit exam':'Finish session'}</button></div>${exam?`<div class="jumplist">${active.ids.map((id,i)=>`<button class="${active.responses[id]?.choice!=null?'done':''}" onclick="capture();active.index=${i};save();showQuestion()">${i+1}</button>`).join('')}</div><p class="muted">Green numbers have an answer. You can return and change choices before submitting.</p>`:''}</div>`;if(scroll)window.scrollTo(0,0);if(exam){tick();ticker=setInterval(tick,1000)}}
function tick(){if(!active?.deadline)return;let left=Math.max(0,Math.ceil((active.deadline-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' remaining';if(!left)finish(true)}function feedback(q,r){return `<div class="feedback ${r.graded&&!r.correct?'wrong':''}"><h3>${q.type==='short'?'Model answer · self-assessed':r.correct?'Correct — here’s why':'Let’s unpack this'}</h3>${q.type==='mc'?`<strong>Answer ${'ABCD'[q.answer]}: ${q.options[q.answer]}</strong>`:q.type==='graph'?`<strong>${GLABELS[q.answer]}</strong><div class="graphwrap">${graph(q.answer)}</div>`:''}<p>${q.explanation}</p>${q.type==='short'&&!r.graded?'<p class="muted">Compare your answer with the key ideas. This is self-assessment, not automated marking.</p><div class="actions"><button onclick="gradeShort(true)">I included the key ideas</button><button onclick="gradeShort(false)">I need more practice</button></div>':''}</div>`}
function record(q,r,self=false){state.attempts.push({id:q.id,topic:q.topic,type:q.type,correct:r.correct,self,choice:r.choice,text:r.text,confidence:r.confidence,seconds:Math.round(r.elapsed),at:new Date().toISOString(),mode:active.mode})}function checkAnswer(){capture();let q=current(),r=response();if(q.type==='short'){if(!r.text.trim()){alert('Try a short answer first. Even an uncertain attempt helps.');return}r.revealed=true}else{if(r.choice==null){alert('Choose an answer first.');return}r.correct=r.choice===q.answer;r.graded=true;record(q,r)}save();showQuestion(false)}function gradeShort(ok){capture();let q=current(),r=response();if(r.graded)return;r.correct=ok;r.graded=true;record(q,r,true);save();showQuestion(false)}function navigate(step){capture();active.index+=step;save();showQuestion()}
